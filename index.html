 * ========================================================================= */
let searchQuery = '';
let searchHits = [];
let searchIdx = -1;
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');

function doSearch(q) {
  searchQuery = q.trim().toLowerCase();
  searchHits = [];
  searchIdx = -1;
  if (!searchQuery) { applySearchHighlight(); updateSearchCount(); return; }

  let needRender = false;
  for (const n of state.nodes) {
    const id = computeId(n);
    const hay = [n.title, n.note, id || '', n.baseId || ''].join(' ').toLowerCase();
    if (!hay.includes(searchQuery)) continue;
    searchHits.push(n.id);
    let cur = parentOf(n.id), g = 0;
    while (cur && g++ < 60) {
      if (cur.collapsed) { cur.collapsed = false; needRender = true; }
      cur = parentOf(cur.id);
    }
  }
  if (needRender) render();
  applySearchHighlight();
  updateSearchCount();
}
function applySearchHighlight() {
  const nodes = canvas.querySelectorAll('.node');
  if (!searchQuery) { nodes.forEach(n => n.classList.remove('search-hit', 'search-dim')); return; }
  const hitSet = new Set(searchHits);
  nodes.forEach(n => {
    const isHit = hitSet.has(n.dataset.id);
    n.classList.toggle('search-hit', isHit);
    n.classList.toggle('search-dim', !isHit);
  });
}
function updateSearchCount() {
  if (!searchQuery) { searchCount.textContent = ''; return; }
  searchCount.textContent = searchHits.length
    ? `${searchIdx >= 0 ? searchIdx + 1 : 0}/${searchHits.length}` : '0';
}
function gotoHit(delta) {
  if (!searchHits.length) return;
  searchIdx = (searchIdx + delta + searchHits.length) % searchHits.length;
  scrollToNode(searchHits[searchIdx]);
  updateSearchCount();
}
searchInput.addEventListener('input', () => doSearch(searchInput.value));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); gotoHit(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { searchInput.value = ''; doSearch(''); searchInput.blur(); }
});
document.getElementById('searchNext').onclick = () => gotoHit(1);
document.getElementById('searchPrev').onclick = () => gotoHit(-1);

function scrollToNode(id) {
  const nodeEl = canvas.querySelector(`.node[data-id="${id}"]`);
  if (!nodeEl) return;
  const targetX = (nodeEl.offsetLeft + nodeEl.offsetWidth / 2) * zoom - stage.clientWidth / 2;
  const targetY = (nodeEl.offsetTop + nodeEl.offsetHeight / 2) * zoom - stage.clientHeight / 2;
  stage.scrollTo({ left: targetX, top: targetY, behavior: 'smooth' });
  nodeEl.classList.add('flash');
  setTimeout(() => nodeEl.classList.remove('flash'), 1200);
}

/* =========================================================================
 *  XLSX 生成器
 * ========================================================================= */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);

    const lh = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034B50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    parts.push(lh, data);

    const cd = new Uint8Array(46 + nameBytes.length);
    const dv2 = new DataView(cd.buffer);
    dv2.setUint32(0, 0x02014B50, true);
    dv2.setUint16(4, 20, true);
    dv2.setUint16(6, 20, true);
    dv2.setUint16(8, 0x0800, true);
    dv2.setUint16(10, 0, true);
    dv2.setUint16(12, 0, true);
    dv2.setUint16(14, 0x21, true);
    dv2.setUint32(16, crc, true);
    dv2.setUint32(20, data.length, true);
    dv2.setUint32(24, data.length, true);
    dv2.setUint16(28, nameBytes.length, true);
    dv2.setUint16(30, 0, true);
    dv2.setUint16(32, 0, true);
    dv2.setUint16(34, 0, true);
    dv2.setUint16(36, 0, true);
    dv2.setUint32(38, 0, true);
    dv2.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += lh.length + data.length;
  }
  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const dv3 = new DataView(eocd.buffer);
  dv3.setUint32(0, 0x06054B50, true);
  dv3.setUint16(4, 0, true);
  dv3.setUint16(6, 0, true);
  dv3.setUint16(8, files.length, true);
  dv3.setUint16(10, files.length, true);
  dv3.setUint32(12, centralSize, true);
  dv3.setUint32(16, offset, true);
  dv3.setUint16(20, 0, true);
  return new Blob([...parts, ...central, eocd], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
}
function xmlEsc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'
  })[c]);
}
function xmlClean(s) { return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ''); }
function colLetter(n) {
  let s = '';
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
function buildSheetXml(rows, colWidths) {
  const cols = colWidths.map((w, i) =>
    `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`
  ).join('');
  const rowsXml = rows.map((row, ri) => {
    const cells = row.map((val, ci) => {
      const ref = colLetter(ci + 1) + (ri + 1);
      const s = ri === 0 ? ' s="1"' : '';
      const t = xmlEsc(xmlClean(val == null ? '' : val));
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${t}</t></is></c>`;
    }).join('');
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${cols}</cols>
<sheetData>${rowsXml}</sheetData>
</worksheet>`;
}
function buildXlsxBlob(rows, colWidths) {

    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="订货号" sheetId="1" r:id="rId1"/></sheets>
</workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },
    { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2">
<font><sz val="11"/><name val="微软雅黑"/></font>
<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="微软雅黑"/></font>
</fonts>
<fills count="3">
<fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF4C8DFF"/><bgColor indexed="64"/></patternFill></fill>
</fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="2">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>` },
    { name: 'xl/worksheets/sheet1.xml', data: buildSheetXml(rows, colWidths) }
  ];

}
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 120);
}
function todayStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
}

/* =========================================================================
 *  导出数据收集
 * ========================================================================= */
function collectExportData() {
  const conflicts = checkDuplicates();
  const depthMap = computeNodeDepth();
  return state.nodes.map(n => {
    const p = parentOf(n.id);
    const id = computeId(n);
    const depth = depthMap.get(n.id) ?? 0;
    let status = '正常';
    if (n.kind !== 'root' && !p) status = '未连接';
    else if (conflicts.has(n.id)) status = '同级重复';
    return {
      node: n,
      id: id === null ? '未连接' : (id || '（空）'),
      idRaw: id,
      name: n.title || '',
      depth,
      parentName: p ? (p.title || '') : '—',
      note: n.note || '',
      status,
      imageCount: (n.images || []).length,
      isLeaf: !state.edges.some(e => e.from === n.id),
      isRoot: n.kind === 'root'
    };
  }).sort((a, b) => (a.depth - b.depth) || (a.node.y - b.node.y) || (a.node.x - b.node.x));
}

function buildSheetRows() {
  const rows = collectExportData();
  return [
    ['订货号', '产品名称', '层级', '父节点', '备注', '截图数', '状态', '是否成品'],
    ...rows.map(r => [r.id, r.name, String(r.depth), r.parentName, r.note, String(r.imageCount), r.status, r.isLeaf ? '是' : ''])
  ];
}

document.getElementById('btnExport').onclick = () => {
  if (!state.nodes.length) return toast('还没有任何节点');

  const headHtml = `
    <div class="et-row head">

                : r.status === '未连接'   ? ' unlinked' : '';

                : r.status === '同级重复' ? 'bad' : 'warn';
    return `<div class="et-row">
      <span class="et-id${idCls}">${escapeHtml(r.id)}</span>

  }).join('');

      };
      const csvRows = buildSheetRows();
      const csv = '\uFEFF' + csvRows.map(r => r.map(esc).join(',')).join('\r\n');

function bytesToBase64Url(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function compressData(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof CompressionStream === 'undefined') {
    return 'raw_' + bytesToBase64Url(bytes);
  }
  try {
    const cs = new CompressionStream('gzip');
    const writer = cs.writable.getWriter();
    writer.write(bytes);
    writer.close();
    const chunks = [];
    const reader = cs.readable.getReader();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
    let total = 0;
    for (const c of chunks) total += c.length;
    const out = new Uint8Array(total);
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return 'gz_' + bytesToBase64Url(out);
  } catch (e) {
    return 'raw_' + bytesToBase64Url(bytes);
  }
}
async function decompressData(s) {
  if (s.startsWith('raw_')) {
    return new TextDecoder().decode(base64UrlToBytes(s.slice(4)));
  }
  if (s.startsWith('gz_')) {
    const bytes = base64UrlToBytes(s.slice(3));
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('当前浏览器不支持解压');
    }
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    writer.write(bytes);
    writer.close();
    const chunks = [];
    const reader = ds.readable.getReader();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
    let total = 0;
    for (const c of chunks) total += c.length;
    const out = new Uint8Array(total);
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return new TextDecoder().decode(out);
  }
  throw new Error('未知的编码格式');
}

async function tryRestoreFromHash() {
  const hash = location.hash || '';
  const m = hash.match(/[#&]data=([^&]+)/);
  if (!m) return false;
  try {
    const decoded = decodeURIComponent(m[1]);
    const json = await decompressData(decoded);
    const data = JSON.parse(json);
    if (!data.nodes || !Array.isArray(data.nodes)) throw new Error('数据格式错误');

    state.nodes = data.nodes.map(n => ({
      ...n,
      note: n.note || '',
      images: n.images || [],
      collapsed: !!n.collapsed,
      color: n.color || null,
      rules: n.rules || []
    }));
    state.edges = data.edges || [];
    state.freeMove = !!data.freeMove;
    if (typeof data.autoLayoutOnToggle === 'boolean') {
      autoLayoutOnToggle = data.autoLayoutOnToggle;
    }
    render();
    if (data.zoom && data.zoom !== 1) applyZoom(data.zoom);
    toast('已从分享链接加载数据（' + state.nodes.length + ' 个节点）');
    history.replaceState(null, '', location.pathname + location.search);
    return true;
  } catch (e) {
    console.error('从分享链接恢复失败', e);
    toast('分享链接解析失败：' + (e.message || e));
    return false;
  }
}

/* =========================================================================
 *  CSV 解析 & 导入
 * ========================================================================= */
const importMask = document.getElementById('importMask');
const importBody = document.getElementById('importBody');
const importRunBtn = document.getElementById('importRun');
const importClearFileBtn = document.getElementById('importClearFile');

let importState = {
  fileName: '', fileSize: 0, parsedRows: [],
  builtNodes: [], builtEdges: [], errors: [], warnings: [], previewRows: []
};

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [];
  let cell = '';
  let i = 0;
  let inQuotes = false;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      cell += c; i++;
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(cell); cell = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
      cell += c; i++;
    }
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function parseRuleToken(token) {
  const t = token.trim();
  if (!t) return null;

  let m = t.match(/^(选项|choice|C)\s*[:：]\s*(.+)$/i);
  if (m) {
    const opts = m[2].split(/[|｜]/).map(s => s.trim()).filter(Boolean).map(s => {
      const parts = s.split(/[:：]/);
      if (parts.length >= 2) return { code: parts[0].trim(), label: parts.slice(1).join(':').trim() };
      return { code: s, label: s };
    });
    if (!opts.length) return null;
    return {
      type: 'choice',
      options: opts.map(o => `${o.code}:${o.label}`).join(','),
      selected: opts[0].code
    };
  }

  m = t.match(/^(序号|seq|S)\s*[:：]\s*(.+)$/i);
  if (m) {
    const parts = m[2].split(/[|｜]/).map(s => s.trim());
    const value = Number(parts[0]) || 1;
    const digits = Number(parts[1]) || 2;
    const auto = parts[2] && /^(自动|auto|是|yes|1|true)$/i.test(parts[2]);
    return { type: 'seq', value, digits, auto: !!auto };
  }

  m = t.match(/^(日期|date|D)\s*[:：]\s*(.*)$/i);
  if (m) return { type: 'date', format: m[2].trim() || 'YYYYMMDD' };

  m = t.match(/^(固定文本|固定|fixed|F)\s*[:：]\s*(.+)$/i);
  if (m) return { type: 'fixed', text: m[2] };

  return { type: 'fixed', text: t };
}

function detectColumns(rows) {
  if (!rows.length) {
    return { hasHeader: false, colMap: { name: 0, parent: 1, baseId: 2, note: 3, rules: [4] } };
  }
  const first = rows[0].map(c => String(c || '').trim().toLowerCase());
  const headerKeywords = ['名称', 'name', 'title', '节点名称', '父节点', 'parent',
                          '起始id', 'baseid', '备注', 'note', '规则', 'rules', '字段', 'field'];
  const isHeader = first.some(c => headerKeywords.some(k => c === k.toLowerCase() || c.includes(k.toLowerCase())));

  if (!isHeader) {
    const rulesCols = [];
    for (let i = 4; i < Math.max(5, first.length); i++) rulesCols.push(i);
    return { hasHeader: false, colMap: { name: 0, parent: 1, baseId: 2, note: 3, rules: rulesCols } };
  }

  const colMap = { name: -1, parent: -1, baseId: -1, note: -1, rules: [] };
  first.forEach((h, i) => {
    if (colMap.name < 0 && /^(名称|节点名称|name|title|产品名称)$/i.test(h)) colMap.name = i;
    else if (colMap.parent < 0 && /^(父节点|父级|parent|parentname|上级|父节点名称)$/i.test(h)) colMap.parent = i;
    else if (colMap.baseId < 0 && /^(起始id|baseid|起始文本|起始文本id|base|起始)$/i.test(h)) colMap.baseId = i;
    else if (colMap.note < 0 && /^(备注|note|remark|说明|description)$/i.test(h)) colMap.note = i;
    else if (/^(规则|rules|字段|field|rule)/i.test(h)) colMap.rules.push(i);
  });
  if (colMap.name < 0) colMap.name = 0;
  if (colMap.parent < 0) colMap.parent = 1;
  if (colMap.baseId < 0) colMap.baseId = 2;
  if (colMap.note < 0) colMap.note = 3;
  if (!colMap.rules.length) {
    for (let i = 4; i < first.length; i++) colMap.rules.push(i);
  }
  return { hasHeader: true, colMap };
}

function buildImportData(rows) {
  const { hasHeader, colMap } = detectColumns(rows);
  const startRow = hasHeader ? 1 : 0;
  const errors = [], warnings = [], entries = [];

  for (let i = startRow; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row.length) continue;
    if (row.every(c => !String(c || '').trim())) continue;

    const name = String(row[colMap.name] || '').trim();
    if (!name) { errors.push({ row: i + 1, msg: '名称为空' }); continue; }

    const parentRef = String(row[colMap.parent] || '').trim();
    const baseId    = String(row[colMap.baseId] || '').trim();
    const note      = String(row[colMap.note] || '').trim();

    let ruleTokens = [];
    for (const ci of colMap.rules) {
      const cell = row[ci];
      if (cell && String(cell).trim()) {
        ruleTokens.push(...String(cell).split(/[;；]/).map(s => s.trim()).filter(Boolean));
      }
    }
    const rules = ruleTokens.map(parseRuleToken).filter(Boolean);

    entries.push({ rowIdx: i + 1, name, parentRef, baseId, note, rules });
  }

  const existingByName = new Map();
  const existingById = new Map();
  for (const n of state.nodes) {
    if (!existingByName.has(n.title)) existingByName.set(n.title, n);
    const id = computeId(n);
    if (id && !existingById.has(id)) existingById.set(id, n);
  }

  const nameCount = new Map();
  for (const e of entries) nameCount.set(e.name, (nameCount.get(e.name) || 0) + 1);
  for (const [nm, cnt] of nameCount) {
    if (cnt > 1 && !existingByName.has(nm)) {
      warnings.push({ row: '-', msg: `名称「${nm}」在导入数据中重复 ${cnt} 次` });
    }
  }

  const pending = entries.map(e => ({ ...e, node: null, parent: null }));
  let changed = true, iter = 0;
  const resolvedMap = new Map();

  while (pending.length && changed && iter++ < 200) {
    changed = false;
    for (let i = pending.length - 1; i >= 0; i--) {
      const item = pending[i];
      let parentNode = null;
      if (item.parentRef) {
        parentNode = resolvedMap.get(item.parentRef) || null;
        if (!parentNode) parentNode = existingByName.get(item.parentRef) || null;
        if (!parentNode) parentNode = existingById.get(item.parentRef) || null;
        if (!parentNode) continue;
      }

      const kind = parentNode ? 'rule' : 'root';
      const depth = parentNode ? ((computeNodeDepth().get(parentNode.id) ?? 0) + 1) : 0;
      const node = {
        id: uid('n'), kind, title: item.name,
        x: 0, y: 0,
        baseId: kind === 'root' ? (item.baseId || 'AB') : undefined,
        rules: kind === 'rule'
          ? (item.rules.length ? item.rules : [{ type: 'seq', value: 1, digits: 2, auto: true }])
          : undefined,
        note: item.note || '',
        images: [], collapsed: false,
        color: levelColorOf(depth)
      };
      item.node = node;
      item.parent = parentNode;
      pending.splice(i, 1);
      resolvedMap.set(item.name, node);
      changed = true;
    }
  }

  for (const item of pending) {
    errors.push({ row: item.rowIdx, msg: `父节点「${item.parentRef}」未找到或存在循环引用` });
  }

  const builtNodes = [], builtEdges = [];
  const resolved = entries.filter(e => e.node);
  for (const item of resolved) {
    builtNodes.push(item.node);
    if (item.parent) {
      builtEdges.push({ id: uid('e'), from: item.parent.id, to: item.node.id });
    }
  }

  const savedNodes = state.nodes, savedEdges = state.edges;
  state.nodes = [...savedNodes, ...builtNodes];
  state.edges = [...savedEdges, ...builtEdges];
  let preview;
  try {
    preview = builtNodes.map(n => ({
      node: n,
      name: n.title,
      parentName: n.kind === 'root' ? '' : (parentOf(n.id)?.title || ''),
      id: computeId(n),
      kind: n.kind,
      ruleCount: n.rules ? n.rules.length : 0,
      ruleSummary: n.kind === 'rule' ? summarizeRules(n.rules) : '',
      error: null
    }));
    const conflicts = checkDuplicates();
    for (const p of preview) {
      if (conflicts.has(p.node.id)) p.error = '同级重复';
    }
  } finally {
    state.nodes = savedNodes;
    state.edges = savedEdges;
  }

  return { builtNodes, builtEdges, errors, warnings, preview };
}

function summarizeRules(rules) {
  return rules.map(r => {
    switch (r.type) {
      case 'fixed':  return `固定:${r.text || ''}`;
      case 'choice': return `选项:${(parseOptions(r.options).length)}项`;
      case 'seq':    return `序号:${r.value}~/${r.digits}位${r.auto ? '·自动' : ''}`;
      case 'date':   return `日期:${r.format || ''}`;
    }
    return '';
  }).join(' | ');
}

function renderImportDialog() {
  const body = importBody;

  if (!importState.fileName) {
    body.innerHTML = `
      <div class="import-drop" id="importDrop">
        <div class="id-icon">📥</div>
        <div class="id-title">拖放 CSV 文件到此处，或点击选择</div>
        <div class="id-hint">支持 UTF-8 / GBK 编码，第一行可以是表头</div>
      </div>
      <div class="import-help">
        <b>CSV 列格式说明：</b>
        <div class="rules-list">
          <div><span class="k">名称</span><span>必填，节点名称</span></div>
          <div><span class="k">父节点</span><span>上级节点的名称或订货号，留空表示起始节点</span></div>
          <div><span class="k">起始ID</span><span>仅起始节点使用，如 <code>AB</code></span></div>
          <div><span class="k">备注</span><span>可选</span></div>
          <div><span class="k">规则1/2/3…</span><span>每个单元格写 1 个或多个规则，用 <code>;</code> 分隔</span></div>
        </div>
        <b>规则写法：</b>
        <div class="rules-list">
          <div><span class="k">固定文本</span><span>直接写文本，如 <code>-A</code>；或 <code>固定:-A</code></span></div>
          <div><span class="k">选项</span><span><code>选项:01:红色|02:蓝色</code></span></div>
          <div><span class="k">序号</span><span><code>序号:1|2|自动</code>（起始|位数|是否自动）</span></div>
          <div><span class="k">日期</span><span><code>日期:YYYYMMDD</code></span></div>
        </div>
      </div>
    `;
    const drop = document.getElementById('importDrop');
    if (drop) {
      drop.onclick = () => pickCSVFile();
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {
        e.preventDefault();
        drop.classList.remove('drag-over');
        const f = e.dataTransfer.files[0];
        if (f) handleCSVFile(f);
      });
    }
    importRunBtn.disabled = true;
    importClearFileBtn.style.display = 'none';
    return;
  }

  const { fileName, fileSize, parsedRows, builtNodes, errors, warnings, previewRows } = importState;
  const errCount = errors.length;
  const warnCount = warnings.length;
  const nodeCount = builtNodes.length;
  const sizeStr = fileSize < 1024 ? fileSize + ' B'
                : fileSize < 1024 * 1024 ? (fileSize / 1024).toFixed(1) + ' KB'
                : (fileSize / 1024 / 1024).toFixed(2) + ' MB';

  let html = `
    <div class="import-file-info">
      <div class="fi-icon">📄</div>
      <div class="fi-main">
        <div class="fi-name">${escapeHtml(fileName)}</div>
        <div class="fi-meta">${sizeStr} · 共 ${parsedRows.length} 行数据</div>
      </div>
    </div>
    <div class="import-stats">
      <span class="ist-chip ok">✓ 将创建 ${nodeCount} 个节点</span>
      ${warnCount ? `<span class="ist-chip warn">⚠ ${warnCount} 条警告</span>` : ''}
      ${errCount  ? `<span class="ist-chip err">✗ ${errCount} 条错误</span>` : ''}
    </div>
    <div class="import-options">
      <label><input type="radio" name="impMode" value="append" checked> 追加到当前画布</label>
      <label><input type="radio" name="impMode" value="replace"> 清空后导入</label>
      <label><input type="checkbox" id="impAutoLayout" checked> 导入后自动排版</label>
    </div>
  `;

  if (errors.length) {
    html += `<div class="import-help" style="border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.06);color:#ff9d9d">
      <b>❌ 错误（这些行将被跳过）：</b>
      <div class="rules-list">
        ${errors.slice(0, 10).map(e => `<div><span class="k">第 ${e.row} 行</span><span>${escapeHtml(e.msg)}</span></div>`).join('')}
      </div>
    </div>`;
  }
  if (warnings.length) {
    html += `<div class="import-help" style="border-color:rgba(255,183,77,.4);background:rgba(255,183,77,.06);color:#ffce7a">
      <b>⚠ 警告：</b>
      <div class="rules-list">
        ${warnings.slice(0, 5).map(w => `<div><span class="k">第 ${w.row} 行</span><span>${escapeHtml(w.msg)}</span></div>`).join('')}
      </div>
    </div>`;
  }

  html += `<div style="margin:12px 0 6px;font-size:12px;color:var(--muted)">节点预览：</div>
    <div class="import-preview">
      <div class="import-row head">
        <span>状态</span><span>名称</span><span>父节点</span><span>订货号</span><span>规则</span>
      </div>`;
  const showRows = previewRows.slice(0, 200);
  for (const p of showRows) {
    const statusIcon = p.error ? '⚠' : '✓';
    const statusCls = p.error ? 'warn' : 'ok';
    const parentTxt = p.kind === 'root' ? '（起始节点）' : (p.parentName || '—');
    const parentCls = p.kind === 'root' ? 'iparent root' : 'iparent';
    const idTxt = p.id == null ? '未连接' : (p.id || '（空）');
    const idCls = p.error === '同级重复' ? 'iid err' : 'iid';
    html += `<div class="import-row">
      <span class="ist ${statusCls}">${statusIcon}</span>
      <span class="iname">${escapeHtml(p.name)}</span>
      <span class="${parentCls}">${escapeHtml(parentTxt)}</span>
      <span class="${idCls}">${escapeHtml(idTxt)}</span>
      <span class="irule">${escapeHtml(p.ruleSummary || '')}</span>
    </div>`;
  }
  if (previewRows.length > showRows.length) {
    html += `<div class="import-row" style="justify-content:center;color:var(--muted);font-size:11px">
      还有 ${previewRows.length - showRows.length} 个节点…
    </div>`;
  }
  html += `</div>`;

  body.innerHTML = html;
  importRunBtn.disabled = nodeCount === 0;
  importRunBtn.textContent = `导入 ${nodeCount} 个节点`;
  importClearFileBtn.style.display = '';
}

function pickCSVFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.csv,text/csv,text/plain';
  inp.onchange = () => {
    const f = inp.files[0];
    if (f) handleCSVFile(f);
  };
  inp.click();
}

async function handleCSVFile(file) {
  try {
    const buffer = await file.arrayBuffer();
    let text = new TextDecoder('UTF-8').decode(buffer);
    if (text.includes('\uFFFD')) {
      try { text = new TextDecoder('GBK').decode(buffer); } catch (e) {}
    }
    const rows = parseCSV(text);
    if (!rows.length) { toast('文件为空'); return; }

    const built = buildImportData(rows);
    importState.fileName = file.name;
    importState.fileSize = file.size;
    importState.parsedRows = rows;
    importState.builtNodes = built.builtNodes;
    importState.builtEdges = built.builtEdges;
    importState.errors = built.errors;
    importState.warnings = built.warnings;
    importState.previewRows = built.preview;
    renderImportDialog();
  } catch (err) {
    console.error(err);
    toast('读取文件失败：' + (err.message || err));
  }
}

function openImportDialog() {
  importState = { fileName: '', fileSize: 0, parsedRows: [], builtNodes: [], builtEdges: [], errors: [], warnings: [], previewRows: [] };
  renderImportDialog();
  importMask.classList.add('show');
}
function closeImportDialog() { importMask.classList.remove('show'); }

document.getElementById('btnImport').onclick = openImportDialog;
document.getElementById('importClose').onclick = closeImportDialog;
document.getElementById('importCancel').onclick = closeImportDialog;
importMask.addEventListener('click', e => { if (e.target === importMask) closeImportDialog(); });
importClearFileBtn.onclick = () => { importState.fileName = ''; renderImportDialog(); };

document.getElementById('importTemplate').onclick = () => {
  const tpl = [
    ['名称', '父节点', '起始ID', '备注', '规则1', '规则2'],
    ['产品A', '', 'AB', '起始产品族', '', ''],
    ['红色款', '产品A', '', '颜色变体', '选项:01:红色|02:蓝色', ''],
    ['蓝色款', '产品A', '', '颜色变体', '选项:01:红色|02:蓝色', ''],
    ['小号', '红色款', '', '尺寸变体', '序号:1|2|自动', ''],
    ['大号', '红色款', '', '尺寸变体', '序号:1|2|自动', ''],
    ['出口版', '大号', '', '带日期码', '', '日期:YYYYMM']
  ];
  const esc = v => {
    const s = String(v == null ? '' : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = '\uFEFF' + tpl.map(r => r.map(esc).join(',')).join('\r\n');
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), '订货号导入模板.csv');
  toast('模板已下载');
};

importRunBtn.onclick = () => {
  const { builtNodes, builtEdges, errors } = importState;
  if (!builtNodes.length) return toast('没有可导入的节点');
  const mode = document.querySelector('input[name="impMode"]:checked')?.value || 'append';
  const autoLayoutAfter = document.getElementById('impAutoLayout')?.checked;

  if (mode === 'replace') {
    if (!confirm(`将清空当前 ${state.nodes.length} 个节点，替换为导入的 ${builtNodes.length} 个节点。继续？`)) return;
    state.nodes = []; state.edges = []; selectedIds.clear();
  }
  state.nodes.push(...builtNodes);
  state.edges.push(...builtEdges);
  closeImportDialog();
  render(); markDirty();
  toast(`成功导入 ${builtNodes.length} 个节点` + (errors.length ? `（${errors.length} 行被跳过）` : ''));
  if (autoLayoutAfter && state.nodes.length) {
    setTimeout(() => autoLayout('vertical'), 50);
  }
};

/* =========================================================================
 *  文件保存 / 读取
 * ========================================================================= */
const supportsFS = 'showSaveFilePicker' in window;
let fileHandle = null;
let fileDirty = false;
let lastSavedTime = '';
let autoSaveTimer = null;
const saveStatusEl = document.getElementById('saveStatus');

function serialize() {
  return JSON.stringify({
    v: 9,
    freeMove: state.freeMove,
    autoLayoutOnToggle,           // ★ 保存自动排版开关
    zoom,
    nodes: state.nodes.map(n => ({
      id: n.id, kind: n.kind, title: n.title,
      x: n.x, y: n.y,
      baseId: n.baseId, rules: n.rules,
      note: n.note, images: n.images,
      collapsed: n.collapsed, color: n.color || null
    })),
    edges: state.edges
  }, null, 1);
}
function updateSaveStatus() {
  if (!fileHandle) {
    saveStatusEl.textContent = supportsFS ? '未选择保存文件' : '当前浏览器不支持自动保存';
    saveStatusEl.className = 'save-status warn';
    return;
  }
  if (fileDirty) {
    saveStatusEl.textContent = '● 有改动…';
    saveStatusEl.className = 'save-status dirty';
  } else {
    saveStatusEl.textContent = '✓ 已自动保存 ' + lastSavedTime;
    saveStatusEl.className = 'save-status ok';
  }
}
function markDirty() {
  fileDirty = true;
  updateSaveStatus();
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    backupLocal();
    if (fileHandle) writeFile();
  }, 800);
}
function backupLocal() {
  try { localStorage.setItem('order-node-app', serialize()); } catch (e) {}
}
async function writeFile() {
  if (!fileHandle) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write(serialize());
    await w.close();
    fileDirty = false;
    lastSavedTime = new Date().toTimeString().slice(0, 8);
    updateSaveStatus();
  } catch (e) { toast('自动保存失败：' + (e.message || e)); }
}

document.getElementById('btnSaveFile').onclick = async () => {
  if (!supportsFS) { toast('浏览器不支持选择目录，已改为下载文件'); downloadJson(); return; }
  try {
    fileHandle = await window.showSaveFilePicker({
      suggestedName: 'order-nodes.json',
      types: [{ description: '节点订货号数据', accept: { 'application/json': ['.json'] } }]
    });
    await writeFile();
    toast('已选定保存位置，之后修改将自动保存');
  } catch (e) { if (e.name !== 'AbortError') toast('未选择保存位置'); }
};
document.getElementById('btnSaveNow').onclick = () => {
  if (!fileHandle) return toast('请先点击「选择保存位置」');
  writeFile().then(() => toast('已保存'));
};
document.getElementById('btnOpenFile').onclick = async () => {
  if (supportsFS) {
    try {
      const [h] = await window.showOpenFilePicker({
        types: [{ description: '节点订货号数据', accept: { 'application/json': ['.json'] } }]
      });
      const f = await h.getFile();
      loadFromText(await f.text());
      fileHandle = h;
      fileDirty = false;
      lastSavedTime = new Date().toTimeString().slice(0, 8);
      updateSaveStatus();
      toast('已打开文件');
    } catch (e) { if (e.name !== 'AbortError') toast('打开失败'); }
    return;
  }
  const inp = el('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => { const f = inp.files[0]; if (f) loadFromText(await f.text()); };
  inp.click();
};
function loadFromText(text) {
  try {
    const data = JSON.parse(text);
    state.nodes = (data.nodes || []).map(n => ({
      ...n, note: n.note || '', images: n.images || [],
      collapsed: !!n.collapsed, color: n.color || null, rules: n.rules || []
    }));
    state.edges = data.edges || [];
    setFreeMove(!!data.freeMove, true);
    if (typeof data.autoLayoutOnToggle === 'boolean') {
      autoLayoutOnToggle = data.autoLayoutOnToggle;
      updateAutoToggleBtn();
    }
    selectedIds.clear();
    render();
    if (data.zoom) applyZoom(data.zoom);
    toast('读取成功');
  } catch (e) { toast('文件格式错误'); }
}
function downloadJson() {
  downloadBlob(new Blob([serialize()], { type: 'application/json' }), 'order-nodes.json');
}
document.getElementById('btnClear').onclick = () => {
  if (!state.nodes.length) return;
  if (!confirm('确定清空所有节点？此操作不可撤销。')) return;
  state.nodes = []; state.edges = []; selectedIds.clear();
  render(); markDirty(); updateSelectionBar();
};

/* =========================================================================
 *  新建起始节点
 * ========================================================================= */
document.getElementById('btnRoot').onclick = () => {
  const count = state.nodes.filter(n => n.kind === 'root').length;
  const node = {
    id: uid('n'), kind: 'root',
    title: '产品族 ' + (count + 1),
    x: 80 + (count % 3) * 380,
    y: 80 + Math.floor(count / 3) * 260,
    baseId: 'AB',
    note: '', images: [], collapsed: false,
    color: levelColorOf(0)
  };
  state.nodes.push(node);
  render();
  if (!state.freeMove && collides(node, node.x, node.y)) {
    const spot = findFreeSpot(node, node.x, node.y);
    node.x = spot.x; node.y = spot.y;
    const nel = canvas.querySelector(`.node[data-id="${node.id}"]`);
    if (nel) { nel.style.left = node.x + 'px'; nel.style.top = node.y + 'px'; }
    drawEdges();
  }
  markDirty();
  setTimeout(() => scrollToNode(node.id), 60);
};

/* =========================================================================
 *  初始化
 * ========================================================================= */
async function init() {
  canvas.dataset.w = 4600;
  canvas.dataset.h = 3400;
  canvas.style.transform = 'scale(1)';
  updateZoomWrap();
  updateZoomDisplay();

  // 先同步按钮显示状态
  updateAutoToggleBtn();

  // 1) 优先尝试从 URL hash 恢复（分享链接）
  const fromHash = await tryRestoreFromHash();
  if (fromHash) {
    setFreeMove(state.freeMove, true);
    updateAutoToggleBtn();
    updateSaveStatus();
    updateSelectionBar();
    window.addEventListener('resize', () => { drawEdges(); });
    return;
  }

  // 2) 从本地缓存恢复
  const raw = localStorage.getItem('order-node-app');
  let restored = false;
  if (raw) {
    try {
      const data = JSON.parse(raw);
      if (data.nodes?.length) {
        state.nodes = data.nodes.map(n => ({
          ...n, note: n.note || '', images: n.images || [],
          collapsed: !!n.collapsed, color: n.color || null, rules: n.rules || []
        }));
        state.edges = data.edges || [];
        state.freeMove = !!data.freeMove;
        if (typeof data.autoLayoutOnToggle === 'boolean') {
          autoLayoutOnToggle = data.autoLayoutOnToggle;
        }
        restored = true;
        if (data.zoom && data.zoom !== 1) {
          zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, data.zoom));
          canvas.style.transform = `scale(${zoom})`;
          updateZoomWrap();
          updateZoomDisplay();
        }
      }
    } catch (e) {}
  }

  // 3) 默认示例
  if (!restored) {
    const root = {
      id: uid('n'), kind: 'root', title: '产品族',
      x: 120, y: 200, baseId: 'AB',
      note: '', images: [], collapsed: false,
      color: levelColorOf(0)
    };
    const c1 = {
      id: uid('n'), kind: 'rule', title: '子产品 A',
      x: 490, y: 100,
      rules: [{ type: 'seq', value: 1, digits: 2, auto: true }],
      note: '', images: [], collapsed: false,
      color: levelColorOf(1)
    };
    const c2 = {
      id: uid('n'), kind: 'rule', title: '子产品 B',
      x: 490, y: 360,
      rules: [{ type: 'seq', value: 1, digits: 2, auto: true }],
      note: '', images: [], collapsed: false,
      color: levelColorOf(1)
    };
    state.nodes.push(root, c1, c2);
    state.edges.push(
      { id: uid('e'), from: root.id, to: c1.id },
      { id: uid('e'), from: root.id, to: c2.id }
    );
  }

  updateAutoToggleBtn();
  render();
  setFreeMove(state.freeMove, true);
  updateSaveStatus();
  updateSelectionBar();

  if (!supportsFS) toast('当前浏览器不支持选择保存位置，将使用下载方式');
  window.addEventListener('resize', () => { drawEdges(); });
}

init();
</script>
