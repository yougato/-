const ivState = { open: false, scale: 1, tx: 0, ty: 0, images: [], index: 0, title: '' };
const ivRoot  = document.getElementById('imgViewer');
const ivStage = document.getElementById('ivStage');
const ivImg   = document.getElementById('ivImg');
const ivZoomEl = document.getElementById('ivZoom');
const ivIdxEl  = document.getElementById('ivIdx');

function openImageViewer(images, index, title) {
  if (!images || !images.length) return;
  hideAltPreview();
  ivState.images = images;
  ivState.index  = Math.max(0, Math.min(index, images.length - 1));
  ivState.title  = title || '';
  ivState.open   = true;
  ivRoot.classList.add('show');
  loadIvImage();
}
function loadIvImage() {
  ivImg.onload = () => fitImage();
  ivImg.src = ivState.images[ivState.index];
  document.getElementById('ivTitle').textContent = ivState.title;
  const multi = ivState.images.length > 1;
  document.getElementById('ivPrev').style.display = multi ? '' : 'none';
  document.getElementById('ivNext').style.display = multi ? '' : 'none';
  ivIdxEl.style.display = multi ? '' : 'none';
  ivIdxEl.textContent = `${ivState.index + 1}/${ivState.images.length}`;
}
function applyIvTransform() {
  ivImg.style.transform = `translate(${ivState.tx}px, ${ivState.ty}px) scale(${ivState.scale})`;
  ivZoomEl.textContent = Math.round(ivState.scale * 100) + '%';
}
function fitImage() {
  const nw = ivImg.naturalWidth || 1, nh = ivImg.naturalHeight || 1;
  const sw = ivStage.clientWidth - 90, sh = ivStage.clientHeight - 90;
  ivState.scale = Math.max(0.05, Math.min(sw / nw, sh / nh, 1.6));
  ivState.tx = 0; ivState.ty = 0;
  applyIvTransform();
}
function actualSize() { ivState.scale = 1; ivState.tx = 0; ivState.ty = 0; applyIvTransform(); }
function zoomAt(newScale, mx, my) {
  newScale = Math.max(0.05, Math.min(12, newScale));
  const ratio = newScale / ivState.scale;
  ivState.tx = mx - ratio * (mx - ivState.tx);
  ivState.ty = my - ratio * (my - ivState.ty);
  ivState.scale = newScale;
  applyIvTransform();
}
function zoomCenter(f) { zoomAt(ivState.scale * f, 0, 0); }
function closeImageViewer() { ivState.open = false; ivRoot.classList.remove('show'); ivImg.removeAttribute('src'); }
function ivPrev() { if (ivState.images.length < 2) return; ivState.index = (ivState.index - 1 + ivState.images.length) % ivState.images.length; loadIvImage(); }
function ivNext() { if (ivState.images.length < 2) return; ivState.index = (ivState.index + 1) % ivState.images.length; loadIvImage(); }

document.getElementById('ivClose').onclick = closeImageViewer;
document.getElementById('ivFit').onclick = fitImage;
document.getElementById('ivActual').onclick = actualSize;
document.getElementById('ivZoomIn').onclick = () => zoomCenter(1.25);
document.getElementById('ivZoomOut').onclick = () => zoomCenter(1 / 1.25);
document.getElementById('ivPrev').onclick = ivPrev;
document.getElementById('ivNext').onclick = ivNext;

ivStage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = ivStage.getBoundingClientRect();
  const mx = e.clientX - r.left - r.width / 2;
  const my = e.clientY - r.top - r.height / 2;
  zoomAt(ivState.scale * (e.deltaY < 0 ? 1.14 : 1 / 1.14), mx, my);
}, { passive: false });
ivStage.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  const sx = e.clientX - ivState.tx;
  const sy = e.clientY - ivState.ty;
  ivStage.classList.add('grabbing');
  const move = ev => { ivState.tx = ev.clientX - sx; ivState.ty = ev.clientY - sy; applyIvTransform(); };
  const up = () => {
    ivStage.classList.remove('grabbing');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});
ivStage.addEventListener('dblclick', () => fitImage());

document.addEventListener('keydown', e => {
  if (!ivState.open) return;
  switch (e.key) {
    case 'Escape':     closeImageViewer(); break;
    case 'ArrowLeft':  ivPrev(); break;
    case 'ArrowRight': ivNext(); break;
    case '+': case '=': zoomCenter(1.25); break;
    case '-':           zoomCenter(1/1.25); break;
    case '0':           fitImage(); break;
  }
});

let searchQuery = '';
let searchHits = [];
let searchIdx = -1;
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');

function doSearch(q) {
  searchQuery = q.trim().toLowerCase();
  searchHits = []; searchIdx = -1;
  if (!searchQuery) { applySearchHighlight(); updateSearchCount(); return; }
  let needRender = false;
  for (const n of state.nodes) {
    const id = computeId(n);
    const hay = [n.title, n.note, id || '', n.baseId || ''].join(' ').toLowerCase();
    if (!hay.includes(searchQuery)) continue;
    searchHits.push(n.id);
    let cur = parentOf(n.id), g = 0;
    while (cur && g++ < 60) {
      if (cur.collapsed) { cur.collapsed = false; needRender = true; }
      cur = parentOf(cur.id);
    }
  }
  if (needRender) render();
  applySearchHighlight(); updateSearchCount();
}
function applySearchHighlight() {
  const nodes = canvas.querySelectorAll('.node');
  if (!searchQuery) { nodes.forEach(n => n.classList.remove('search-hit', 'search-dim')); return; }
  const hitSet = new Set(searchHits);
  nodes.forEach(n => {
    const isHit = hitSet.has(n.dataset.id);
    n.classList.toggle('search-hit', isHit);
    n.classList.toggle('search-dim', !isHit);
  });
}
function updateSearchCount() {
  if (!searchQuery) { searchCount.textContent = ''; return; }
  searchCount.textContent = searchHits.length
    ? `${searchIdx >= 0 ? searchIdx + 1 : 0}/${searchHits.length}` : '0';
}
function gotoHit(delta) {
  if (!searchHits.length) return;
  searchIdx = (searchIdx + delta + searchHits.length) % searchHits.length;
  scrollToNode(searchHits[searchIdx]);
  updateSearchCount();
}
searchInput.addEventListener('input', () => doSearch(searchInput.value));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); gotoHit(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { searchInput.value = ''; doSearch(''); searchInput.blur(); }
});
document.getElementById('searchNext').onclick = () => gotoHit(1);
document.getElementById('searchPrev').onclick = () => gotoHit(-1);

function scrollToNode(id) {
  const nodeEl = canvas.querySelector(`.node[data-id="${id}"]`);
  if (!nodeEl) {
    // 虚拟化下节点可能未渲染，先滚动再同步
    const n = getNode(id);
    if (n) {
      const targetX = (n.x + (n._w || NODE_W) / 2) * zoom - stage.clientWidth / 2;
      const targetY = (n.y + (n._h || DEF_H) / 2) * zoom - stage.clientHeight / 2;
      stage.scrollTo({ left: targetX, top: targetY, behavior: 'smooth' });
      scheduleViewportSync();
      setTimeout(() => {
        const nel = canvas.querySelector(`.node[data-id="${id}"]`);
        if (nel) { nel.classList.add('flash'); setTimeout(() => nel.classList.remove('flash'), 1200); }
      }, 400);
    }
    return;
  }
  const targetX = (nodeEl.offsetLeft + nodeEl.offsetWidth / 2) * zoom - stage.clientWidth / 2;
  const targetY = (nodeEl.offsetTop + nodeEl.offsetHeight / 2) * zoom - stage.clientHeight / 2;
  stage.scrollTo({ left: targetX, top: targetY, behavior: 'smooth' });
  nodeEl.classList.add('flash');
  setTimeout(() => nodeEl.classList.remove('flash'), 1200);
}

/* =========================================================================
 *  XLSX 生成器
 * ========================================================================= */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {

    const nameBytes = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034B50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    parts.push(lh, data);
    const cd = new Uint8Array(46 + nameBytes.length);
    const dv2 = new DataView(cd.buffer);
    dv2.setUint32(0, 0x02014B50, true);
    dv2.setUint16(4, 20, true); dv2.setUint16(6, 20, true);
    dv2.setUint16(8, 0x0800, true);
    dv2.setUint16(10, 0, true); dv2.setUint16(12, 0, true);
    dv2.setUint16(14, 0x21, true);
    dv2.setUint32(16, crc, true);
    dv2.setUint32(20, data.length, true);
    dv2.setUint32(24, data.length, true);
    dv2.setUint16(28, nameBytes.length, true);
    dv2.setUint16(30, 0, true); dv2.setUint16(32, 0, true);
    dv2.setUint16(34, 0, true); dv2.setUint16(36, 0, true);
    dv2.setUint32(38, 0, true);
    dv2.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);
    offset += lh.length + data.length;
  }
  const centralSize = central.reduce((s, c) => s + c.length, 0);

  const dv3 = new DataView(eocd.buffer);
  dv3.setUint32(0, 0x06054B50, true);
  dv3.setUint16(4, 0, true); dv3.setUint16(6, 0, true);
  dv3.setUint16(8, files.length, true);
  dv3.setUint16(10, files.length, true);
  dv3.setUint32(12, centralSize, true);
  dv3.setUint32(16, offset, true);
  dv3.setUint16(20, 0, true);

    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'

}

}

function collectExportData() {
  const conflicts = checkDuplicates();
  const depthMap = computeNodeDepth();
  return state.nodes.map(n => {
    const p = parentOf(n.id);
    const id = computeId(n);
    const depth = depthMap.get(n.id) ?? 0;
    let status = '正常';
    if (n.kind !== 'root' && !p) status = '未连接';
    else if (conflicts.has(n.id)) status = '同级重复';
    return {
      node: n,
      id: id === null ? '未连接' : (id || '（空）'),
      idRaw: id, name: n.title || '', depth,
      parentName: p ? (p.title || '') : '—',
      note: n.note || '', status,
      imageCount: (n.images || []).length,
      isLeaf: !state.edges.some(e => e.from === n.id),
      isRoot: n.kind === 'root'
    };
  }).sort((a, b) => (a.depth - b.depth) || (a.node.y - b.node.y) || (a.node.x - b.node.x));
}
function buildSheetRows() {
  const rows = collectExportData();
  return [
    ['订货号', '产品名称', '层级', '父节点', '备注', '截图数', '状态', '是否成品'],
    ...rows.map(r => [r.id, r.name, String(r.depth), r.parentName, r.note, String(r.imageCount), r.status, r.isLeaf ? '是' : ''])
  ];

const hasCompression = typeof CompressionStream !== 'undefined';

function bytesToBase64Url(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function gzipCompress(bytes) {
  if (!hasCompression) return null;
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  writer.write(bytes); writer.close();
  const chunks = [];
  const reader = cs.readable.getReader();
  while (true) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); }
  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}
async function gzipDecompress(bytes) {
  if (!hasCompression) throw new Error('浏览器不支持解压');
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bytes); writer.close();
  const chunks = [];
  const reader = ds.readable.getReader();
  while (true) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); }
  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']

}
async function encryptWithPassword(jsonStr, password) {
  if (!hasSubtle) throw new Error('当前环境不支持加密（需要 HTTPS 或 localhost）');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(jsonStr));
  const cipher = new Uint8Array(cipherBuf);
  let body = cipher, compressed = false;
  if (hasCompression) {
    try {
      const gz = await gzipCompress(cipher);
      if (gz && gz.length < cipher.length) { body = gz; compressed = true; }
    } catch (e) {}
  }
  const out = new Uint8Array(2 + 16 + 12 + body.length);
  out[0] = 0xA7; out[1] = compressed ? 0x01 : 0x00;
  out.set(salt, 2); out.set(iv, 18); out.set(body, 30);
  return 'E' + bytesToBase64Url(out);
}
async function decryptWithPassword(encoded, password) {
  if (!hasSubtle) throw new Error('当前环境不支持解密（需要 HTTPS 或 localhost）');
  const raw = base64UrlToBytes(encoded);
  if (raw[0] !== 0xA7) throw new Error('数据格式错误');
  const flags = raw[1];
  const salt = raw.slice(2, 18);
  const iv = raw.slice(18, 30);
  let body = raw.slice(30);
  if (flags & 0x01) body = await gzipDecompress(body);
  const key = await deriveKey(password, salt);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, body);
  return new TextDecoder().decode(plainBuf);
}
async function compressPayload(str) {
  const bytes = new TextEncoder().encode(str);
  if (!hasCompression) return 'U' + bytesToBase64Url(bytes);
  try {
    const gz = await gzipCompress(bytes);
    if (gz && gz.length < bytes.length) return 'Z' + bytesToBase64Url(gz);
  } catch (e) {}
  return 'U' + bytesToBase64Url(bytes);
}
async function decompressPayload(encoded) {
  const prefix = encoded[0];
  const body = encoded.slice(1);
  if (prefix === 'U') return new TextDecoder().decode(base64UrlToBytes(body));
  if (prefix === 'Z') {
    const bytes = base64UrlToBytes(body);
    const plain = await gzipDecompress(bytes);
    return new TextDecoder().decode(plain);
  }
  if (encoded.startsWith('raw_')) return new TextDecoder().decode(base64UrlToBytes(encoded.slice(4)));
  if (encoded.startsWith('gz_')) {
    const bytes = base64UrlToBytes(encoded.slice(3));
    const plain = await gzipDecompress(bytes);
    return new TextDecoder().decode(plain);
  }
  return new TextDecoder().decode(base64UrlToBytes(encoded));
}

    pwResolve = resolve;
    const { sharerNote = '', error = '' } = info;
    pwBody.innerHTML = `
      <div class="share-hint info" style="margin-bottom:14px">
        此链接已被加密，请输入分享者提供的访问密码。
      </div>
      ${sharerNote ? `<div class="share-meta-card"><div class="share-meta-row">
        <span class="k">分享备注</span><span class="v">${escapeHtml(sharerNote)}</span>
      </div></div>` : ''}
      ${error ? `<div class="share-hint warn" style="color:#ff8d8d;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)">${escapeHtml(error)}</div>` : ''}
      <div class="share-field">
        <label>密码</label>
        <div class="pw-input-wrap">
          <input type="password" id="pwInput" placeholder="请输入密码" autocomplete="off">
          <button type="button" class="pw-toggle" id="pwToggle">👁</button>
        </div>
      </div>
    `;
    const inp = document.getElementById('pwInput');
    const tg = document.getElementById('pwToggle');
    tg.onclick = () => {
      if (inp.type === 'password') { inp.type = 'text'; tg.textContent = '🙈'; }
      else { inp.type = 'password'; tg.textContent = '👁'; }
    };
    setTimeout(() => inp.focus(), 60);
    inp.onkeydown = ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); document.getElementById('pwSubmit').click(); }
    };
    pwMask.classList.add('show');
  });
}
document.getElementById('pwSubmit').onclick = () => {
  const inp = document.getElementById('pwInput');
  const pw = inp ? inp.value : '';
  if (!pw) return toast('请输入密码');
  if (pwResolve) { pwResolve(pw); pwResolve = null; }
};
document.getElementById('pwCancel').onclick = () => {
  pwMask.classList.remove('show');
  if (pwResolve) { pwResolve(null); pwResolve = null; }
};
document.getElementById('pwClose').onclick = () => {

/* =========================================================================
 *  从 URL hash 恢复数据
 * ========================================================================= */
async function tryRestoreFromHash() {
  const hash = location.hash || '';
  if (!hash) return false;
  const m = hash.match(/[#&](enc|data|raw|gz)=([^&]+)/);
  if (!m) return false;
  const kind = m[1];
  const encoded = decodeURIComponent(m[2]);
  try {
    let json;
    if (kind === 'enc') {
      let pw = await openPasswordPrompt({ sharerNote: '' });
      let attempts = 0;
      while (pw !== null && attempts < 5) {
        try { json = await decryptWithPassword(encoded, pw); break; }
        catch (e) {
          attempts++;
          pwMask.classList.remove('show');
          if (attempts >= 5) {
            toast('密码尝试次数过多，已放弃');
            history.replaceState(null, '', location.pathname + location.search);
            return false;
          }
          pw = await openPasswordPrompt({ error: `密码错误（${attempts}/5），请重试` });
        }
      }
      pwMask.classList.remove('show');
      if (json === undefined) {
        history.replaceState(null, '', location.pathname + location.search);
        return false;
      }
    } else {
      json = await decompressPayload(encoded);
    }
    const parsed = JSON.parse(json);
    let data, metaInfo = null;
    if (parsed && parsed.data && parsed.meta) { data = parsed.data; metaInfo = parsed.meta; }
    else { data = parsed; }
    if (metaInfo && metaInfo.expiresAt) {
      if (Date.now() > metaInfo.expiresAt) {
        const d = new Date(metaInfo.expiresAt);
        const p = n => String(n).padStart(2, '0');
        openModal('分享链接已过期', `
          <div class="share-hint warn">
            此分享链接已于 <b>${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}</b> 过期。<br>
            请联系分享者重新生成。
          </div>
        `, '', { showCopy: false });
        history.replaceState(null, '', location.pathname + location.search);
        return false;
      }
    }
    if (!data.nodes || !Array.isArray(data.nodes)) throw new Error('数据格式错误');
    state.nodes = data.nodes.map(n => ({
      ...n, note: n.note || '', images: n.images || [],
      collapsed: !!n.collapsed,
      bodyCollapsed: !!n.bodyCollapsed,
      color: n.color || null, rules: n.rules || []
    }));
    state.edges = data.edges || [];
    state.freeMove = !!data.freeMove;
    if (typeof data.autoLayoutOnToggle === 'boolean') autoLayoutOnToggle = data.autoLayoutOnToggle;
    if (metaInfo && metaInfo.readOnly) readOnlyMode = true;
    render();
    if (data.zoom && data.zoom !== 1) applyZoom(data.zoom);
    applyReadOnlyUI();
    const metaLine = [];
    if (metaInfo) {
      if (metaInfo.sharerNote) metaLine.push(`📝 ${metaInfo.sharerNote}`);
      if (metaInfo.expiresAt) {
        const d = new Date(metaInfo.expiresAt);
        const p = n => String(n).padStart(2, '0');
        metaLine.push(`⏱ 有效至 ${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`);
      }
    }
    if (readOnlyMode) metaLine.push('🔒 只读模式');
    toast(`已加载分享数据（${state.nodes.length} 个节点）` + (metaLine.length ? ' · ' + metaLine.join(' · ') : ''));
    history.replaceState(null, '', location.pathname + location.search);
    return true;
  } catch (e) {
    console.error('从分享链接恢复失败', e);
    toast('分享链接解析失败：' + (e.message || e));
    history.replaceState(null, '', location.pathname + location.search);
    return false;
  }
}

/* =========================================================================
 *  CSV 导入
 * ========================================================================= */
const importMask = document.getElementById('importMask');
const importBody = document.getElementById('importBody');
const importRunBtn = document.getElementById('importRun');
const importClearFileBtn = document.getElementById('importClearFile');
let importState = { fileName: '', fileSize: 0, parsedRows: [], builtNodes: [], builtEdges: [], errors: [], warnings: [], previewRows: [] };

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = []; let cell = ''; let i = 0; let inQuotes = false;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      cell += c; i++;
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(cell); cell = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
      cell += c; i++;
    }
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function parseRuleToken(token) {
  const t = token.trim();
  if (!t) return null;
  let m = t.match(/^(选项|choice|C)\s*[:：]\s*(.+)$/i);
  if (m) {
    const opts = m[2].split(/[|｜]/).map(s => s.trim()).filter(Boolean).map(s => {
      const parts = s.split(/[:：]/);
      if (parts.length >= 2) return { code: parts[0].trim(), label: parts.slice(1).join(':').trim() };
      return { code: s, label: s };
    });
    if (!opts.length) return null;
    return { type: 'choice', options: opts.map(o => `${o.code}:${o.label}`).join(','), selected: opts[0].code };
  }
  m = t.match(/^(序号|seq|S)\s*[:：]\s*(.+)$/i);
  if (m) {
    const parts = m[2].split(/[|｜]/).map(s => s.trim());
    return { type: 'seq', value: Number(parts[0]) || 1, digits: Number(parts[1]) || 2,
             auto: !!(parts[2] && /^(自动|auto|是|yes|1|true)$/i.test(parts[2])) };
  }
  m = t.match(/^(日期|date|D)\s*[:：]\s*(.*)$/i);
  if (m) return { type: 'date', format: m[2].trim() || 'YYYYMMDD' };
  m = t.match(/^(固定文本|固定|fixed|F)\s*[:：]\s*(.+)$/i);
  if (m) return { type: 'fixed', text: m[2] };
  return { type: 'fixed', text: t };
}
function detectColumns(rows) {
  if (!rows.length) return { hasHeader: false, colMap: { name: 0, parent: 1, baseId: 2, note: 3, rules: [4] } };
  const first = rows[0].map(c => String(c || '').trim().toLowerCase());
  const headerKeywords = ['名称','name','title','节点名称','父节点','parent','起始id','baseid','备注','note','规则','rules','字段','field'];
  const isHeader = first.some(c => headerKeywords.some(k => c === k.toLowerCase() || c.includes(k.toLowerCase())));
  if (!isHeader) {
    const rulesCols = [];
    for (let i = 4; i < Math.max(5, first.length); i++) rulesCols.push(i);
    return { hasHeader: false, colMap: { name: 0, parent: 1, baseId: 2, note: 3, rules: rulesCols } };
  }
  const colMap = { name: -1, parent: -1, baseId: -1, note: -1, rules: [] };
  first.forEach((h, i) => {
    if (colMap.name < 0 && /^(名称|节点名称|name|title|产品名称)$/i.test(h)) colMap.name = i;
    else if (colMap.parent < 0 && /^(父节点|父级|parent|parentname|上级|父节点名称)$/i.test(h)) colMap.parent = i;
    else if (colMap.baseId < 0 && /^(起始id|baseid|起始文本|起始文本id|base|起始)$/i.test(h)) colMap.baseId = i;
    else if (colMap.note < 0 && /^(备注|note|remark|说明|description)$/i.test(h)) colMap.note = i;
    else if (/^(规则|rules|字段|field|rule)/i.test(h)) colMap.rules.push(i);
  });
  if (colMap.name < 0) colMap.name = 0;
  if (colMap.parent < 0) colMap.parent = 1;
  if (colMap.baseId < 0) colMap.baseId = 2;
  if (colMap.note < 0) colMap.note = 3;
  if (!colMap.rules.length) for (let i = 4; i < first.length; i++) colMap.rules.push(i);
  return { hasHeader: true, colMap };
}
function buildImportData(rows) {
  const { hasHeader, colMap } = detectColumns(rows);
  const startRow = hasHeader ? 1 : 0;
  const errors = [], warnings = [], entries = [];
  for (let i = startRow; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row.length) continue;
    if (row.every(c => !String(c || '').trim())) continue;
    const name = String(row[colMap.name] || '').trim();
    if (!name) { errors.push({ row: i + 1, msg: '名称为空' }); continue; }
    const parentRef = String(row[colMap.parent] || '').trim();
    const baseId    = String(row[colMap.baseId] || '').trim();
    const note      = String(row[colMap.note] || '').trim();
    let ruleTokens = [];
    for (const ci of colMap.rules) {
      const cell = row[ci];
      if (cell && String(cell).trim()) ruleTokens.push(...String(cell).split(/[;；]/).map(s => s.trim()).filter(Boolean));
    }
    const rules = ruleTokens.map(parseRuleToken).filter(Boolean);
    entries.push({ rowIdx: i + 1, name, parentRef, baseId, note, rules });
  }
  const existingByName = new Map();
  const existingById = new Map();
  for (const n of state.nodes) {
    if (!existingByName.has(n.title)) existingByName.set(n.title, n);
    const id = computeId(n);
    if (id && !existingById.has(id)) existingById.set(id, n);
  }
  const pending = entries.map(e => ({ ...e, node: null, parent: null }));
  let changed = true, iter = 0;
  const resolvedMap = new Map();
  while (pending.length && changed && iter++ < 200) {
    changed = false;
    for (let i = pending.length - 1; i >= 0; i--) {
      const item = pending[i];
      let parentNode = null;
      if (item.parentRef) {
        parentNode = resolvedMap.get(item.parentRef) || null;
        if (!parentNode) parentNode = existingByName.get(item.parentRef) || null;
        if (!parentNode) parentNode = existingById.get(item.parentRef) || null;
        if (!parentNode) continue;
      }
      const kind = parentNode ? 'rule' : 'root';
      const depth = parentNode ? ((computeNodeDepth().get(parentNode.id) ?? 0) + 1) : 0;
      const node = {
        id: uid('n'), kind, title: item.name, x: 0, y: 0,
        baseId: kind === 'root' ? (item.baseId || 'AB') : undefined,
        rules: kind === 'rule' ? (item.rules.length ? item.rules : [{ type: 'seq', value: 1, digits: 2, auto: true }]) : undefined,
        note: item.note || '', images: [],
        collapsed: false, bodyCollapsed: false,
        color: levelColorOf(depth)
      };
      item.node = node; item.parent = parentNode;
      pending.splice(i, 1);
      resolvedMap.set(item.name, node);
      changed = true;
    }
  }
  for (const item of pending) errors.push({ row: item.rowIdx, msg: `父节点「${item.parentRef}」未找到或存在循环引用` });
  const builtNodes = [], builtEdges = [];
  const resolved = entries.filter(e => e.node);
  for (const item of resolved) {
    builtNodes.push(item.node);
    if (item.parent) builtEdges.push({ id: uid('e'), from: item.parent.id, to: item.node.id });
  }
  const savedNodes = state.nodes, savedEdges = state.edges;
  state.nodes = [...savedNodes, ...builtNodes];
  state.edges = [...savedEdges, ...builtEdges];
  let preview;
  try {
    preview = builtNodes.map(n => ({
      node: n, name: n.title,
      parentName: n.kind === 'root' ? '' : (parentOf(n.id)?.title || ''),
      id: computeId(n), kind: n.kind,
      ruleSummary: n.kind === 'rule' ? summarizeRules(n.rules) : '',
      error: null
    }));
    const conflicts = checkDuplicates();
    for (const p of preview) if (conflicts.has(p.node.id)) p.error = '同级重复';
  } finally {
    state.nodes = savedNodes; state.edges = savedEdges;
  }
  return { builtNodes, builtEdges, errors, warnings, preview };
}
function summarizeRules(rules) {
  return rules.map(r => {
    switch (r.type) {
      case 'fixed':  return `固定:${r.text || ''}`;
      case 'choice': return `选项:${(parseOptions(r.options).length)}项`;
      case 'seq':    return `序号:${r.value}~/${r.digits}位${r.auto ? '·自动' : ''}`;
      case 'date':   return `日期:${r.format || ''}`;
    }
    return '';
  }).join(' | ');
}

    html += `<div style="display:grid;grid-template-columns:30px 1.1fr 1fr 1.4fr 1.6fr;gap:8px;padding:7px 11px;border-bottom:1px solid #1a212e;font-size:12px;align-items:center">
      <span style="text-align:center;color:${statusColor}">${statusIcon}</span>

      <span style="color:#7a8a9f;font-size:11px">${escapeHtml(p.ruleSummary || '')}</span>

function pickCSVFile() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.csv,text/csv,text/plain';
  inp.onchange = () => { const f = inp.files[0]; if (f) handleCSVFile(f); };
  inp.click();
}
async function handleCSVFile(file) {
  try {
    const buffer = await file.arrayBuffer();
    let text = new TextDecoder('UTF-8').decode(buffer);
    if (text.includes('\uFFFD')) {
      try { text = new TextDecoder('GBK').decode(buffer); } catch (e) {}
    }
    const rows = parseCSV(text);
    if (!rows.length) { toast('文件为空'); return; }
    const built = buildImportData(rows);
    importState.fileName = file.name;
    importState.fileSize = file.size;
    importState.parsedRows = rows;
    importState.builtNodes = built.builtNodes;
    importState.builtEdges = built.builtEdges;
    importState.errors = built.errors;
    importState.warnings = built.warnings;
    importState.previewRows = built.preview;
    renderImportDialog();
  } catch (err) { console.error(err); toast('读取文件失败：' + (err.message || err)); }
}
function openImportDialog() {
  if (guardReadOnly()) return;
  importState = { fileName: '', fileSize: 0, parsedRows: [], builtNodes: [], builtEdges: [], errors: [], warnings: [], previewRows: [] };
  renderImportDialog();
  importMask.classList.add('show');
}
function closeImportDialog() { importMask.classList.remove('show'); }

  const esc = v => {
    const s = String(v == null ? '' : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = '\uFEFF' + tpl.map(r => r.map(esc).join(',')).join('\r\n');
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), '订货号导入模板.csv');
  toast('模板已下载');
};
importRunBtn.onclick = () => {
  if (guardReadOnly()) return;
  const { builtNodes, builtEdges, errors } = importState;
  if (!builtNodes.length) return toast('没有可导入的节点');
  const mode = document.querySelector('input[name="impMode"]:checked')?.value || 'append';
  const autoLayoutAfter = document.getElementById('impAutoLayout')?.checked;
  if (mode === 'replace') {
    if (!confirm(`将清空当前 ${state.nodes.length} 个节点，替换为导入的 ${builtNodes.length} 个节点。继续？`)) return;
    pushUndo();
    state.nodes = []; state.edges = []; selectedIds.clear();
  } else {
    pushUndo();
  }
  state.nodes.push(...builtNodes);
  state.edges.push(...builtEdges);
  closeImportDialog();
  render(); markDirty();
  toast(`成功导入 ${builtNodes.length} 个节点` + (errors.length ? `（${errors.length} 行被跳过）` : ''));
  if (autoLayoutAfter && state.nodes.length) setTimeout(() => autoLayout('vertical'), 50);
};

/* =========================================================================
 *  文件保存 / 读取
 * ========================================================================= */
const supportsFS = 'showSaveFilePicker' in window;
let fileHandle = null;
let fileDirty = false;
let lastSavedTime = '';
let autoSaveTimer = null;
const saveStatusEl = document.getElementById('saveStatus');

function serialize() {
  return takeSnapshot();
}
function updateSaveStatus() {
  if (readOnlyMode) {
    saveStatusEl.textContent = '🔒 只读模式';
    saveStatusEl.className = 'save-status warn';
    return;
  }
  if (!fileHandle) {
    saveStatusEl.textContent = supportsFS ? '未选择保存文件' : '当前浏览器不支持自动保存';
    saveStatusEl.className = 'save-status warn';
    return;
  }
  if (fileDirty) {
    saveStatusEl.textContent = '● 有改动…';
    saveStatusEl.className = 'save-status dirty';
  } else {
    saveStatusEl.textContent = '✓ 已自动保存 ' + lastSavedTime;
    saveStatusEl.className = 'save-status ok';
  }
}
function markDirty() {
  if (readOnlyMode) return;
  fileDirty = true;
  updateSaveStatus();
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    backupLocal();
    if (fileHandle) writeFile();
  }, 800);
}
function backupLocal() {
  if (readOnlyMode) return;
  try { localStorage.setItem('order-node-app', serialize()); } catch (e) {}
}
async function writeFile() {
  if (!fileHandle || readOnlyMode) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write(serialize());
    await w.close();
    fileDirty = false;
    lastSavedTime = new Date().toTimeString().slice(0, 8);
    updateSaveStatus();
  } catch (e) { toast('自动保存失败：' + (e.message || e)); }
}
document.getElementById('btnSaveFile').onclick = async () => {
  if (guardReadOnly()) return;
  if (!supportsFS) { toast('浏览器不支持选择目录，已改为下载文件'); downloadJson(); return; }
  try {
    fileHandle = await window.showSaveFilePicker({
      suggestedName: 'order-nodes.json',
      types: [{ description: '节点订货号数据', accept: { 'application/json': ['.json'] } }]
    });
    await writeFile();
    toast('已选定保存位置，之后修改将自动保存');
  } catch (e) { if (e.name !== 'AbortError') toast('未选择保存位置'); }
};
document.getElementById('btnSaveNow').onclick = () => {
  if (guardReadOnly()) return;
  if (!fileHandle) return toast('请先点击「选择保存位置」');
  writeFile().then(() => toast('已保存'));
};
document.getElementById('btnOpenFile').onclick = async () => {
  if (guardReadOnly()) return;
  if (supportsFS) {
    try {
      const [h] = await window.showOpenFilePicker({
        types: [{ description: '节点订货号数据', accept: { 'application/json': ['.json'] } }]
      });
      const f = await h.getFile();
      loadFromText(await f.text());
      fileHandle = h;
      fileDirty = false;
      lastSavedTime = new Date().toTimeString().slice(0, 8);
      updateSaveStatus();
      toast('已打开文件');
    } catch (e) { if (e.name !== 'AbortError') toast('打开失败'); }
    return;
  }
  const inp = el('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => { const f = inp.files[0]; if (f) loadFromText(await f.text()); };
  inp.click();
};
function loadFromText(text) {
  try {
    const data = JSON.parse(text);
    state.nodes = (data.nodes || []).map(n => ({
      ...n, note: n.note || '', images: n.images || [],
      collapsed: !!n.collapsed,
      bodyCollapsed: !!n.bodyCollapsed,
      color: n.color || null, rules: n.rules || []
    }));
    state.edges = data.edges || [];
    setFreeMove(!!data.freeMove, true);
    if (typeof data.autoLayoutOnToggle === 'boolean') {
      autoLayoutOnToggle = data.autoLayoutOnToggle;
      updateAutoToggleBtn();
    }
    selectedIds.clear();
    undoStack.length = 0;
    redoStack.length = 0;
    updateUndoRedoBtns();
    render();
    if (data.zoom && data.zoom !== 1) applyZoom(data.zoom);
    toast('读取成功');
  } catch (e) { toast('文件格式错误'); }
}
function downloadJson() {
  downloadBlob(new Blob([serialize()], { type: 'application/json' }), 'order-nodes.json');
}
document.getElementById('btnClear').onclick = () => {
  if (guardReadOnly()) return;
  if (!state.nodes.length) return;
  if (!confirm('确定清空所有节点？此操作不可撤销。')) return;
  pushUndo();
  state.nodes = []; state.edges = []; selectedIds.clear();
  render(); markDirty(); updateSelectionBar();
};

/* =========================================================================
 *  新建起始节点
 * ========================================================================= */
document.getElementById('btnRoot').onclick = () => {
  if (guardReadOnly()) return;
  pushUndo();
  const count = state.nodes.filter(n => n.kind === 'root').length;
  const node = {
    id: uid('n'), kind: 'root',
    title: '产品族 ' + (count + 1),
    x: 80 + (count % 3) * 380,
    y: 80 + Math.floor(count / 3) * 260,
    baseId: 'AB',
    note: '', images: [],
    collapsed: false, bodyCollapsed: false,
    color: levelColorOf(0)
  };
  state.nodes.push(node);
  render();
  if (!state.freeMove && collides(node, node.x, node.y)) {
    const spot = findFreeSpot(node, node.x, node.y);
    node.x = spot.x; node.y = spot.y;
    const nel = canvas.querySelector(`.node[data-id="${node.id}"]`);
    if (nel) { nel.style.left = node.x + 'px'; nel.style.top = node.y + 'px'; }
    scheduleDraw();
  }
  markDirty();
  setTimeout(() => scrollToNode(node.id), 60);
};

/* =========================================================================
 *  ★ 新手引导
 * ========================================================================= */
const ONBOARD_STEPS = [
  {
    icon: '👋',
    title: '欢迎使用订货号生成器',
    desc: '这是一个<strong>节点式</strong>的产品变体管理工具。每个节点代表一种产品，父节点到子节点的连线代表<strong>派生关系</strong>，子节点的订货号 = 父节点订货号 + 自己的扩展规则。<br><br>接下来有 4 步快速上手，帮你了解核心操作。'
  },
  {
    icon: '🌱',
    title: '创建起始节点',
    desc: '点击顶栏的 <code>＋ 起始节点</code> 按钮，创建一个产品族根节点。给它填写一个<strong>起始文本 ID</strong>（如 <code>AB</code>），这就是所有子产品订货号的前缀。'
  },
  {
    icon: '🔗',
    title: '连线生成子节点',
    desc: '把鼠标移到节点<strong>右侧圆点</strong>上，按住拖到另一个节点上松开，就建立了一条派生关系。或者直接点节点头部的 <code>＋</code> 按钮，快速添加子节点。<br><br>子节点上可以添加<strong>扩展字段</strong>（固定文本、选项、序号、日期），它们会按顺序拼接到订货号里。'
  },
  {
    icon: '⚡',
    title: '效率操作',
    desc: '· <b>框选</b>：空白处拖动鼠标，可批量选择节点<br>· <kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>Ctrl</kbd>+<kbd>V</kbd>：复制粘贴节点<br>· <kbd>Alt</kbd> + 悬停：快速预览节点截图<br>· <kbd>Ctrl</kbd>+<kbd>Z</kbd>：撤销上一步操作<br>· 拖动时自动显示<strong>对齐辅助线</strong><br>· <b>中键拖动</b>：像地图一样平移画布视图'
  },
  {
    icon: '✅',
    title: '准备好了！',
    desc: '所有节点操作都可以通过<strong>右键菜单</strong>访问。如果想重新查看本引导，点击顶栏右侧的 <code>❓</code> 按钮。<br><br>祝使用愉快！'
  }
];
let onboardStep = 0;

function showOnboarding() {
  onboardStep = 0;
  document.getElementById('onboardOverlay').classList.add('show');
  renderOnboardingStep();
}
function renderOnboardingStep() {
  const step = ONBOARD_STEPS[onboardStep];
  document.getElementById('onboardIcon').textContent = step.icon;
  document.getElementById('onboardTitle').innerHTML = step.title;
  document.getElementById('onboardStep').textContent = `${onboardStep + 1}/${ONBOARD_STEPS.length}`;
  document.getElementById('onboardDesc').innerHTML = step.desc;
  const dots = document.getElementById('onboardDots');
  dots.innerHTML = ONBOARD_STEPS.map((_, i) => `<span${i === onboardStep ? ' class="active"' : ''}></span>`).join('');
  const nextBtn = document.getElementById('onboardNext');
  const prevBtn = document.getElementById('onboardPrev');
  nextBtn.textContent = onboardStep === ONBOARD_STEPS.length - 1 ? '开始使用' : '下一步';
  prevBtn.style.display = onboardStep === 0 ? 'none' : '';
}
document.getElementById('onboardNext').onclick = () => {
  if (onboardStep < ONBOARD_STEPS.length - 1) {
    onboardStep++;
    renderOnboardingStep();
  } else {
    closeOnboarding();
  }
};
document.getElementById('onboardPrev').onclick = () => {
  if (onboardStep > 0) { onboardStep--; renderOnboardingStep(); }
};
document.getElementById('onboardSkip').onclick = () => closeOnboarding();
function closeOnboarding() {
  document.getElementById('onboardOverlay').classList.remove('show');
  try { localStorage.setItem('order-node-onboarded', '1'); } catch (e) {}
}
document.getElementById('btnHelp').onclick = () => {
  try { localStorage.removeItem('order-node-onboarded'); } catch (e) {}
  showOnboarding();
};

/* =========================================================================
 *  初始化
 * ========================================================================= */
async function init() {
  canvas.dataset.w = 4600;
  canvas.dataset.h = 3400;
  canvas.style.transform = 'scale(1)';
  updateZoomWrap();
  updateZoomDisplay();
  updateAutoToggleBtn();
  updateUndoRedoBtns();

  const fromHash = await tryRestoreFromHash();
  if (fromHash) {
    setFreeMove(state.freeMove, true);
    updateAutoToggleBtn();
    applyReadOnlyUI();
    updateSaveStatus();
    updateSelectionBar();
    window.addEventListener('resize', () => { drawEdges(); scheduleViewportSync(); });
    return;
  }

  const raw = localStorage.getItem('order-node-app');
  let restored = false;
  if (raw) {
    try {
      const data = JSON.parse(raw);
      if (data.nodes?.length) {
        state.nodes = data.nodes.map(n => ({
          ...n, note: n.note || '', images: n.images || [],
          collapsed: !!n.collapsed,
          bodyCollapsed: !!n.bodyCollapsed,
          color: n.color || null, rules: n.rules || []
        }));
        state.edges = data.edges || [];
        state.freeMove = !!data.freeMove;
        if (typeof data.autoLayoutOnToggle === 'boolean') autoLayoutOnToggle = data.autoLayoutOnToggle;
        restored = true;
        if (data.zoom && data.zoom !== 1) {
          zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, data.zoom));
          canvas.style.transform = `scale(${zoom})`;
          updateZoomWrap(); updateZoomDisplay();
        }
      }
    } catch (e) {}
  }

  if (!restored) {
    const root = {
      id: uid('n'), kind: 'root', title: '产品族',
      x: 120, y: 200, baseId: 'AB',
      note: '', images: [],
      collapsed: false, bodyCollapsed: false,
      color: levelColorOf(0)
    };
    const c1 = {
      id: uid('n'), kind: 'rule', title: '子产品 A', x: 490, y: 100,
      rules: [{ type: 'seq', value: 1, digits: 2, auto: true }],
      note: '', images: [],
      collapsed: false, bodyCollapsed: false,
      color: levelColorOf(1)
    };
    const c2 = {
      id: uid('n'), kind: 'rule', title: '子产品 B', x: 490, y: 360,
      rules: [{ type: 'seq', value: 1, digits: 2, auto: true }],
      note: '', images: [],
      collapsed: false, bodyCollapsed: false,
      color: levelColorOf(1)
    };
    state.nodes.push(root, c1, c2);
    state.edges.push(
      { id: uid('e'), from: root.id, to: c1.id },
      { id: uid('e'), from: root.id, to: c2.id }
    );
  }

  updateAutoToggleBtn();
  render();
  setFreeMove(state.freeMove, true);
  applyReadOnlyUI();
  updateSaveStatus();
  updateSelectionBar();

  if (!supportsFS) toast('当前浏览器不支持选择保存位置，将使用下载方式');
  window.addEventListener('resize', () => { drawEdges(); scheduleViewportSync(); });

  // 首次访问显示新手引导
  try {
    if (!localStorage.getItem('order-node-onboarded')) {
      setTimeout(showOnboarding, 500);
    }
  } catch (e) {}
}

init();
</script>
