<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>订货号生成器 · 节点式</title>
<script>
/* ★ 尽早应用皮肤，避免刷新时先闪一下默认深色 */
try {
  var __theme = localStorage.getItem('order-node-theme') || 'dark';
  document.documentElement.dataset.theme = (__theme === 'auto')
    ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'sepia' : 'dark')
    : __theme;
} catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<style>
  :root{
    --bg:#0e1116; --panel:#161b24; --panel2:#1c2330; --border:#2a3341;
    --text:#e6ebf2; --muted:#8a97ab; --accent:#4c8dff; --gold:#ffb74d;
    --danger:#ef4444; --ok:#7ddc9a; --guide:#ff4c8d;
    /* ★ 皮肤令牌：默认值 = 原本写死的深色配色。
       dark 主题不套用下面那组覆盖规则，外观与历史版本完全一致；
       其余主题通过覆盖规则读取这些令牌。 */
    --sunken:#0f141c;        /* 输入框 / 内嵌面板 */
    --deep:#0b0f15;          /* 更深一层：画布底、idrow、端口描边 */
    --scroll-track:#0a0d12;
    --dots:#1e2635;          /* 画布点阵 */
    --head-a:#212a3a;        /* 节点头渐变·起 */
    --head-b:#1b2230;        /* 节点头渐变·止 */
    --menu:#1e2431;          /* 右键菜单 / 引导卡 */
    --menu-line:#35445c;
    --foot:#141920;          /* 表尾 / kbd */
    --port:#39445a;
    --soft:#9dc2ff;          /* 次级强调 */
    --sub:#a9b8cf;           /* 次级文字 */
    --sub2:#cfd8e6;          /* 备注正文 */
    --dim:#6f7c90;           /* 弱化文字 */
    --dim2:#5d6878;          /* 更弱（未连接） */
    --placeholder:#4d586b;
    --gold-soft:#ffce7a;
    --ok-soft:#a6efb8;
    --hover:#222c3d;         /* 按钮 / 条目悬停底 */
    --shadow:0 8px 24px rgba(0,0,0,.45);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; display:flex; flex-direction:column;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  .toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--border);
    z-index:20; box-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  .brand{ font-weight:700; letter-spacing:.5px; margin-right:4px; white-space:nowrap; }
  .brand span{ color:var(--accent); }
  .readonly-badge{
    display:none; align-items:center; gap:5px;
    background:rgba(255,183,77,.15); border:1px solid rgba(255,183,77,.45);
    color:#ffce7a; padding:3px 10px; border-radius:6px;
    font-size:12px; font-weight:600; white-space:nowrap;
  }
  .readonly-badge.show{ display:inline-flex; }
  .readonly-badge button{
    background:transparent; border:none; color:#ffce7a;
    font-size:11px; cursor:pointer; text-decoration:underline;
    padding:0 2px; font-family:inherit;
  }
  .readonly-badge button:hover{ color:#fff; }

  .tbtn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:6px 12px; border-radius:8px; cursor:pointer; font-size:13px;
    transition:.15s; white-space:nowrap; font-family:inherit;
  }
  .tbtn:hover{ border-color:var(--accent); background:#222c3d; }
  .tbtn.danger:hover{ border-color:var(--danger); color:#ff9d9d; }
  .tbtn.hl{ border-color:#3a5f9e; color:#9dc2ff; background:#1d2a42; }
  .tbtn.hl:hover{ border-color:var(--accent); background:#22314d; }
  .tbtn.free{ border-color:#4a7a3a; color:#b6e6a0; background:#1e2c19; }
  .tbtn.success{ border-color:#3fb96b; color:#a6efb8; background:rgba(63,185,107,.12); }
  .tbtn.success:hover{ border-color:#7ddc9a; background:rgba(63,185,107,.22); }
  .tbtn.imp{ border-color:#8a6a2a; color:#ffce7a; background:rgba(224,166,58,.1); }
  .tbtn.imp:hover{ border-color:var(--gold); background:rgba(224,166,58,.2); }
  .tbtn.dash{ border-color:#7a4ab8; color:#c9a6f0; background:rgba(178,90,214,.1); }
  .tbtn.dash:hover{ border-color:#b25ad6; background:rgba(178,90,214,.22); }
  .tbtn.mind{ border-color:#2f7f8e; color:#8fd8e6; background:rgba(58,168,186,.1); }
  .tbtn.mind:hover{ border-color:#3ab0c4; background:rgba(58,168,186,.22); }
  .tbtn:disabled{ opacity:.35; cursor:not-allowed; }
  .spacer{ flex:1; }

  .btn-split{ display:flex; }
  .btn-split .tbtn:first-child{ border-top-right-radius:0; border-bottom-right-radius:0; }
  .btn-split .tbtn.caret{
    border-top-left-radius:0; border-bottom-left-radius:0;
    padding:6px 9px; border-left:1px solid rgba(76,141,255,.25);
  }

  /* 撤销重做按钮 */
  .undo-group{ display:flex; gap:2px; }
  .undo-group .tbtn{ padding:6px 10px; font-size:13px; }
  .undo-group .tbtn.icon{ min-width:32px; padding:6px 6px; }

  .search-box{
    display:flex; align-items:center; gap:2px;
    background:var(--panel2); border:1px solid var(--border);
    border-radius:8px; padding:3px 5px 3px 10px;
  }
  .search-box:focus-within{ border-color:var(--accent); }
  .search-box input{
    background:transparent; border:none; outline:none; color:var(--text);
    width:130px; font-size:13px; font-family:inherit;
  }
  .search-box .cnt{ font-size:11px; color:var(--muted); min-width:36px; text-align:center; }
  .snav{
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    width:20px; height:20px; border-radius:5px; font-size:11px; line-height:1;
  }
  .snav:hover{ background:#2a3341; color:#fff; }

  .save-status{
    font-size:12px; padding:4px 10px; border-radius:6px; white-space:nowrap;
    font-family:ui-monospace,monospace;
    max-width:230px; overflow:hidden; text-overflow:ellipsis;
  }
  .save-status.ok{ color:var(--ok); background:rgba(60,180,110,.12); }
  .save-status.dirty{ color:var(--gold); background:rgba(255,183,77,.12); }
  .save-status.warn{ color:var(--muted); background:#1c2330; }

  /* ---------- 只读 ---------- */
  body.readonly-mode .node-title,
  body.readonly-mode .node .base-input,
  body.readonly-mode .node .note-input,
  body.readonly-mode .node .r-input,
  body.readonly-mode .node .rule-type,
  body.readonly-mode .node .color-dot,
  body.readonly-mode .node .icon-btn:not(.chev):not(.subtree-chev),
  body.readonly-mode .node .add-rule,
  body.readonly-mode .node .add-img,
  body.readonly-mode .node .thumb-del,
  body.readonly-mode .node .mini input,
  body.readonly-mode .port{
    pointer-events: none !important;
    opacity: .55;
  }
  body.readonly-mode .node .port{ opacity: .3; }
  body.readonly-mode .node .batch-title{ pointer-events: none !important; opacity: .7; }
  /* 只读时标题仍可悬停查看全文，但不允许编辑（focus 会被立刻 blur 掉） */
  body.readonly-mode .node .node-title{ pointer-events: auto !important; cursor: default; }
  body.readonly-mode .node .node-head{ cursor: default !important; }

  /* ---------- ★ 锁定节点 ---------- */
  /* 锁定后：所有编辑入口失效，但折叠/展开与复制编码仍可用 */
  .node.locked .node-title,
  .node.locked .base-input,
  .node.locked .note-input,
  .node.locked .r-input,
  .node.locked .rule-type,
  .node.locked .color-dot,
  .node.locked .icon-btn:not(.chev):not(.subtree-chev),
  .node.locked .add-rule,
  .node.locked .add-img,
  .node.locked .thumb-del,
  .node.locked .mini input,
  .node.locked .port,
  .node.locked .batch-title{
    pointer-events: none !important;
    opacity: .55;
  }
  /* 锁定后标题仍可悬停查看完整文字（focus 会被立刻 blur，改不了内容） */
  .node.locked .node-title{ pointer-events: auto !important; cursor: default; }
  .node.locked .node-head{ cursor: default; }
  /* 金色内描边，一眼看出哪些节点被锁住 */
  .node.locked::after{
    content:''; position:absolute; inset:0; border-radius:12px;
    pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(255,183,77,.45);
  }
  .lock-badge{
    display:none;
    font-size:10px; padding:1px 4px; border-radius:9px;
    margin-left:1px; flex:none; line-height:1.4; white-space:nowrap;
    background:rgba(255,183,77,.18); color:var(--gold-soft);
    border:1px solid rgba(255,183,77,.4);
  }
  .node.locked .lock-badge{ display:inline-block; }

  /* ---------- 画布 ---------- */
  .stage{ flex:1; overflow:auto; position:relative; }
  /* ★ 中键平移画布：拖动期间显示抓手光标并禁止选中文本 */
  body.canvas-panning,
  body.canvas-panning *{ cursor: grabbing !important; user-select: none !important; }
  .stage::-webkit-scrollbar{ width:12px; height:12px; }
  .stage::-webkit-scrollbar-thumb{ background:#2a3341; border-radius:6px; }
  .stage::-webkit-scrollbar-track{ background:#0a0d12; }

  .zoom-wrap{ position:relative; }

  .canvas{
    position:relative; width:4600px; height:3400px;
    background-color:#0b0f15;
    background-image:radial-gradient(circle,#1e2635 1px,transparent 1px);
    background-size:24px 24px;
    transform-origin: 0 0;
    position:absolute; top:0; left:0;
  }
  #edges{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #edges .edge{ fill:none; stroke:#3a5f9e; stroke-width:2; transition:stroke .15s; }
  #edges .edge-hit{ fill:none; stroke:transparent; stroke-width:20; pointer-events:stroke; cursor:pointer; }
  #edges .edge-hit:hover + .edge{ stroke:var(--danger); stroke-width:3; }
  #edges .edge.temp{ stroke:var(--accent); stroke-dasharray:6 5; }

  /* ★ 对齐辅助线层 */
  #guides{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; overflow:visible; z-index:180;
  }
  #guides .guide{
    stroke: var(--guide); stroke-width:1.2; stroke-dasharray: 4 3;
    vector-effect: non-scaling-stroke;
    opacity: 0.9;
  }
  #guides .guide.glow{
    stroke-width: 3; opacity: 0.25; filter: blur(2px);
  }

  .selection-box{
    position:absolute; pointer-events:none; z-index:200;
    border:1.5px dashed var(--accent);
    background:rgba(76,141,255,.13);
    border-radius:3px;
    box-shadow:0 0 0 1px rgba(76,141,255,.25) inset;
  }

  /* ---------- 节点 ---------- */
  .node{
    position:absolute; width:274px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    transition:box-shadow .15s, border-color .15s, opacity .2s;
  }
  .node.root{ border-color:#2f4f8a; }
  .node.dragging{ box-shadow:0 18px 44px rgba(0,0,0,.65); z-index:10; }
  .node.dragging-batch{ box-shadow:0 20px 50px rgba(76,141,255,.4), 0 0 0 2px rgba(76,141,255,.35); z-index:11; }
  .node.drop-target{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(76,141,255,.3),0 8px 24px rgba(0,0,0,.45); }
  .node.conflict{ border-color:var(--danger) !important; box-shadow:0 0 0 2px rgba(239,68,68,.22),0 8px 24px rgba(0,0,0,.45); }
  .node.selected{ outline: 3px solid var(--accent); outline-offset: 3px; }
  .node.search-dim{ opacity:.2; }
  .node.search-hit{ box-shadow:0 0 0 3px rgba(255,183,77,.4),0 8px 24px rgba(0,0,0,.5); }
  .node.flash{ animation:flash 1.15s ease; }
  .node.alt-hover{ box-shadow:0 0 0 2px rgba(76,141,255,.5), 0 8px 24px rgba(0,0,0,.5); }
  @keyframes flash{
    0%,100%{ outline:0 solid transparent; }
    25%{ outline:4px solid var(--accent); outline-offset:4px; }
  }

  .node-head{
    display:flex; align-items:center; gap:2px; padding:6px 6px 6px 5px;
    background:linear-gradient(180deg,#212a3a,#1b2230);
    border-radius:11px 11px 0 0; border-bottom:1px solid var(--border);
    cursor:grab;
  }
  .node.collapsed .node-head,
  .node.body-collapsed .node-head{
    border-bottom:none; border-radius:11px;
  }
  .node.collapsed .node-body,
  .node.body-collapsed .node-body{ display:none; }
  .node.body-collapsed, .node.collapsed{ border-style:dashed; }
  .node.dragging .node-head{ cursor:grabbing; }
  .node-title{
    flex:1; min-width:0; background:transparent; border:none; color:var(--text);
    font-weight:600; font-size:13px; padding:2px 0; outline:none; font-family:inherit;
  }
  .node-title:focus{ background:#0b0f15; border-radius:5px; padding:2px 5px; }
  .node.root .node-title{ color:#9dc2ff; }

  .icon-btn{
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    width:20px; height:20px; border-radius:5px; display:grid; place-items:center;
    font-size:12px; line-height:1; flex:none; padding:0; font-family:inherit;
  }
  .icon-btn:hover{ background:#2a3341; color:#fff; }
  .icon-btn.del:hover{ background:#4a1e1e; color:#ff9d9d; }
  .chev{ font-size:11px; }

  .subtree-chev{
    background:rgba(76,141,255,.12);
    border:1px solid rgba(76,141,255,.28);
    border-radius:5px;
    font-size:11px;
    width:22px; height:22px;
    color:#9dc2ff;
  }
  .subtree-chev:hover{
    background:rgba(76,141,255,.25);
    border-color:var(--accent);
    color:#fff;
  }
  .node.collapsed .subtree-chev{
    background:rgba(76,141,255,.28);
    border-color:var(--accent);
    color:#fff;
  }

  .color-dot{
    width:15px; height:15px; border-radius:50%; flex:none; cursor:pointer;
    border:1px solid rgba(255,255,255,.28); padding:0;
    background:linear-gradient(135deg,#4c8dff,#3a5f9e);
  }
  .color-dot:hover{ transform:scale(1.15); }

  .node-body{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:9px; }

  .idrow{
    display:flex; align-items:center; gap:6px;
    background:#0b0f15; border:1px solid var(--border); border-radius:8px;
    padding:6px 6px 6px 9px;
    cursor:help;
  }
  .idrow:hover{ border-color:#3a5f9e; }
  .node-id{
    flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px; color:var(--gold); word-break:break-all; line-height:1.35;
  }
  .node-id.unlinked{ color:#5d6878; font-style:italic; font-family:inherit; }

  /* ★ 节点左上角的订货号角标：常驻显示（折叠时也可见），点击即复制 */
  .node-code-flag{
    position:absolute; left:8px; top:-9px; z-index:6;
    max-width:calc(100% - 58px);
    padding:1px 7px; border-radius:7px;
    background:var(--sunken); border:1px solid var(--gold);
    color:var(--gold);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px; line-height:15px; letter-spacing:.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:copy; transition:border-color .15s, color .15s;
    box-shadow:0 2px 8px rgba(0,0,0,.28);
  }
  .node-code-flag:hover{ border-color:var(--accent); color:var(--accent); }
  .node-code-flag.unlinked{
    color:var(--dim2); border-color:var(--border); border-style:dashed;
    font-family:inherit; font-style:italic; cursor:default;
  }
  .node-code-flag.empty{ color:var(--muted); border-color:var(--border); }
  .node-code-flag.bad{
    color:var(--danger); border-color:var(--danger);
    box-shadow:0 0 0 2px rgba(239,68,68,.18);
  }

  .warn-bar{
    display:none; align-items:center; gap:6px;
    background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.4);
    color:#ff9d9d; border-radius:7px; padding:5px 8px; font-size:11.5px;
  }

  .rules{ display:flex; flex-direction:column; gap:8px; }
  .rule{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    padding:7px 8px; display:flex; flex-direction:column; gap:6px;
  }
  .rule-top{ display:flex; align-items:center; gap:6px; }
  .rule-type{
    flex:1; background:#0f141c; color:#a9b8cf; border:1px solid var(--border);
    border-radius:6px; padding:3px 6px; font-size:12px; outline:none; font-family:inherit;
  }
  .rule-body{ display:flex; flex-direction:column; gap:6px; }
  .r-input{
    width:100%; background:#0f141c; color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 7px; font-size:12px; outline:none; font-family:inherit;
  }
  .r-input:focus{ border-color:var(--accent); }
  .r-input.num{ width:56px; }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mini{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); }
  .mini.chk{ cursor:pointer; user-select:none; }
  .mini input[type=number]{ background:#0f141c; color:var(--text); border:1px solid var(--border);
    border-radius:5px; padding:3px 5px; width:52px; font-size:11px; outline:none; font-family:inherit; }

  .field{ display:flex; flex-direction:column; gap:4px; }
  .field span{ font-size:11px; color:var(--muted); }
  .base-input{
    width:100%; background:#0f141c; color:var(--gold); border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-size:14px; outline:none;
    font-family:ui-monospace,monospace; letter-spacing:1px;
  }
  .base-input:focus{ border-color:var(--accent); }

  .add-rule{
    background:transparent; border:1px dashed var(--border); color:var(--muted);
    border-radius:7px; padding:5px; cursor:pointer; font-size:12px; transition:.15s;
    font-family:inherit;
  }
  .add-rule:hover{ border-color:var(--accent); color:var(--accent); }

  .note-input{
    width:100%; min-height:46px; resize:vertical;
    background:#0f141c; color:#cfd8e6; border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-size:12px; outline:none;
    font-family:inherit; line-height:1.5;
  }
  .note-input:focus{ border-color:var(--accent); }
  .note-input::placeholder{ color:#4d586b; }

  .gallery{ display:flex; flex-wrap:wrap; gap:6px; }
  .thumb{
    position:relative; width:58px; height:58px; border-radius:7px;
    overflow:hidden; border:1px solid var(--border); cursor:zoom-in;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb:hover{ border-color:var(--accent); }
  .thumb-del{
    position:absolute; top:2px; right:2px; width:16px; height:16px;
    border-radius:50%; background:rgba(0,0,0,.75); color:#fff; border:none;
    font-size:10px; cursor:pointer; display:grid; place-items:center; padding:0;
    line-height:1; opacity:0; transition:.15s;
  }
  .thumb:hover .thumb-del{ opacity:1; }
  .thumb-del:hover{ background:var(--danger); }
  .add-img{
    width:58px; height:58px; border-radius:7px; border:1px dashed var(--border);
    display:grid; place-items:center; color:var(--muted); cursor:pointer; font-size:18px;
    transition:.15s;
  }
  .add-img:hover{ border-color:var(--accent); color:var(--accent); }

  .img-count-badge, .subtree-badge{
    display:none;
    font-size:10px; padding:1px 5px; border-radius:9px;
    font-family:ui-monospace,monospace;
    margin-left:1px; flex:none;
    line-height:1.4;
    white-space:nowrap;
  }
  .img-count-badge{
    background:rgba(76,141,255,.22); color:#9dc2ff;
    border:1px solid rgba(76,141,255,.45);
  }
  .subtree-badge{
    background:rgba(255,183,77,.18); color:#ffce7a;
    border:1px solid rgba(255,183,77,.4);
  }
  .node.collapsed .img-count-badge.has-content,
  .node.body-collapsed .img-count-badge.has-content{ display:inline-block; }
  .node.collapsed .subtree-badge.has-content,
  .node.body-collapsed .subtree-badge.has-content{ display:inline-block; }

  /* ---------- ★ 批号（台账） ---------- */
  .batch-badge{
    display:none;
    font-size:10px; padding:1px 5px; border-radius:9px;
    font-family:ui-monospace,monospace;
    margin-left:1px; flex:none; line-height:1.4; white-space:nowrap;
    background:rgba(63,185,107,.18); color:#a6efb8;
    border:1px solid rgba(63,185,107,.4);
  }
  .node.collapsed .batch-badge.has-content,
  .node.body-collapsed .batch-badge.has-content{ display:inline-block; }

  .batch-area{

  .dash-table tbody tr{ cursor:pointer; transition:.1s; border-bottom:1px solid #1a212e; }
  .dash-table tbody tr:hover{ background:rgba(76,141,255,.08); }
  .dash-table tbody td{ padding:9px 12px; vertical-align:middle; color:var(--text); }
  .dash-table .col-lv{ width:60px; text-align:center; font-family:ui-monospace,monospace; color:var(--muted); font-size:12px; }
  .dash-table .col-lv-badge{
    display:inline-block; min-width:24px; padding:2px 8px; border-radius:5px;
    background:#1c2330; border:1px solid var(--border); color:#c9a6f0; font-size:11px;
  }
  .dash-table .col-name{ font-weight:600; }
  .dash-table .col-id{ font-family:ui-monospace,monospace; color:var(--gold); font-size:12.5px; word-break:break-all; }
  .dash-table .col-id.bad{ color:#ff8b8b; }
  .dash-table .col-id.unlinked{ color:#5d6878; font-style:italic; font-family:inherit; }
  .dash-table .col-parent{ color:var(--muted); font-size:12.5px; }
  .dash-table .col-note{ color:#a9b8cf; font-size:12px; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dash-table .col-img{ text-align:center; color:var(--muted); font-size:12px; }
  .dash-table .col-st{ text-align:center; font-size:11.5px; white-space:nowrap; }
  .dash-table .col-st.ok{ color:#7ddc9a; }
  .dash-table .col-st.bad{ color:#ff8b8b; }
  .dash-table .col-st.warn{ color:var(--gold); }
  .dash-table .lv-dot{
    display:inline-block; width:10px; height:10px; border-radius:50%;
    margin-right:8px; vertical-align:middle;
    border:1px solid rgba(255,255,255,.15);
  }
  .dash-empty{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
  .dashboard-foot{
    padding:12px 20px; border-top:1px solid var(--border);
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:#141920;
  }
  .dashboard-foot .spacer{ flex:1; }

  /* ★ 新手引导 */
  .onboard-overlay{
    position:fixed; inset:0; z-index:800;
    background:rgba(4,7,11,.72);
    display:none; align-items:center; justify-content:center;
    backdrop-filter: blur(4px);
    padding:20px;
  }
  .onboard-overlay.show{ display:flex; }
  .onboard-card{
    background:linear-gradient(180deg,#1e2431,#161b24);
    border:1px solid #35445c; border-radius:16px;
    width:min(520px, 94vw);
    padding:22px 24px;
    box-shadow:0 30px 80px rgba(0,0,0,.85), 0 0 0 1px rgba(76,141,255,.15);
    animation:onbIn .22s ease;
  }
  @keyframes onbIn{
    from{ opacity:0; transform: translateY(12px) scale(.97); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .onboard-icon{
    font-size: 36px;
    margin-bottom: 12px;
    display: inline-block;
  }
  .onboard-title{
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #fff;
    display:flex; align-items:center; gap:8px;
  }
  .onboard-title .step-badge{
    font-size: 11px;
    font-weight: 500;
    background: rgba(76,141,255,.18);
    color: #9dc2ff;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: ui-monospace, monospace;
  }
  .onboard-desc{
    color: #a9b8cf;
    font-size: 13.5px;
    line-height: 1.85;
    margin-bottom: 18px;
  }
  .onboard-desc kbd{
    background: #0f141c;
    border: 1px solid #2a3341;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 7px;
    font-family: ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--gold);
    margin: 0 2px;
  }
  .onboard-desc b{ color: #e6ebf2; }
  .onboard-desc code{
    background:#0f141c; padding:1px 6px; border-radius:4px;
    color:var(--gold); font-family:ui-monospace,monospace;
    font-size:12px;
  }
  .onboard-foot{
    display:flex; align-items:center; gap:10px;
  }
  .onboard-dots{
    display:flex; gap:6px; margin-right:auto;
  }
  .onboard-dots span{
    width: 7px; height: 7px; border-radius: 50%;
    background: #35445c;
    transition: .2s;
  }
  .onboard-dots span.active{
    background: var(--accent);
    width: 18px; border-radius: 4px;
  }

  /* ★ 恢复上次打开的文件 */
  .restore-bar{
    position:fixed; top:64px; left:50%; transform:translateX(-50%);
    z-index:520; display:none; align-items:center; gap:10px;
    background:#1c2330; border:1px solid var(--accent); border-radius:12px;
    padding:7px 12px 7px 14px; font-size:13px;
    box-shadow:0 14px 40px rgba(0,0,0,.6), 0 0 0 3px rgba(76,141,255,.18);
    max-width:92vw;
  }
  .restore-bar.show{ display:flex; }
  .restore-bar .rb-icon{ flex:none; color:#9dc2ff; }
  .restore-bar .rb-file{
    font-family:ui-monospace,monospace; color:var(--gold);
    max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
    background:#222c3d; border:1px solid var(--border); color:#fff;
    padding:9px 18px; border-radius:9px; font-size:13px; opacity:0;
    transition:.25s; pointer-events:none; z-index:500; max-width:80vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* =====================================================================
   *  ★ 皮肤（护眼主题）
   *   · dark  = 默认，下面所有覆盖规则都不作用于它 → 外观与历史版本一致
   *   · eye   = 深青（低饱和/低对比，长时间盯屏更舒服）
   *   · sepia = 羊皮纸（暖米色，白天强光下护眼）
   *   · mint  = 豆沙绿（经典护眼绿）
   *  ===================================================================== */
  :root[data-theme="eye"]{
    --bg:#0b1a1f; --panel:#12242b; --panel2:#173039; --border:#26464f;
    --text:#cbd8d5; --muted:#8fa5a2; --accent:#4fb3d9; --gold:#d9a441;
    --danger:#e06c5a; --ok:#7fc98a; --guide:#e07a9a;
    --sunken:#0e2026; --deep:#08161a; --scroll-track:#08161a; --dots:#173039;
    --head-a:#1b3841; --head-b:#153039; --menu:#16303a; --menu-line:#2c515c;
    --foot:#0e2128; --port:#3b5d68;
    --soft:#9fd8ea; --sub:#b3c7c4; --sub2:#cfe0dc; --dim:#7e9491; --dim2:#6a807d;
    --placeholder:#567073; --gold-soft:#e8c078; --ok-soft:#a8e0b0; --hover:#1d3a43;
    --shadow:0 8px 24px rgba(0,0,0,.5);
  }
  :root[data-theme="sepia"]{
    --bg:#e9e1cd; --panel:#f7f2e6; --panel2:#efe8d6; --border:#d3c7ac;
    --text:#3b3527; --muted:#7b6f5b; --accent:#2c6ca8; --gold:#8a6212;
    --danger:#b23a2a; --ok:#3c7a46; --guide:#c2185b;
    --sunken:#fdfaf1; --deep:#ded4bb; --scroll-track:#ded4bb; --dots:#cdc0a4;
    --head-a:#f0e8d5; --head-b:#e6dcc6; --menu:#f7f2e6; --menu-line:#d3c7ac;
    --foot:#e6dcc6; --port:#b5a887;
    --soft:#1c4f91; --sub:#4a4335; --sub2:#4a4335; --dim:#7b6f5b; --dim2:#8d8270;
    --placeholder:#a2957c; --gold-soft:#8a6212; --ok-soft:#2e6b3a; --hover:#ece3d1;
    --shadow:0 6px 18px rgba(96,84,62,.16);
  }
  :root[data-theme="mint"]{
    --bg:#d9e5d3; --panel:#eef5e9; --panel2:#e3eddd; --border:#c2d4bb;
    --text:#2e3a2b; --muted:#697a63; --accent:#2b7a5e; --gold:#7d5f13;
    --danger:#ab3f2b; --ok:#367a3f; --guide:#b3296b;
    --sunken:#f7fbf4; --deep:#cbdbc5; --scroll-track:#cbdbc5; --dots:#bccfb4;
    --head-a:#e6f0e0; --head-b:#dbe8d5; --menu:#eef5e9; --menu-line:#c2d4bb;
    --foot:#dbe8d5; --port:#a8bda1;
    --soft:#1b5c46; --sub:#42513e; --sub2:#42513e; --dim:#697a63; --dim2:#7a8a75;
    --placeholder:#93a48d; --gold-soft:#7d5f13; --ok-soft:#2c6b35; --hover:#e3eddd;
    --shadow:0 6px 18px rgba(70,92,66,.16);
  }

  /* ---- 非默认主题：表面 ---- */
  :root[data-theme]:not([data-theme="dark"]) .canvas{
    background-color:var(--deep);
    background-image:radial-gradient(circle,var(--dots) 1px,transparent 1px);
  }
  :root[data-theme]:not([data-theme="dark"]) .stage::-webkit-scrollbar-track{ background:var(--scroll-track); }
  :root[data-theme]:not([data-theme="dark"]) .stage::-webkit-scrollbar-thumb{ background:var(--port); }
  :root[data-theme]:not([data-theme="dark"]) .node-head{ background:linear-gradient(180deg,var(--head-a),var(--head-b)); }
  :root[data-theme]:not([data-theme="dark"]) .node{ box-shadow:var(--shadow); }
  :root[data-theme]:not([data-theme="dark"]) .node-title:focus,
  :root[data-theme]:not([data-theme="dark"]) .idrow,
  :root[data-theme]:not([data-theme="dark"]) .alt-preview-grid img{ background:var(--deep); }
  :root[data-theme]:not([data-theme="dark"]) .rule-type,
  :root[data-theme]:not([data-theme="dark"]) .r-input,
  :root[data-theme]:not([data-theme="dark"]) .mini input,
  :root[data-theme]:not([data-theme="dark"]) .base-input,
  :root[data-theme]:not([data-theme="dark"]) .note-input,
  :root[data-theme]:not([data-theme="dark"]) .batch-area,
  :root[data-theme]:not([data-theme="dark"]) .share-field input,
  :root[data-theme]:not([data-theme="dark"]) .share-field textarea,
  :root[data-theme]:not([data-theme="dark"]) .share-field select,
  :root[data-theme]:not([data-theme="dark"]) .share-url-box,
  :root[data-theme]:not([data-theme="dark"]) .share-meta-card,
  :root[data-theme]:not([data-theme="dark"]) .dashboard-search,
  :root[data-theme]:not([data-theme="dark"]) .dashboard-stats,
  :root[data-theme]:not([data-theme="dark"]) .onboard-desc kbd,
  :root[data-theme]:not([data-theme="dark"]) .onboard-desc code,
  :root[data-theme]:not([data-theme="dark"]) .share-hint code{ background:var(--sunken); }
  :root[data-theme]:not([data-theme="dark"]) .zoom-controls,
  :root[data-theme]:not([data-theme="dark"]) .selection-bar,
  :root[data-theme]:not([data-theme="dark"]) .path-tooltip,
  :root[data-theme]:not([data-theme="dark"]) .alt-image-preview,
  :root[data-theme]:not([data-theme="dark"]) .restore-bar,
  :root[data-theme]:not([data-theme="dark"]) .iv-btn,
  :root[data-theme]:not([data-theme="dark"]) .pw-toggle:hover,
  :root[data-theme]:not([data-theme="dark"]) .col-lv-badge{ background:var(--panel2); }
  :root[data-theme]:not([data-theme="dark"]) .ctx-menu{ background:var(--menu); border-color:var(--menu-line); }
  :root[data-theme]:not([data-theme="dark"]) .onboard-card{
    background:linear-gradient(180deg,var(--menu),var(--panel));
    border-color:var(--menu-line);
  }
  :root[data-theme]:not([data-theme="dark"]) .ctx-menu button .kbd,
  :root[data-theme]:not([data-theme="dark"]) .dashboard-foot{ background:var(--foot); }
  :root[data-theme]:not([data-theme="dark"]) .dashboard-head{ background:linear-gradient(180deg,var(--head-b),var(--panel)); }
  :root[data-theme]:not([data-theme="dark"]) .dash-table thead th{ background:var(--head-b); }
  :root[data-theme]:not([data-theme="dark"]) .dstat{ background:var(--panel); }
  :root[data-theme]:not([data-theme="dark"]) .onboard-dots span{ background:var(--menu-line); }
  :root[data-theme]:not([data-theme="dark"]) .port{ background:var(--port); border-color:var(--deep); }
  :root[data-theme]:not([data-theme="dark"]) .toast{ background:var(--menu); color:var(--text); }
  :root[data-theme]:not([data-theme="dark"]) .iv-bar{ background:var(--panel); }

  /* ---- 非默认主题：悬停底 ---- */
  :root[data-theme]:not([data-theme="dark"]) .tbtn:hover,
  :root[data-theme]:not([data-theme="dark"]) .icon-btn:hover,
  :root[data-theme]:not([data-theme="dark"]) .snav:hover,
  :root[data-theme]:not([data-theme="dark"]) .dashboard-close:hover,
  :root[data-theme]:not([data-theme="dark"]) .zoom-controls button:hover,
  :root[data-theme]:not([data-theme="dark"]) .mini-menu button:hover{ background:var(--hover); }

  /* ---- 非默认主题：前景 ---- */
  :root[data-theme]:not([data-theme="dark"]) .node.root .node-title,
  :root[data-theme]:not([data-theme="dark"]) .subtree-chev,
  :root[data-theme]:not([data-theme="dark"]) .img-count-badge,
  :root[data-theme]:not([data-theme="dark"]) .selection-bar .sel-count,
  :root[data-theme]:not([data-theme="dark"]) .mini-menu .tag,
  :root[data-theme]:not([data-theme="dark"]) .export-tip,
  :root[data-theme]:not([data-theme="dark"]) .share-hint.info,
  :root[data-theme]:not([data-theme="dark"]) .onboard-title .step-badge,
  :root[data-theme]:not([data-theme="dark"]) .restore-bar .rb-icon{ color:var(--soft); }
  :root[data-theme]:not([data-theme="dark"]) .rule-type,
  :root[data-theme]:not([data-theme="dark"]) .batch-title,
  :root[data-theme]:not([data-theme="dark"]) .dash-table .col-note,
  :root[data-theme]:not([data-theme="dark"]) .onboard-desc{ color:var(--sub); }
  :root[data-theme]:not([data-theme="dark"]) .note-input,
  :root[data-theme]:not([data-theme="dark"]) .swatch{ color:var(--sub2); }
  :root[data-theme]:not([data-theme="dark"]) .batch-more,
  :root[data-theme]:not([data-theme="dark"]) .ctx-menu button .kbd,
  :root[data-theme]:not([data-theme="dark"]) .pt-num,
  :root[data-theme]:not([data-theme="dark"]) .alt-preview-head .ap-hint,
  :root[data-theme]:not([data-theme="dark"]) .alt-preview-tip{ color:var(--dim); }
  :root[data-theme]:not([data-theme="dark"]) .node-id.unlinked,
  :root[data-theme]:not([data-theme="dark"]) .et-id.unlinked,
  :root[data-theme]:not([data-theme="dark"]) .dash-table .col-id.unlinked{ color:var(--dim2); }
  :root[data-theme]:not([data-theme="dark"]) .note-input::placeholder{ color:var(--placeholder); }
  :root[data-theme]:not([data-theme="dark"]) .readonly-badge,
  :root[data-theme]:not([data-theme="dark"]) .subtree-badge,
  :root[data-theme]:not([data-theme="dark"]) .share-hint.warn{ color:var(--gold-soft); }
  :root[data-theme]:not([data-theme="dark"]) .batch-badge,
  :root[data-theme]:not([data-theme="dark"]) .batch-title b,
  :root[data-theme]:not([data-theme="dark"]) .share-hint.ok,
  :root[data-theme]:not([data-theme="dark"]) .et-st.ok,
  :root[data-theme]:not([data-theme="dark"]) .dash-table .col-st.ok{ color:var(--ok-soft); }
  :root[data-theme]:not([data-theme="dark"]) .warn-bar,
  :root[data-theme]:not([data-theme="dark"]) .et-st.bad,
  :root[data-theme]:not([data-theme="dark"]) .dash-table .col-st.bad,
  :root[data-theme]:not([data-theme="dark"]) .batch-hint.bad,
  :root[data-theme]:not([data-theme="dark"]) .batch-mini.dup .b-no{ color:var(--danger); }
  :root[data-theme]:not([data-theme="dark"]) .dash-table .col-st.warn{ color:var(--gold); }
  :root[data-theme]:not([data-theme="dark"]) .icon-btn:hover,
  :root[data-theme]:not([data-theme="dark"]) .ctx-menu button:hover,
  :root[data-theme]:not([data-theme="dark"]) .selection-bar .sel-count b,
  :root[data-theme]:not([data-theme="dark"]) .alt-preview-head .ap-title{ color:var(--text); }

  /* ---- 浅色系（羊皮纸 / 豆沙绿）：彩色按钮与重阴影 ---- */
  :root:is([data-theme="sepia"],[data-theme="mint"]) .tbtn.hl{ border-color:#8fb2df; color:#1c4f91; background:rgba(76,141,255,.13); }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .tbtn.success{ border-color:#8cc79b; color:#1f6b3a; background:rgba(63,185,107,.15); }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .tbtn.imp{ border-color:#d4b070; color:#7a5310; background:rgba(224,166,58,.15); }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .tbtn.dash{ border-color:#bfa0dd; color:#5b2f96; background:rgba(178,90,214,.13); }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .tbtn.mind{ border-color:#84c4cf; color:#1c6a7a; background:rgba(58,168,186,.13); }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .tbtn.free{ border-color:#9dc48c; color:#2f6b1f; background:rgba(120,180,90,.15); }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .tbtn.danger:hover{ color:#a83232; }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .icon-btn.del:hover{ background:#f0d5cf; color:#a83232; }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .node.dragging{ box-shadow:0 12px 30px rgba(96,84,62,.28); }
  :root:is([data-theme="sepia"],[data-theme="mint"]) .modal,
  :root:is([data-theme="sepia"],[data-theme="mint"]) .dashboard,
  :root:is([data-theme="sepia"],[data-theme="mint"]) .mini-menu,
  :root:is([data-theme="sepia"],[data-theme="mint"]) .ctx-menu{ box-shadow:0 18px 44px rgba(96,84,62,.26); }

  /* ---- 非默认主题：补漏（白字 / 分隔线 / 次要底） ---- */
  :root[data-theme]:not([data-theme="dark"]) .save-status.warn{ background:var(--panel2); }
  :root[data-theme]:not([data-theme="dark"]) .dashboard-body::-webkit-scrollbar-thumb{ background:var(--port); }
  :root[data-theme]:not([data-theme="dark"]) .ctx-menu .ctx-sep{ background:var(--border); }
  :root[data-theme]:not([data-theme="dark"]) .readonly-badge button:hover,
  :root[data-theme]:not([data-theme="dark"]) .snav:hover,
  :root[data-theme]:not([data-theme="dark"]) .subtree-chev:hover,
  :root[data-theme]:not([data-theme="dark"]) .node.collapsed .subtree-chev,
  :root[data-theme]:not([data-theme="dark"]) .dashboard-close:hover,
  :root[data-theme]:not([data-theme="dark"]) .dstat .dv,
  :root[data-theme]:not([data-theme="dark"]) .onboard-title{ color:var(--text); }
  :root[data-theme]:not([data-theme="dark"]) .path-tooltip,
  :root[data-theme]:not([data-theme="dark"]) .alt-image-preview{ border-color:var(--border); }

  /* ---- 非默认主题：状态色 ---- */
  :root[data-theme]:not([data-theme="dark"]) .et-id.bad,
  :root[data-theme]:not([data-theme="dark"]) .dash-table .col-id.bad,
  :root[data-theme]:not([data-theme="dark"]) .dstat.err .dv,
  :root[data-theme]:not([data-theme="dark"]) .ctx-menu button.danger,
  :root[data-theme]:not([data-theme="dark"]) .ctx-menu button.danger:hover,
  :root[data-theme]:not([data-theme="dark"]) .iv-btn.close:hover{ color:var(--danger); }
  :root[data-theme]:not([data-theme="dark"]) .dstat.ok .dv{ color:var(--ok); }
  :root[data-theme]:not([data-theme="dark"]) .dstat.warn .dv{ color:var(--gold); }
  :root[data-theme]:not([data-theme="dark"]) .dstat.acc .dv,
  :root[data-theme]:not([data-theme="dark"]) .col-lv-badge,
  :root[data-theme]:not([data-theme="dark"]) .dashboard-head h3 span{ color:var(--accent); }

  /* 主题菜单里的色卡 */
  .theme-dots{ display:inline-flex; gap:3px; margin-left:auto; flex:none; }
  .theme-dots i{ width:12px; height:12px; border-radius:50%; border:1px solid rgba(128,128,128,.45); }
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">订货号<span>·节点生成器</span></div>
  <div class="readonly-badge" id="readonlyBadge">
    🔒 只读模式
    <button id="btnExitReadonly">退出</button>
  </div>

  <div class="undo-group">
    <button class="tbtn icon" id="btnUndo" title="撤销 (Ctrl+Z)" disabled>↶</button>
    <button class="tbtn icon" id="btnRedo" title="重做 (Ctrl+Shift+Z)" disabled>↷</button>
  </div>

  <button class="tbtn" id="btnRoot">＋ 起始节点</button>
  <button class="tbtn" id="btnGeneric" title="新建通用节点：订货号自定义，可被多个节点共用">🧩 通用节点</button>

  <div class="btn-split">
    <button class="tbtn hl" id="btnLayout" title="默认：往右竖向排列">🔀 一键排版</button>
    <button class="tbtn hl caret" id="btnLayoutMenu" title="选择其他排版方式">▾</button>
  </div>

  <button class="tbtn success" id="btnAutoToggle">📐 自动排版 · 开</button>
  <button class="tbtn" id="btnMoveMode">🔒 防重叠</button>
  <button class="tbtn" id="btnLevelColor">🎨 层级配色</button>
  <button class="tbtn dash" id="btnDashboard">📊 数据看板</button>
  <button class="tbtn success" id="btnExport">📈 导出 Excel</button>
  <button class="tbtn mind" id="btnExportMind" title="导出为 XMind 脑图（.xmind，包含折叠的子节点）">🧠 导出脑图</button>

<script>
/* =========================================================================
 *  基础工具
 * ========================================================================= */
const NS = 'http://www.w3.org/2000/svg';
const canvas = document.getElementById('canvas');
const svg    = document.getElementById('edges');
const guidesSvg = document.getElementById('guides');
const stage  = document.getElementById('stage');
const zoomWrap = document.getElementById('zoomWrap');

let uidSeed = Date.now().toString(36);
let uidCounter = 0;
const uid = p => p + '_' + uidSeed + '_' + (++uidCounter);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function hexA(hex, a) {
  const h = String(hex || '').replace('#', '');
  const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(n.slice(0,2), 16) || 0;
  const g = parseInt(n.slice(2,4), 16) || 0;
  const b = parseInt(n.slice(4,6), 16) || 0;
  return `rgba(${r},${g},${b},${a})`;
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================================
 *  全局状态
 * ========================================================================= */
const state = { nodes: [], edges: [], freeMove: false };
let visibleSet = new Set();
const selectedIds = new Set();
let autoLayoutOnToggle = true;
let readOnlyMode = false;
let clipboard = null;
let pasteCounter = 0;

const getNode  = id => state.nodes.find(n => n.id === id);
const parentOf = id => {
  const e = state.edges.find(e => e.to === id);
  return e ? getNode(e.from) : null;
};
/** ★ 通用节点可能被多个父共用：取全部父节点 */
const parentsOf = id => state.edges.filter(e => e.to === id).map(e => getNode(e.from)).filter(Boolean);

/* =========================================================================
 *  ★ 撤销 / 重做
 * ========================================================================= */
const undoStack = [];
const redoStack = [];
const UNDO_LIMIT = 50;
let undoPaused = false;
let pendingSnapshot = null;   // 事务开始时的快照

const btnUndo = document.getElementById('btnUndo');
const btnRedo = document.getElementById('btnRedo');

function updateUndoRedoBtns() {
  btnUndo.disabled = undoStack.length === 0 || readOnlyMode;
  btnRedo.disabled = redoStack.length === 0 || readOnlyMode;
}

function takeSnapshot() {
  return JSON.stringify({
    v: 14,
    freeMove: state.freeMove,
    autoLayoutOnToggle,
    zoom,
    nodes: state.nodes.map(n => ({
      id: n.id, kind: n.kind, title: n.title,
      x: n.x, y: n.y,
      baseId: n.baseId, rules: n.rules,
      generic: !!n.generic, fixedId: n.fixedId || '', locked: !!n.locked,
      note: n.note, images: n.images,
      batches: n.batches || [],
      collapsed: n.collapsed,
      bodyCollapsed: n.bodyCollapsed || false,
      color: n.color || null
    })),
    edges: state.edges
  });
}

function pushUndo() {
  if (undoPaused || readOnlyMode) return;
  undoStack.push(takeSnapshot());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  updateUndoRedoBtns();
}

// 事务：修改前 begin，修改后 commit。若中途 abort 则不记录
function beginTransaction() {
  if (undoPaused || readOnlyMode) return;
  pendingSnapshot = takeSnapshot();
}
function commitTransaction() {
  if (!pendingSnapshot) return;
  undoStack.push(pendingSnapshot);
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  pendingSnapshot = null;
  updateUndoRedoBtns();
}
function abortTransaction() {
  pendingSnapshot = null;
}

// 输入框编辑事务：focus 时 begin，blur 时 commit（仅当内容变化）
function attachUndoToInput(input) {
  let preEdit = null;
  input.addEventListener('focus', () => { preEdit = takeSnapshot(); });
  input.addEventListener('blur', () => {
    if (!preEdit) return;
    const now = takeSnapshot();
    if (now !== preEdit) {
      undoStack.push(preEdit);
      if (undoStack.length > UNDO_LIMIT) undoStack.shift();
      redoStack.length = 0;
      updateUndoRedoBtns();
    }
    preEdit = null;
  });
}

function applySnapshot(str) {
  undoPaused = true;
  try {
    const data = JSON.parse(str);
    state.nodes = (data.nodes || []).map(n => ({
      ...n,
      note: n.note || '',
      images: n.images || [],
      batches: n.batches || [],
      generic: !!n.generic, fixedId: n.fixedId || '', locked: !!n.locked,
      collapsed: !!n.collapsed,
      bodyCollapsed: !!n.bodyCollapsed,
      color: n.color || null,
      rules: n.rules || []
    }));
    state.edges = data.edges || [];
    state.freeMove = !!data.freeMove;
    if (typeof data.autoLayoutOnToggle === 'boolean') {
      autoLayoutOnToggle = data.autoLayoutOnToggle;
      updateAutoToggleBtn();
    }
    selectedIds.clear();
    render();
    if (data.zoom && data.zoom !== 1) applyZoom(data.zoom);
  } finally {
    undoPaused = false;
  }
}

function doUndo() {
  if (readOnlyMode) return toast('只读模式无法撤销');
  if (!undoStack.length) return toast('没有可撤销的操作');
  const cur = takeSnapshot();
  const prev = undoStack.pop();
  redoStack.push(cur);
  applySnapshot(prev);
  updateUndoRedoBtns();
  toast('已撤销');
}
function doRedo() {
  if (readOnlyMode) return toast('只读模式无法重做');
  if (!redoStack.length) return toast('没有可重做的操作');
  const cur = takeSnapshot();
  const next = redoStack.pop();
  undoStack.push(cur);
  applySnapshot(next);
  updateUndoRedoBtns();
  toast('已重做');
}
btnUndo.onclick = doUndo;
btnRedo.onclick = doRedo;

/* =========================================================================
 *  只读模式
 * ========================================================================= */
function applyReadOnlyUI() {
  const badge = document.getElementById('readonlyBadge');
  if (readOnlyMode) {
    document.body.classList.add('readonly-mode');
    badge.classList.add('show');
    ['btnRoot','btnLayout','btnLayoutMenu','btnAutoToggle','btnMoveMode','btnLevelColor',
     'btnImport','btnSaveFile','btnSaveNow','btnOpenFile','btnClear'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.disabled = true;
    });
    document.getElementById('selectionBar').classList.remove('show');
  } else {
    document.body.classList.remove('readonly-mode');
    badge.classList.remove('show');
    ['btnRoot','btnLayout','btnLayoutMenu','btnAutoToggle','btnMoveMode','btnLevelColor',
     'btnImport','btnSaveFile','btnSaveNow','btnOpenFile','btnClear'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.disabled = false;
    });
  }
  updateUndoRedoBtns();
  render();
}
document.getElementById('btnExitReadonly').onclick = () => {
  if (!confirm('退出只读模式后可以编辑数据，确认退出？')) return;
  readOnlyMode = false;
  applyReadOnlyUI();
  toast('已退出只读模式');
};
function guardReadOnly() {
  if (readOnlyMode) { toast('只读模式，无法修改数据'); return true; }
  return false;
}
/** ★ 锁定节点守卫：锁定后禁止拖动 / 编辑 / 连线，但允许查看与复制编码 */
function guardLocked(node, action) {
  if (node && node.locked) {
    toast(`节点「${node.title || '未命名'}」已锁定，请先解锁${action ? '（' + action + '）' : ''}`);
    return true;
  }
  return false;
}
/** ★ 批量锁定 / 解锁：已全锁则解锁，否则全部锁定 */
function toggleLockMany(nodes) {
  if (guardReadOnly()) return;
  const list = (nodes || []).filter(Boolean);
  if (!list.length) return;
  pushUndo();
  const allLocked = list.every(n => n.locked);
  list.forEach(n => { n.locked = !allLocked; });
  render(); markDirty(); updateSelectionBar();
  const what = list.length === 1 ? `「${list[0].title || '未命名'}」` : `${list.length} 个节点`;
  toast(allLocked
    ? `已解锁${what}`
    : `已锁定${what}：拖动 / 编辑 / 连线均已禁用`);
}

/* =========================================================================
 *  层级配色
 * ========================================================================= */
const LEVEL_COLORS = [
  '#4c8dff', '#3fb96b', '#e0a63a', '#e05252', '#b25ad6',
  '#2fa8a0', '#e2703a', '#8bc34a', '#4a7ac8', '#7a869a'
];
function levelColorOf(depth) {
  return LEVEL_COLORS[((depth % LEVEL_COLORS.length) + LEVEL_COLORS.length) % LEVEL_COLORS.length];
}
function applyLevelColorsToAll(silent) {
  if (guardReadOnly()) return;
  pushUndo();
  const depthMap = computeNodeDepth();
  // ★ 通用节点保留自己的紫色标识，不参与层级配色
  state.nodes.forEach(n => { if (!n.generic && !n.locked) n.color = levelColorOf(depthMap.get(n.id) ?? 0); });
  render(); markDirty();
  if (!silent) toast('已按层级自动配色 · 同级同色');
}
document.getElementById('btnLevelColor').onclick = () => applyLevelColorsToAll(false);

/* =========================================================================
 *  ★ 皮肤（护眼主题）
 * ========================================================================= */
const THEME_KEY = 'order-node-theme';
const THEMES = [
  { id: 'dark',  name: '暗夜',     desc: '默认深色，蓝调高对比',           dots: ['#0e1116', '#4c8dff', '#e6ebf2'] },
  { id: 'eye',   name: '深青',     desc: '低饱和 / 低对比，久看不累',       dots: ['#0b1a1f', '#4fb3d9', '#cbd8d5'] },
  { id: 'sepia', name: '羊皮纸',   desc: '暖米色，白天或强光下更舒服',     dots: ['#e9e1cd', '#2c6ca8', '#3b3527'] },
  { id: 'mint',  name: '豆沙绿',   desc: '经典护眼绿，柔和不刺眼',         dots: ['#d9e5d3', '#2b7a5e', '#2e3a2b'] },
  { id: 'auto',  name: '跟随系统', desc: '系统浅色 → 羊皮纸，深色 → 暗夜', dots: null }
];
let themePref = 'dark';

function resolveTheme(pref) {
  if (pref !== 'auto') return pref;
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'sepia' : 'dark';
}
function applyTheme(pref, silent) {
  if (!THEMES.some(t => t.id === pref)) pref = 'dark';
  themePref = pref;
  document.documentElement.dataset.theme = resolveTheme(pref);
  try { localStorage.setItem(THEME_KEY, pref); } catch (e) {}
  const cur = THEMES.find(t => t.id === pref) || THEMES[0];
  const btn = document.getElementById('btnTheme');
  if (btn) {
    btn.textContent = '🎨 ' + cur.name;
    btn.title = `当前皮肤：${cur.name}（点击切换）`;
  }
  if (!silent) toast(`已切换到「${cur.name}」` + (pref === 'auto' ? '（跟随系统）' : ''));
}

let themeMenuEl = null, themeMenuOutside = null;
function closeThemeMenu() {
  if (themeMenuEl) { themeMenuEl.remove(); themeMenuEl = null; }
  if (themeMenuOutside) { document.removeEventListener('pointerdown', themeMenuOutside, true); themeMenuOutside = null; }
}
function openThemeMenu(anchorBtn) {
  closeThemeMenu();
  const m = el('div', 'mini-menu');
  for (const t of THEMES) {
    const b = el('button', t.id === themePref ? 'primary' : '');
    const head = el('b');
    head.append(document.createTextNode(t.name));
    if (t.id === themePref) head.appendChild(el('span', 'tag', '当前'));
    const dots = el('span', 'theme-dots');
    (t.dots || ['#f7f2e6', '#8899a6', '#141a20']).forEach(c => {
      const i = el('i'); i.style.background = c; dots.appendChild(i);
    });
    head.appendChild(dots);
    b.append(head, el('small', null, t.desc));
    b.onclick = ev => { ev.stopPropagation(); closeThemeMenu(); applyTheme(t.id); };
    m.appendChild(b);
  }
  document.body.appendChild(m);
  themeMenuEl = m;
  const r = anchorBtn.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;

/* =========================================================================
 *  缩放
 * ========================================================================= */
let zoom = 1;
const ZOOM_MIN = 0.25, ZOOM_MAX = 3;

function updateZoomWrap() {
  const w = parseFloat(canvas.dataset.w) || 4600;
  const h = parseFloat(canvas.dataset.h) || 3400;
  zoomWrap.style.width  = (w * zoom) + 'px';
  zoomWrap.style.height = (h * zoom) + 'px';
}
function updateZoomDisplay() {
  const z = document.getElementById('zoomValue');
  if (z) z.textContent = Math.round(zoom * 100) + '%';
}
function applyZoom(newZoom, anchorClientX, anchorClientY) {
  newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
  if (Math.abs(newZoom - zoom) < 0.001) return;
  const stageRect = stage.getBoundingClientRect();
  let anchorX, anchorY;
  if (anchorClientX != null && anchorClientY != null) {
    anchorX = (anchorClientX - stageRect.left) + stage.scrollLeft;
    anchorY = (anchorClientY - stageRect.top) + stage.scrollTop;
  } else {
    anchorX = stage.scrollLeft + stage.clientWidth / 2;
    anchorY = stage.scrollTop + stage.clientHeight / 2;
  }
  const ratio = newZoom / zoom;
  const newAnchorX = anchorX * ratio;
  const newAnchorY = anchorY * ratio;
  zoom = newZoom;
  canvas.style.transform = `scale(${zoom})`;
  updateZoomWrap();
  if (anchorClientX != null && anchorClientY != null) {
    stage.scrollLeft = newAnchorX - (anchorClientX - stageRect.left);
    stage.scrollTop  = newAnchorY - (anchorClientY - stageRect.top);
  } else {
    stage.scrollLeft = newAnchorX - stage.clientWidth / 2;
    stage.scrollTop  = newAnchorY - stage.clientHeight / 2;
  }
  updateZoomDisplay();
  hideTitleTooltip();
  // 虚拟化重新评估
  scheduleViewportSync();
}
function setCanvasSize(w, h) {
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.dataset.w = w;
  canvas.dataset.h = h;
  updateZoomWrap();
}
stage.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  applyZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
}, { passive: false });

document.getElementById('zoomIn').onclick  = () => applyZoom(zoom * 1.2);
document.getElementById('zoomOut').onclick = () => applyZoom(zoom / 1.2);
document.getElementById('zoomValue').onclick = () => applyZoom(1);
document.getElementById('zoomFit').onclick = () => {
  if (!state.nodes.length) return;
  const minX = Math.min(...state.nodes.map(n => n.x));
  const minY = Math.min(...state.nodes.map(n => n.y));
  const maxX = Math.max(...state.nodes.map(n => n.x + (n._w || NODE_W)));
  const maxY = Math.max(...state.nodes.map(n => n.y + (n._h || DEF_H)));
  const pad = 80;
  const fitW = (maxX - minX) + pad * 2;
  const fitH = (maxY - minY) + pad * 2;
  const nz = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.min(stage.clientWidth / fitW, stage.clientHeight / fitH)));
  applyZoom(nz);
  setTimeout(() => {
    stage.scrollLeft = (minX - pad) * zoom;
    stage.scrollTop  = (minY - pad) * zoom;
    scheduleViewportSync();
  }, 30);
};

/* =========================================================================
 *  ID 计算
 * ========================================================================= */
function parseOptions(text) {
  return String(text || '')
    .split(/[,\n;，]/).map(s => s.trim()).filter(Boolean)
    .map(s => {
      const m = s.split(/[:：=]/);
      if (m.length >= 2) return { code: m[0].trim(), label: m.slice(1).join(':').trim() };
      return { code: s, label: s };
    });
}
function formatDate(fmt) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return String(fmt)
    .replace(/YYYY/g, d.getFullYear())
    .replace(/YY/g, String(d.getFullYear()).slice(2))
    .replace(/MM/g, p(d.getMonth() + 1))
    .replace(/DD/g, p(d.getDate()));
}
function autoSeq(node, rule) {
  const start = Number(rule.value) || 1;
  const p = parentOf(node.id);
  if (!p) return start;
  const pool = state.nodes.filter(n => n.kind === 'rule' && parentOf(n.id)?.id === p.id);
  const idx = pool.findIndex(n => n.id === node.id);
  return start + (idx < 0 ? 0 : idx);
}
function ruleSegment(node, rule) {
  switch (rule.type) {
    case 'fixed':  return rule.text || '';
    case 'choice': {
      const opts = parseOptions(rule.options);
      if (!opts.length) return '';
      const sel = opts.find(o => o.code === rule.selected) || opts[0];
      return sel ? sel.code : '';
    }
    case 'seq': {
      const v = rule.auto ? autoSeq(node, rule) : (Number(rule.value) || 0);
      const w = Math.max(1, Math.min(8, Number(rule.digits) || 1));
      return String(v).padStart(w, '0');
    }
    case 'date': return formatDate(rule.format || 'YYYYMMDD');
  }
  return '';
}
function segmentOf(node) {
  if (node.kind === 'root') return null;
  return node.rules.map(r => ruleSegment(node, r)).join('');
}
function computeId(node, depth = 0) {
  if (depth > 80) return null;
  // ★ 通用节点：订货号由用户自定义，不参与父级拼接、不受父级规则影响
  if (node.generic) return node.fixedId || '';
  if (node.kind === 'root') return node.baseId || '';
  const p = parentOf(node.id);
  if (!p) return null;
  const base = computeId(p, depth + 1);
  if (base === null) return null;
  return base + segmentOf(node);
}
function checkDuplicates() {
  const groups = new Map();
  const conflict = new Set();
  const genericSeen = new Map();   // ★ 通用节点：自定义编码要求全局唯一
  for (const n of state.nodes) {
    if (n.generic) {
      const code = String(n.fixedId || '').trim();
      if (code) {
        if (genericSeen.has(code)) { conflict.add(n.id); conflict.add(genericSeen.get(code)); }
        else genericSeen.set(code, n.id);
      }
      continue;   // 通用节点不参与「同父同级」比较
    }
    if (n.kind === 'root') continue;
    const p = parentOf(n.id);
    if (!p) continue;
    if (!groups.has(p.id)) groups.set(p.id, []);
    groups.get(p.id).push({ node: n, seg: segmentOf(n) });
  }
  for (const arr of groups.values()) {
    const seen = new Map();
    for (const { node, seg } of arr) {
      if (seen.has(seg)) { conflict.add(node.id); conflict.add(seen.get(seg).id); }
      else seen.set(seg, node);
    }
  }
  return conflict;
}
function computeNodeDepth() {
  const d = new Map();
  const visited = new Set();
  const walk = (n, lv) => {
    if (!n || visited.has(n.id)) return;
    visited.add(n.id);
    d.set(n.id, lv);
    for (const e of state.edges) if (e.from === n.id) walk(getNode(e.to), lv + 1);
  };
  state.nodes.forEach(n => { if (n.kind === 'root' || !parentOf(n.id)) walk(n, 0); });
  state.nodes.forEach(n => { if (!d.has(n.id)) d.set(n.id, 0); });
  return d;
}
function computeVisible() {
  const visible = new Set();
  const guard = new Set();
  const visit = n => {
    if (!n || guard.has(n.id)) return;
    guard.add(n.id);
    visible.add(n.id);
    if (n.collapsed) return;
    for (const e of state.edges) if (e.from === n.id) visit(getNode(e.to));
  };
  for (const n of state.nodes) if (n.kind === 'root') visit(n);
  for (const n of state.nodes) {
    if (n.kind !== 'root' && !parentOf(n.id)) visible.add(n.id);
  }
  return visible;
}

/* =========================================================================
 *  碰撞检测
 * ========================================================================= */
const NODE_W = 274;
const DEF_H  = 220;
const MIN_GAP = 6;

function rectOf(n, x, y) { return { x, y, w: n._w || NODE_W, h: n._h || DEF_H }; }
function overlap(a, b, gap = MIN_GAP) {
  return !(a.x + a.w + gap <= b.x || b.x + b.w + gap <= a.x ||
           a.y + a.h + gap <= b.y || b.y + b.h + gap <= a.y);
}
function collides(node, x, y) {
  const a = rectOf(node, x, y);
  for (const o of state.nodes) {
    if (o.id === node.id) continue;
    if (!visibleSet.has(o.id)) continue;
    if (overlap(a, rectOf(o))) return true;
  }
  return false;
}
function collidesExcluding(node, x, y, excludeIds) {
  const a = rectOf(node, x, y);
  for (const o of state.nodes) {
    if (o.id === node.id) continue;
    if (excludeIds.has(o.id)) continue;
    if (!visibleSet.has(o.id)) continue;
    if (overlap(a, rectOf(o))) return true;
  }
  return false;
}
function findFreeSpot(node, sx, sy) {
  const w = node._w || NODE_W, h = node._h || DEF_H;
  const stepX = w + 30, stepY = h + 30;
  for (let ring = 0; ring < 26; ring++) {
    for (let dy = -ring; dy <= ring; dy++) {
      for (let dx = -ring; dx <= ring; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
        const x = Math.max(0, sx + dx * stepX);
        const y = Math.max(0, sy + dy * stepY);
        if (!collides(node, x, y)) return { x, y };
      }
    }
  }
  return { x: sx, y: sy };
}
function measureNodeHeights() {
  for (const n of state.nodes) {
    const e = canvas.querySelector(`.node[data-id="${n.id}"]`);
    if (e) { n._w = e.offsetWidth; n._h = e.offsetHeight; }
    else {
      // 虚拟化未渲染的节点：用缓存或默认
      if (!n._w) n._w = NODE_W;
      if (!n._h) n._h = (n.collapsed || n.bodyCollapsed) ? 42 : DEF_H;
    }
  }
}

/* =========================================================================
 *  ★ 绘制节流（rAF 调度）

let drawRafPending = false;
function scheduleDraw() {

/* =========================================================================
 *  画线
 * ========================================================================= */
function portPos(nodeId, side) {
  const nodeEl = canvas.querySelector(`.node[data-id="${nodeId}"]`);
  if (!nodeEl) return null;
  return {
    x: side === 'out' ? nodeEl.offsetLeft + nodeEl.offsetWidth : nodeEl.offsetLeft,
    y: nodeEl.offsetTop + 24
  };
}
function curve(a, b) {
  const dx = Math.max(50, Math.abs(b.x - a.x) * 0.45);
  return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
}
function toCanvas(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) / zoom, y: (cy - r.top) / zoom };
}
function drawEdges() {
  svg.innerHTML = '';
  for (const e of state.edges) {
    const a = portPos(e.from, 'out');
    const b = portPos(e.to, 'in');
    if (!a || !b) continue;
    const d = curve(a, b);

    const hit = document.createElementNS(NS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'edge-hit');
    hit.addEventListener('click', ev => {
      ev.stopPropagation();
      if (guardReadOnly()) return;
      removeEdge(e.id);   // ★ 走统一入口：锁定节点会被拦下
    });

    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge');

    svg.append(hit, path);
  }
}

/* =========================================================================
 *  ★ 对齐辅助线
 * ========================================================================= */
const SNAP_THRESHOLD_PX = 8;
let activeGuides = { v: [], h: [] };

function clearGuides() {
  guidesSvg.innerHTML = '';
  activeGuides = { v: [], h: [] };
}

function drawGuides() {
  guidesSvg.innerHTML = '';
  // 竖直辅助线（贯穿画布）
  for (const gx of activeGuides.v) {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', gx);
    line.setAttribute('y1', 0);
    line.setAttribute('x2', gx);
    line.setAttribute('y2', canvas.offsetHeight || 3400);
    line.setAttribute('class', 'guide');
    guidesSvg.appendChild(line);
  }
  // 水平辅助线
  for (const gy of activeGuides.h) {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', 0);

    line.setAttribute('class', 'guide');

  }

/**
 * 计算拖动时的吸附与辅助线（按矩形计算，供单节点与批量整组共用）
 * @param {{x:number,y:number,w:number,h:number}} rect 拖动中的矩形（画布坐标）
 * @param {Set<string>} excludeIds 不参与对齐比较的节点（自身 / 整组）
 * @returns {snapX, snapY, guideX, guideY}
 */
function computeRectSnapAndGuides(rect, excludeIds) {
  const w = rect.w;
  const h = rect.h;
  const threshold = SNAP_THRESHOLD_PX / zoom;

  // 拖动方自身的关键 X/Y（绝对坐标）
  const myX = [
    { pos: rect.x,         off: 0 },
    { pos: rect.x + w / 2, off: w / 2 },
    { pos: rect.x + w,     off: w }
  ];
  const myY = [
    { pos: rect.y,         off: 0 },
    { pos: rect.y + h / 2, off: h / 2 },
    { pos: rect.y + h,     off: h }
  ];

  let bestX = null, bestY = null;

  for (const o of state.nodes) {
    if (excludeIds.has(o.id)) continue;
    if (!visibleSet.has(o.id)) continue;

    const ow = o._w || NODE_W;
    const oh = o._h || DEF_H;
    const oX = [o.x, o.x + ow / 2, o.x + ow];
    const oY = [o.y, o.y + oh / 2, o.y + oh];

    // 竖直方向
    for (const mine of myX) {
      for (const ox of oX) {
        const delta = ox - mine.pos;
        if (Math.abs(delta) < threshold) {
          if (!bestX || Math.abs(delta) < Math.abs(bestX.delta)) {
            bestX = { delta, guideX: ox };
          }
        }
      }
    }
    // 水平方向
    for (const mine of myY) {
      for (const oy of oY) {
        const delta = oy - mine.pos;
        if (Math.abs(delta) < threshold) {
          if (!bestY || Math.abs(delta) < Math.abs(bestY.delta)) {
            bestY = { delta, guideY: oy };
          }
        }
      }
    }
  }

  return {
    snapX: bestX ? bestX.delta : 0,
    snapY: bestY ? bestY.delta : 0,
    guideX: bestX ? bestX.guideX : null,
    guideY: bestY ? bestY.guideY : null
  };
}

/** 单节点拖动：沿用原签名 */
function computeSnapAndGuides(node, nx, ny, excludeIds) {
  return computeRectSnapAndGuides(
    { x: nx, y: ny, w: node._w || NODE_W, h: node._h || DEF_H },
    excludeIds
  );
}

/* =========================================================================
 *  刷新 ID / 冲突
 * ========================================================================= */
function refreshIds() {
  const conflicts = checkDuplicates();
  for (const n of state.nodes) {
    const nodeEl = canvas.querySelector(`.node[data-id="${n.id}"]`);
    if (!nodeEl) continue;
    const idEl = nodeEl.querySelector('.node-id');
    const v = computeId(n);
    if (v === null) {
      idEl.textContent = '未连接';
      idEl.classList.add('unlinked');
    } else {
      idEl.textContent = v || '—';
      idEl.classList.remove('unlinked');
    }
    const bad = conflicts.has(n.id);
    nodeEl.classList.toggle('conflict', bad);
    // ★ 同步左上角的订货号角标
    const flag = nodeEl.querySelector('.node-code-flag');
    if (flag) {
      flag.textContent = (n.locked ? '🔒 ' : '') + (n.generic ? '🧩 ' : '') + (v === null ? '未连接' : (v || '（空）'));
      flag.title = n.generic
        ? (v ? `通用节点 · 自定义订货号：${v}（点击复制）` : '通用节点 · 尚未填写自定义订货号')
        : (v === null ? '该节点尚未连接到起始节点' : `订货号：${v}（点击复制）`);
      flag.classList.toggle('unlinked', v === null);
      flag.classList.toggle('empty', v !== null && !v);
      flag.classList.toggle('bad', bad);
    }
    const wb = nodeEl.querySelector('.warn-bar');
    if (wb) wb.style.display = bad ? 'flex' : 'none';
  }
}

  custom.title = '自定义颜色';
