<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>订货号生成器 · 节点式</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b24; --panel2:#1c2330; --border:#2a3341;
    --text:#e6ebf2; --muted:#8a97ab; --accent:#4c8dff; --gold:#ffb74d;
    --danger:#ef4444; --ok:#7ddc9a; --guide:#ff4c8d;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; display:flex; flex-direction:column;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  .toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--border);
    z-index:20; box-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  .brand{ font-weight:700; letter-spacing:.5px; margin-right:4px; white-space:nowrap; }
  .brand span{ color:var(--accent); }
  .readonly-badge{
    display:none; align-items:center; gap:5px;
    background:rgba(255,183,77,.15); border:1px solid rgba(255,183,77,.45);
    color:#ffce7a; padding:3px 10px; border-radius:6px;
    font-size:12px; font-weight:600; white-space:nowrap;
  }
  .readonly-badge.show{ display:inline-flex; }
  .readonly-badge button{
    background:transparent; border:none; color:#ffce7a;
    font-size:11px; cursor:pointer; text-decoration:underline;
    padding:0 2px; font-family:inherit;
  }
  .readonly-badge button:hover{ color:#fff; }

  .tbtn{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:6px 12px; border-radius:8px; cursor:pointer; font-size:13px;
    transition:.15s; white-space:nowrap; font-family:inherit;
  }
  .tbtn:hover{ border-color:var(--accent); background:#222c3d; }
  .tbtn.danger:hover{ border-color:var(--danger); color:#ff9d9d; }
  .tbtn.hl{ border-color:#3a5f9e; color:#9dc2ff; background:#1d2a42; }
  .tbtn.hl:hover{ border-color:var(--accent); background:#22314d; }
  .tbtn.free{ border-color:#4a7a3a; color:#b6e6a0; background:#1e2c19; }
  .tbtn.success{ border-color:#3fb96b; color:#a6efb8; background:rgba(63,185,107,.12); }
  .tbtn.success:hover{ border-color:#7ddc9a; background:rgba(63,185,107,.22); }
  .tbtn.imp{ border-color:#8a6a2a; color:#ffce7a; background:rgba(224,166,58,.1); }
  .tbtn.imp:hover{ border-color:var(--gold); background:rgba(224,166,58,.2); }
  .tbtn.dash{ border-color:#7a4ab8; color:#c9a6f0; background:rgba(178,90,214,.1); }
  .tbtn.dash:hover{ border-color:#b25ad6; background:rgba(178,90,214,.22); }
  .tbtn:disabled{ opacity:.35; cursor:not-allowed; }
  .spacer{ flex:1; }

  .btn-split{ display:flex; }
  .btn-split .tbtn:first-child{ border-top-right-radius:0; border-bottom-right-radius:0; }
  .btn-split .tbtn.caret{
    border-top-left-radius:0; border-bottom-left-radius:0;
    padding:6px 9px; border-left:1px solid rgba(76,141,255,.25);
  }

  /* 撤销重做按钮 */
  .undo-group{ display:flex; gap:2px; }
  .undo-group .tbtn{ padding:6px 10px; font-size:13px; }
  .undo-group .tbtn.icon{ min-width:32px; padding:6px 6px; }

  .search-box{
    display:flex; align-items:center; gap:2px;
    background:var(--panel2); border:1px solid var(--border);
    border-radius:8px; padding:3px 5px 3px 10px;
  }
  .search-box:focus-within{ border-color:var(--accent); }
  .search-box input{
    background:transparent; border:none; outline:none; color:var(--text);
    width:130px; font-size:13px; font-family:inherit;
  }
  .search-box .cnt{ font-size:11px; color:var(--muted); min-width:36px; text-align:center; }
  .snav{
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    width:20px; height:20px; border-radius:5px; font-size:11px; line-height:1;
  }
  .snav:hover{ background:#2a3341; color:#fff; }

  .save-status{
    font-size:12px; padding:4px 10px; border-radius:6px; white-space:nowrap;
    font-family:ui-monospace,monospace;
  }
  .save-status.ok{ color:var(--ok); background:rgba(60,180,110,.12); }
  .save-status.dirty{ color:var(--gold); background:rgba(255,183,77,.12); }
  .save-status.warn{ color:var(--muted); background:#1c2330; }

  /* ---------- 只读 ---------- */
  body.readonly-mode .node-title,
  body.readonly-mode .node .base-input,
  body.readonly-mode .node .note-input,
  body.readonly-mode .node .r-input,
  body.readonly-mode .node .rule-type,
  body.readonly-mode .node .color-dot,
  body.readonly-mode .node .icon-btn:not(.chev):not(.subtree-chev),
  body.readonly-mode .node .add-rule,
  body.readonly-mode .node .add-img,
  body.readonly-mode .node .thumb-del,
  body.readonly-mode .node .mini input,
  body.readonly-mode .port{
    pointer-events: none !important;
    opacity: .55;
  }
  body.readonly-mode .node .port{ opacity: .3; }
  body.readonly-mode .node .node-head{ cursor: default !important; }

  /* ---------- 画布 ---------- */
  .stage{ flex:1; overflow:auto; position:relative; }
  /* ★ 中键平移画布：拖动期间显示抓手光标并禁止选中文本 */
  body.canvas-panning,
  body.canvas-panning *{ cursor: grabbing !important; user-select: none !important; }
  .stage::-webkit-scrollbar{ width:12px; height:12px; }
  .stage::-webkit-scrollbar-thumb{ background:#2a3341; border-radius:6px; }
  .stage::-webkit-scrollbar-track{ background:#0a0d12; }

  .zoom-wrap{ position:relative; }

  .canvas{
    position:relative; width:4600px; height:3400px;
    background-color:#0b0f15;
    background-image:radial-gradient(circle,#1e2635 1px,transparent 1px);
    background-size:24px 24px;
    transform-origin: 0 0;
    position:absolute; top:0; left:0;
  }
  #edges{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #edges .edge{ fill:none; stroke:#3a5f9e; stroke-width:2; transition:stroke .15s; }
  #edges .edge-hit{ fill:none; stroke:transparent; stroke-width:20; pointer-events:stroke; cursor:pointer; }
  #edges .edge-hit:hover + .edge{ stroke:var(--danger); stroke-width:3; }
  #edges .edge.temp{ stroke:var(--accent); stroke-dasharray:6 5; }

  /* ★ 对齐辅助线层 */
  #guides{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; overflow:visible; z-index:180;
  }
  #guides .guide{
    stroke: var(--guide); stroke-width:1.2; stroke-dasharray: 4 3;
    vector-effect: non-scaling-stroke;
    opacity: 0.9;
  }
  #guides .guide.glow{
    stroke-width: 3; opacity: 0.25; filter: blur(2px);
  }

  .selection-box{
    position:absolute; pointer-events:none; z-index:200;
    border:1.5px dashed var(--accent);
    background:rgba(76,141,255,.13);
    border-radius:3px;
    box-shadow:0 0 0 1px rgba(76,141,255,.25) inset;
  }

  /* ---------- 节点 ---------- */
  .node{
    position:absolute; width:274px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    transition:box-shadow .15s, border-color .15s, opacity .2s;
  }
  .node.root{ border-color:#2f4f8a; }
  .node.dragging{ box-shadow:0 18px 44px rgba(0,0,0,.65); z-index:10; }
  .node.dragging-batch{ box-shadow:0 20px 50px rgba(76,141,255,.4), 0 0 0 2px rgba(76,141,255,.35); z-index:11; }
  .node.drop-target{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(76,141,255,.3),0 8px 24px rgba(0,0,0,.45); }
  .node.conflict{ border-color:var(--danger) !important; box-shadow:0 0 0 2px rgba(239,68,68,.22),0 8px 24px rgba(0,0,0,.45); }
  .node.selected{ outline: 3px solid var(--accent); outline-offset: 3px; }
  .node.search-dim{ opacity:.2; }
  .node.search-hit{ box-shadow:0 0 0 3px rgba(255,183,77,.4),0 8px 24px rgba(0,0,0,.5); }
  .node.flash{ animation:flash 1.15s ease; }
  .node.alt-hover{ box-shadow:0 0 0 2px rgba(76,141,255,.5), 0 8px 24px rgba(0,0,0,.5); }
  @keyframes flash{
    0%,100%{ outline:0 solid transparent; }
    25%{ outline:4px solid var(--accent); outline-offset:4px; }
  }

  .node-head{
    display:flex; align-items:center; gap:2px; padding:6px 6px 6px 5px;
    background:linear-gradient(180deg,#212a3a,#1b2230);
    border-radius:11px 11px 0 0; border-bottom:1px solid var(--border);
    cursor:grab;
  }
  .node.collapsed .node-head,
  .node.body-collapsed .node-head{
    border-bottom:none; border-radius:11px;
  }
  .node.collapsed .node-body,
  .node.body-collapsed .node-body{ display:none; }
  .node.body-collapsed, .node.collapsed{ border-style:dashed; }
  .node.dragging .node-head{ cursor:grabbing; }
  .node-title{
    flex:1; min-width:0; background:transparent; border:none; color:var(--text);
    font-weight:600; font-size:13px; padding:2px 0; outline:none; font-family:inherit;
  }
  .node-title:focus{ background:#0b0f15; border-radius:5px; padding:2px 5px; }
  .node.root .node-title{ color:#9dc2ff; }

  .icon-btn{
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    width:20px; height:20px; border-radius:5px; display:grid; place-items:center;
    font-size:12px; line-height:1; flex:none; padding:0; font-family:inherit;
  }
  .icon-btn:hover{ background:#2a3341; color:#fff; }
  .icon-btn.del:hover{ background:#4a1e1e; color:#ff9d9d; }
  .chev{ font-size:11px; }

  .subtree-chev{
    background:rgba(76,141,255,.12);
    border:1px solid rgba(76,141,255,.28);
    border-radius:5px;
    font-size:11px;
    width:22px; height:22px;
    color:#9dc2ff;
  }
  .subtree-chev:hover{
    background:rgba(76,141,255,.25);
    border-color:var(--accent);
    color:#fff;
  }
  .node.collapsed .subtree-chev{
    background:rgba(76,141,255,.28);
    border-color:var(--accent);
    color:#fff;
  }

  .color-dot{
    width:15px; height:15px; border-radius:50%; flex:none; cursor:pointer;
    border:1px solid rgba(255,255,255,.28); padding:0;
    background:linear-gradient(135deg,#4c8dff,#3a5f9e);
  }
  .color-dot:hover{ transform:scale(1.15); }

  .node-body{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:9px; }

  .idrow{
    display:flex; align-items:center; gap:6px;
    background:#0b0f15; border:1px solid var(--border); border-radius:8px;
    padding:6px 6px 6px 9px;
    cursor:help;
  }
  .idrow:hover{ border-color:#3a5f9e; }
  .node-id{
    flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px; color:var(--gold); word-break:break-all; line-height:1.35;
  }
  .node-id.unlinked{ color:#5d6878; font-style:italic; font-family:inherit; }

  .warn-bar{
    display:none; align-items:center; gap:6px;
    background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.4);
    color:#ff9d9d; border-radius:7px; padding:5px 8px; font-size:11.5px;
  }

  .rules{ display:flex; flex-direction:column; gap:8px; }
  .rule{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    padding:7px 8px; display:flex; flex-direction:column; gap:6px;
  }
  .rule-top{ display:flex; align-items:center; gap:6px; }
  .rule-type{
    flex:1; background:#0f141c; color:#a9b8cf; border:1px solid var(--border);
    border-radius:6px; padding:3px 6px; font-size:12px; outline:none; font-family:inherit;
  }
  .rule-body{ display:flex; flex-direction:column; gap:6px; }
  .r-input{
    width:100%; background:#0f141c; color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 7px; font-size:12px; outline:none; font-family:inherit;
  }
  .r-input:focus{ border-color:var(--accent); }
  .r-input.num{ width:56px; }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mini{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); }
  .mini.chk{ cursor:pointer; user-select:none; }
  .mini input[type=number]{ background:#0f141c; color:var(--text); border:1px solid var(--border);
    border-radius:5px; padding:3px 5px; width:52px; font-size:11px; outline:none; font-family:inherit; }

  .field{ display:flex; flex-direction:column; gap:4px; }
  .field span{ font-size:11px; color:var(--muted); }
  .base-input{
    width:100%; background:#0f141c; color:var(--gold); border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-size:14px; outline:none;
    font-family:ui-monospace,monospace; letter-spacing:1px;
  }
  .base-input:focus{ border-color:var(--accent); }

  .add-rule{
    background:transparent; border:1px dashed var(--border); color:var(--muted);
    border-radius:7px; padding:5px; cursor:pointer; font-size:12px; transition:.15s;
    font-family:inherit;
  }
  .add-rule:hover{ border-color:var(--accent); color:var(--accent); }

  .note-input{
    width:100%; min-height:46px; resize:vertical;
    background:#0f141c; color:#cfd8e6; border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-size:12px; outline:none;
    font-family:inherit; line-height:1.5;
  }
  .note-input:focus{ border-color:var(--accent); }
  .note-input::placeholder{ color:#4d586b; }

  .gallery{ display:flex; flex-wrap:wrap; gap:6px; }
  .thumb{
    position:relative; width:58px; height:58px; border-radius:7px;
    overflow:hidden; border:1px solid var(--border); cursor:zoom-in;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb:hover{ border-color:var(--accent); }
  .thumb-del{
    position:absolute; top:2px; right:2px; width:16px; height:16px;
    border-radius:50%; background:rgba(0,0,0,.75); color:#fff; border:none;
    font-size:10px; cursor:pointer; display:grid; place-items:center; padding:0;
    line-height:1; opacity:0; transition:.15s;
  }
  .thumb:hover .thumb-del{ opacity:1; }
  .thumb-del:hover{ background:var(--danger); }
  .add-img{
    width:58px; height:58px; border-radius:7px; border:1px dashed var(--border);
    display:grid; place-items:center; color:var(--muted); cursor:pointer; font-size:18px;
    transition:.15s;
  }
  .add-img:hover{ border-color:var(--accent); color:var(--accent); }

  .img-count-badge, .subtree-badge{
    display:none;
    font-size:10px; padding:1px 5px; border-radius:9px;
    font-family:ui-monospace,monospace;
    margin-left:1px; flex:none;
    line-height:1.4;
    white-space:nowrap;
  }
  .img-count-badge{
    background:rgba(76,141,255,.22); color:#9dc2ff;
    border:1px solid rgba(76,141,255,.45);
  }
  .subtree-badge{
    background:rgba(255,183,77,.18); color:#ffce7a;
    border:1px solid rgba(255,183,77,.4);
  }
  .node.collapsed .img-count-badge.has-content,
  .node.body-collapsed .img-count-badge.has-content{ display:inline-block; }
  .node.collapsed .subtree-badge.has-content,
  .node.body-collapsed .subtree-badge.has-content{ display:inline-block; }

  .port{
    position:absolute; width:13px; height:13px; border-radius:50%;
    background:#39445a; border:2px solid #0b0f15; cursor:crosshair; z-index:5;
    transition:.15s;
  }
  .port:hover{ background:var(--accent); transform:scale(1.25); }
  .port.in{ left:-7px; top:18px; }
  .port.out{ right:-7px; top:18px; background:#4a6ea8; }
  .node.root .port.out{ background:#3a6fd8; }

  /* 选择操作条 */
  .selection-bar{
    position:fixed; z-index:60;
    background:#1c2330; border:1px solid var(--accent);
    border-radius:12px; padding:7px 12px;
    display:none; align-items:center; gap:6px;
    box-shadow:0 14px 40px rgba(0,0,0,.6), 0 0 0 3px rgba(76,141,255,.18);
    font-size:13px; flex-wrap:wrap;
  }
  .selection-bar.show{ display:flex; }
  .selection-bar .sel-count{ color:#9dc2ff; font-size:12.5px; padding-right:6px; }
  .selection-bar .sel-count b{ color:#fff; font-size:14px; }
  .selection-bar .divider{ width:1px; height:20px; background:var(--border); margin:0 2px; }
  .tbtn.xs{ padding:4px 10px; font-size:12px; border-radius:7px; }
  body.readonly-mode #selDelete,
  body.readonly-mode #selColor,
  body.readonly-mode #selCollapse,
  body.readonly-mode #selBodyCollapse,
  body.readonly-mode #selExpand,
  body.readonly-mode #selCopy,
  body.readonly-mode #selPaste{ display:none; }

  .zoom-controls{
    position:fixed; bottom:18px; right:18px; z-index:55;
    background:#1c2330; border:1px solid var(--border);
    border-radius:10px; padding:5px;
    display:flex; align-items:center; gap:3px;
    box-shadow:0 10px 28px rgba(0,0,0,.55);
  }
  .zoom-controls button{
    background:transparent; border:none; color:var(--text);
    width:28px; height:28px; border-radius:6px; cursor:pointer;
    font-size:14px; line-height:1; font-family:inherit; display:grid; place-items:center;
  }
  .zoom-controls button:hover{ background:#2a3341; color:var(--accent); }
  .zoom-controls .zv{
    font-family:ui-monospace,monospace; font-size:12px;
    min-width:48px; text-align:center; color:var(--muted);
    padding:0 4px; cursor:pointer; user-select:none;
  }
  .zoom-controls .zv:hover{ color:var(--accent); }

  .color-pop{
    position:fixed; z-index:320;
    background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:8px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
    box-shadow:0 14px 36px rgba(0,0,0,.65);
  }
  .swatch{
    width:22px; height:22px; border-radius:6px; padding:0;
    border:1px solid rgba(255,255,255,.18); cursor:pointer;
    display:grid; place-items:center; font-size:11px; color:#cfd8e6;
    background:#1c2330; transition:.12s; font-family:inherit;
  }
  .swatch:hover{ transform:scale(1.14); }
  .swatch.active{ box-shadow:0 0 0 2px #fff; }
  .swatch.custom{ position:relative; overflow:hidden; }
  .swatch.custom input{
    position:absolute; inset:0; opacity:0; cursor:pointer; border:none; padding:0;
  }

  .mini-menu{
    position:fixed; z-index:320;
    background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:5px; display:flex; flex-direction:column; gap:3px;
    box-shadow:0 14px 36px rgba(0,0,0,.65); min-width:236px;
  }
  .mini-menu button{
    background:transparent; border:none; color:var(--text);
    text-align:left; padding:8px 12px; border-radius:7px; cursor:pointer;
    font-size:13px; font-family:inherit; display:flex; flex-direction:column; gap:3px;
    transition:.12s;
  }
  .mini-menu button:hover{ background:#2a3341; }
  .mini-menu button.primary{ background:rgba(76,141,255,.12); }
  .mini-menu button b{ font-weight:600; display:flex; align-items:center; gap:6px; }
  .mini-menu button small{ color:var(--muted); font-size:11px; font-weight:400; }
  .mini-menu .tag{
    font-size:10px; padding:1px 6px; border-radius:4px;
    background:rgba(76,141,255,.25); color:#9dc2ff; font-weight:500;
  }
  .mini-menu .sep{ height:1px; background:var(--border); margin:3px 4px; }

  /* ★ 右键上下文菜单 */
  .ctx-menu{
    position:fixed; z-index:340;
    background:#1e2431; border:1px solid #35445c; border-radius:10px;
    padding:5px; min-width:210px;
    box-shadow:0 18px 48px rgba(0,0,0,.75), 0 0 0 1px rgba(76,141,255,.1);
    animation:ctxIn .1s ease;
  }
  @keyframes ctxIn{
    from{ opacity:0; transform: translateY(-4px) scale(.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .ctx-menu .ctx-header{
    padding:6px 12px 7px;
    border-bottom:1px solid #2a3341;
    margin-bottom:4px;
    font-size:11px;
    color:#8a97ab;
    display:flex; align-items:center; gap:6px;
  }
  .ctx-menu .ctx-header .ctx-id{
    font-family:ui-monospace,monospace;
    color:var(--gold);
    font-size:11px;
    margin-left:auto;
    max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ctx-menu button{
    display:flex; align-items:center; gap:10px;
    width:100%;
    background:transparent; border:none; color:var(--text);
    text-align:left; padding:7px 11px; border-radius:6px;
    cursor:pointer; font-size:13px; font-family:inherit;
    transition:.1s;
  }
  .ctx-menu button:hover{ background:rgba(76,141,255,.16); color:#fff; }
  .ctx-menu button.danger{ color:#ff9d9d; }

<div class="toolbar">

<script>
/* =========================================================================
 *  基础工具
 * ========================================================================= */
const NS = 'http://www.w3.org/2000/svg';
const canvas = document.getElementById('canvas');
const svg    = document.getElementById('edges');
const guidesSvg = document.getElementById('guides');
const stage  = document.getElementById('stage');
const zoomWrap = document.getElementById('zoomWrap');

let uidSeed = Date.now().toString(36);
let uidCounter = 0;
const uid = p => p + '_' + uidSeed + '_' + (++uidCounter);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function hexA(hex, a) {
  const h = String(hex || '').replace('#', '');
  const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(n.slice(0,2), 16) || 0;
  const g = parseInt(n.slice(2,4), 16) || 0;
  const b = parseInt(n.slice(4,6), 16) || 0;
  return `rgba(${r},${g},${b},${a})`;
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================================
 *  全局状态
 * ========================================================================= */
const state = { nodes: [], edges: [], freeMove: false };
let visibleSet = new Set();
const selectedIds = new Set();
let autoLayoutOnToggle = true;
let readOnlyMode = false;
let clipboard = null;
let pasteCounter = 0;

const getNode  = id => state.nodes.find(n => n.id === id);
const parentOf = id => {
  const e = state.edges.find(e => e.to === id);
  return e ? getNode(e.from) : null;
};

/* =========================================================================
 *  ★ 撤销 / 重做
 * ========================================================================= */
const undoStack = [];
const redoStack = [];
const UNDO_LIMIT = 50;
let undoPaused = false;
let pendingSnapshot = null;   // 事务开始时的快照

const btnUndo = document.getElementById('btnUndo');
const btnRedo = document.getElementById('btnRedo');

function updateUndoRedoBtns() {
  btnUndo.disabled = undoStack.length === 0 || readOnlyMode;
  btnRedo.disabled = redoStack.length === 0 || readOnlyMode;
}

function takeSnapshot() {
  return JSON.stringify({
    v: 13,
    freeMove: state.freeMove,
    autoLayoutOnToggle,
    zoom,
    nodes: state.nodes.map(n => ({
      id: n.id, kind: n.kind, title: n.title,
      x: n.x, y: n.y,
      baseId: n.baseId, rules: n.rules,
      note: n.note, images: n.images,
      collapsed: n.collapsed,
      bodyCollapsed: n.bodyCollapsed || false,
      color: n.color || null
    })),
    edges: state.edges
  });
}

function pushUndo() {
  if (undoPaused || readOnlyMode) return;
  undoStack.push(takeSnapshot());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  updateUndoRedoBtns();
}

// 事务：修改前 begin，修改后 commit。若中途 abort 则不记录
function beginTransaction() {
  if (undoPaused || readOnlyMode) return;
  pendingSnapshot = takeSnapshot();
}
function commitTransaction() {
  if (!pendingSnapshot) return;
  undoStack.push(pendingSnapshot);
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  pendingSnapshot = null;
  updateUndoRedoBtns();
}
function abortTransaction() {
  pendingSnapshot = null;
}

// 输入框编辑事务：focus 时 begin，blur 时 commit（仅当内容变化）
function attachUndoToInput(input) {
  let preEdit = null;
  input.addEventListener('focus', () => { preEdit = takeSnapshot(); });
  input.addEventListener('blur', () => {
    if (!preEdit) return;
    const now = takeSnapshot();
    if (now !== preEdit) {
      undoStack.push(preEdit);
      if (undoStack.length > UNDO_LIMIT) undoStack.shift();
      redoStack.length = 0;
      updateUndoRedoBtns();
    }
    preEdit = null;
  });
}

function applySnapshot(str) {
  undoPaused = true;
  try {
    const data = JSON.parse(str);
    state.nodes = (data.nodes || []).map(n => ({
      ...n,
      note: n.note || '',
      images: n.images || [],
      collapsed: !!n.collapsed,
      bodyCollapsed: !!n.bodyCollapsed,
      color: n.color || null,
      rules: n.rules || []
    }));
    state.edges = data.edges || [];
    state.freeMove = !!data.freeMove;
    if (typeof data.autoLayoutOnToggle === 'boolean') {
      autoLayoutOnToggle = data.autoLayoutOnToggle;
      updateAutoToggleBtn();
    }
    selectedIds.clear();
    render();
    if (data.zoom && data.zoom !== 1) applyZoom(data.zoom);
  } finally {
    undoPaused = false;
  }
}

function doUndo() {
  if (readOnlyMode) return toast('只读模式无法撤销');
  if (!undoStack.length) return toast('没有可撤销的操作');
  const cur = takeSnapshot();
  const prev = undoStack.pop();
  redoStack.push(cur);
  applySnapshot(prev);
  updateUndoRedoBtns();
  toast('已撤销');
}
function doRedo() {
  if (readOnlyMode) return toast('只读模式无法重做');
  if (!redoStack.length) return toast('没有可重做的操作');
  const cur = takeSnapshot();
  const next = redoStack.pop();
  undoStack.push(cur);
  applySnapshot(next);
  updateUndoRedoBtns();
  toast('已重做');
}
btnUndo.onclick = doUndo;
btnRedo.onclick = doRedo;

/* =========================================================================
 *  只读模式
 * ========================================================================= */
function applyReadOnlyUI() {
  const badge = document.getElementById('readonlyBadge');
  if (readOnlyMode) {
    document.body.classList.add('readonly-mode');
    badge.classList.add('show');
    ['btnRoot','btnLayout','btnLayoutMenu','btnAutoToggle','btnMoveMode','btnLevelColor',
     'btnImport','btnSaveFile','btnSaveNow','btnOpenFile','btnClear'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.disabled = true;
    });
    document.getElementById('selectionBar').classList.remove('show');
  } else {
    document.body.classList.remove('readonly-mode');
    badge.classList.remove('show');
    ['btnRoot','btnLayout','btnLayoutMenu','btnAutoToggle','btnMoveMode','btnLevelColor',
     'btnImport','btnSaveFile','btnSaveNow','btnOpenFile','btnClear'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.disabled = false;
    });
  }
  updateUndoRedoBtns();
  render();
}
document.getElementById('btnExitReadonly').onclick = () => {
  if (!confirm('退出只读模式后可以编辑数据，确认退出？')) return;
  readOnlyMode = false;
  applyReadOnlyUI();
  toast('已退出只读模式');
};
function guardReadOnly() {
  if (readOnlyMode) { toast('只读模式，无法修改数据'); return true; }
  return false;
}

/* =========================================================================
 *  层级配色
 * ========================================================================= */
const LEVEL_COLORS = [
  '#4c8dff', '#3fb96b', '#e0a63a', '#e05252', '#b25ad6',
  '#2fa8a0', '#e2703a', '#8bc34a', '#4a7ac8', '#7a869a'
];
function levelColorOf(depth) {
  return LEVEL_COLORS[((depth % LEVEL_COLORS.length) + LEVEL_COLORS.length) % LEVEL_COLORS.length];
}
function applyLevelColorsToAll(silent) {
  if (guardReadOnly()) return;
  pushUndo();
  const depthMap = computeNodeDepth();
  state.nodes.forEach(n => { n.color = levelColorOf(depthMap.get(n.id) ?? 0); });
  render(); markDirty();
  if (!silent) toast('已按层级自动配色 · 同级同色');
}
document.getElementById('btnLevelColor').onclick = () => applyLevelColorsToAll(false);

/* =========================================================================
 *  自动排版开关
 * ========================================================================= */
const btnAutoToggle = document.getElementById('btnAutoToggle');
function updateAutoToggleBtn() {
  if (autoLayoutOnToggle) {
    btnAutoToggle.textContent = '📐 自动排版 · 开';
    btnAutoToggle.classList.add('success');
    btnAutoToggle.title = '折叠或展开节点后自动重新排版（点击关闭）';
  } else {
    btnAutoToggle.textContent = '📐 自动排版 · 关';
    btnAutoToggle.classList.remove('success');
    btnAutoToggle.title = '折叠或展开后保持节点位置（点击开启）';
  }
}
btnAutoToggle.onclick = () => {
  if (guardReadOnly()) return;
  autoLayoutOnToggle = !autoLayoutOnToggle;
  updateAutoToggleBtn();
  toast(autoLayoutOnToggle ? '折叠/展开后将自动重新排版' : '已关闭自动排版');
  markDirty();
};

/* =========================================================================
 *  缩放
 * ========================================================================= */
let zoom = 1;
const ZOOM_MIN = 0.25, ZOOM_MAX = 3;

function updateZoomWrap() {
  const w = parseFloat(canvas.dataset.w) || 4600;
  const h = parseFloat(canvas.dataset.h) || 3400;
  zoomWrap.style.width  = (w * zoom) + 'px';
  zoomWrap.style.height = (h * zoom) + 'px';
}
function updateZoomDisplay() {
  const z = document.getElementById('zoomValue');
  if (z) z.textContent = Math.round(zoom * 100) + '%';
}
function applyZoom(newZoom, anchorClientX, anchorClientY) {
  newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
  if (Math.abs(newZoom - zoom) < 0.001) return;
  const stageRect = stage.getBoundingClientRect();
  let anchorX, anchorY;
  if (anchorClientX != null && anchorClientY != null) {
    anchorX = (anchorClientX - stageRect.left) + stage.scrollLeft;
    anchorY = (anchorClientY - stageRect.top) + stage.scrollTop;
  } else {
    anchorX = stage.scrollLeft + stage.clientWidth / 2;
    anchorY = stage.scrollTop + stage.clientHeight / 2;
  }
  const ratio = newZoom / zoom;
  const newAnchorX = anchorX * ratio;
  const newAnchorY = anchorY * ratio;
  zoom = newZoom;
  canvas.style.transform = `scale(${zoom})`;
  updateZoomWrap();
  if (anchorClientX != null && anchorClientY != null) {
    stage.scrollLeft = newAnchorX - (anchorClientX - stageRect.left);
    stage.scrollTop  = newAnchorY - (anchorClientY - stageRect.top);
  } else {
    stage.scrollLeft = newAnchorX - stage.clientWidth / 2;
    stage.scrollTop  = newAnchorY - stage.clientHeight / 2;
  }
  updateZoomDisplay();
  // 虚拟化重新评估
  scheduleViewportSync();
}
function setCanvasSize(w, h) {
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.dataset.w = w;
  canvas.dataset.h = h;
  updateZoomWrap();
}
stage.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  applyZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
}, { passive: false });

document.getElementById('zoomIn').onclick  = () => applyZoom(zoom * 1.2);
document.getElementById('zoomOut').onclick = () => applyZoom(zoom / 1.2);
document.getElementById('zoomValue').onclick = () => applyZoom(1);
document.getElementById('zoomFit').onclick = () => {
  if (!state.nodes.length) return;
  const minX = Math.min(...state.nodes.map(n => n.x));
  const minY = Math.min(...state.nodes.map(n => n.y));
  const maxX = Math.max(...state.nodes.map(n => n.x + (n._w || NODE_W)));
  const maxY = Math.max(...state.nodes.map(n => n.y + (n._h || DEF_H)));
  const pad = 80;
  const fitW = (maxX - minX) + pad * 2;
  const fitH = (maxY - minY) + pad * 2;
  const nz = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.min(stage.clientWidth / fitW, stage.clientHeight / fitH)));
  applyZoom(nz);
  setTimeout(() => {
    stage.scrollLeft = (minX - pad) * zoom;
    stage.scrollTop  = (minY - pad) * zoom;
    scheduleViewportSync();
  }, 30);
};

/* =========================================================================
 *  ID 计算
 * ========================================================================= */
function parseOptions(text) {
  return String(text || '')
    .split(/[,\n;，]/).map(s => s.trim()).filter(Boolean)
    .map(s => {
      const m = s.split(/[:：=]/);
      if (m.length >= 2) return { code: m[0].trim(), label: m.slice(1).join(':').trim() };
      return { code: s, label: s };
    });
}
function formatDate(fmt) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return String(fmt)
    .replace(/YYYY/g, d.getFullYear())
    .replace(/YY/g, String(d.getFullYear()).slice(2))
    .replace(/MM/g, p(d.getMonth() + 1))
    .replace(/DD/g, p(d.getDate()));
}
function autoSeq(node, rule) {
  const start = Number(rule.value) || 1;
  const p = parentOf(node.id);
  if (!p) return start;
  const pool = state.nodes.filter(n => n.kind === 'rule' && parentOf(n.id)?.id === p.id);
  const idx = pool.findIndex(n => n.id === node.id);
  return start + (idx < 0 ? 0 : idx);
}
function ruleSegment(node, rule) {
  switch (rule.type) {
    case 'fixed':  return rule.text || '';
    case 'choice': {
      const opts = parseOptions(rule.options);
      if (!opts.length) return '';
      const sel = opts.find(o => o.code === rule.selected) || opts[0];
      return sel ? sel.code : '';
    }
    case 'seq': {
      const v = rule.auto ? autoSeq(node, rule) : (Number(rule.value) || 0);
      const w = Math.max(1, Math.min(8, Number(rule.digits) || 1));
      return String(v).padStart(w, '0');
    }
    case 'date': return formatDate(rule.format || 'YYYYMMDD');
  }
  return '';
}
function segmentOf(node) {
  if (node.kind === 'root') return null;
  return node.rules.map(r => ruleSegment(node, r)).join('');
}
function computeId(node, depth = 0) {
  if (depth > 80) return null;
  if (node.kind === 'root') return node.baseId || '';
  const p = parentOf(node.id);
  if (!p) return null;
  const base = computeId(p, depth + 1);
  if (base === null) return null;
  return base + segmentOf(node);
}
function checkDuplicates() {
  const groups = new Map();
  for (const n of state.nodes) {
    if (n.kind === 'root') continue;
    const p = parentOf(n.id);
    if (!p) continue;
    if (!groups.has(p.id)) groups.set(p.id, []);
    groups.get(p.id).push({ node: n, seg: segmentOf(n) });
  }
  const conflict = new Set();
  for (const arr of groups.values()) {
    const seen = new Map();
    for (const { node, seg } of arr) {
      if (seen.has(seg)) { conflict.add(node.id); conflict.add(seen.get(seg).id); }
      else seen.set(seg, node);
    }
  }
  return conflict;
}
function computeNodeDepth() {
  const d = new Map();
  const visited = new Set();
  const walk = (n, lv) => {
    if (!n || visited.has(n.id)) return;
    visited.add(n.id);
    d.set(n.id, lv);
    for (const e of state.edges) if (e.from === n.id) walk(getNode(e.to), lv + 1);
  };
  state.nodes.forEach(n => { if (n.kind === 'root' || !parentOf(n.id)) walk(n, 0); });
  state.nodes.forEach(n => { if (!d.has(n.id)) d.set(n.id, 0); });
  return d;
}
function computeVisible() {
  const visible = new Set();
  const guard = new Set();
  const visit = n => {
    if (!n || guard.has(n.id)) return;
    guard.add(n.id);
    visible.add(n.id);
    if (n.collapsed) return;
    for (const e of state.edges) if (e.from === n.id) visit(getNode(e.to));
  };
  for (const n of state.nodes) if (n.kind === 'root') visit(n);
  for (const n of state.nodes) {
    if (n.kind !== 'root' && !parentOf(n.id)) visible.add(n.id);
  }
  return visible;
}

/* =========================================================================
 *  碰撞检测
 * ========================================================================= */
const NODE_W = 274;
const DEF_H  = 220;
const MIN_GAP = 6;

function rectOf(n, x, y) { return { x, y, w: n._w || NODE_W, h: n._h || DEF_H }; }
function overlap(a, b, gap = MIN_GAP) {
  return !(a.x + a.w + gap <= b.x || b.x + b.w + gap <= a.x ||
           a.y + a.h + gap <= b.y || b.y + b.h + gap <= a.y);
}
function collides(node, x, y) {
  const a = rectOf(node, x, y);
  for (const o of state.nodes) {
    if (o.id === node.id) continue;
    if (!visibleSet.has(o.id)) continue;
    if (overlap(a, rectOf(o))) return true;
  }
  return false;
}
function collidesExcluding(node, x, y, excludeIds) {
  const a = rectOf(node, x, y);
  for (const o of state.nodes) {
    if (o.id === node.id) continue;
    if (excludeIds.has(o.id)) continue;
    if (!visibleSet.has(o.id)) continue;
    if (overlap(a, rectOf(o))) return true;
  }
  return false;
}
function findFreeSpot(node, sx, sy) {
  const w = node._w || NODE_W, h = node._h || DEF_H;
  const stepX = w + 30, stepY = h + 30;
  for (let ring = 0; ring < 26; ring++) {
    for (let dy = -ring; dy <= ring; dy++) {
      for (let dx = -ring; dx <= ring; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
        const x = Math.max(0, sx + dx * stepX);
        const y = Math.max(0, sy + dy * stepY);
        if (!collides(node, x, y)) return { x, y };
      }
    }
  }
  return { x: sx, y: sy };
}
function measureNodeHeights() {
  for (const n of state.nodes) {
    const e = canvas.querySelector(`.node[data-id="${n.id}"]`);
    if (e) { n._w = e.offsetWidth; n._h = e.offsetHeight; }
    else {
      // 虚拟化未渲染的节点：用缓存或默认
      if (!n._w) n._w = NODE_W;
      if (!n._h) n._h = (n.collapsed || n.bodyCollapsed) ? 42 : DEF_H;
    }
  }
}

/* =========================================================================
 *  画线
 * ========================================================================= */
function portPos(nodeId, side) {
  const nodeEl = canvas.querySelector(`.node[data-id="${nodeId}"]`);
  if (!nodeEl) return null;
  return {
    x: side === 'out' ? nodeEl.offsetLeft + nodeEl.offsetWidth : nodeEl.offsetLeft,
    y: nodeEl.offsetTop + 24
  };
}
function curve(a, b) {
  const dx = Math.max(50, Math.abs(b.x - a.x) * 0.45);
  return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
}
function toCanvas(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) / zoom, y: (cy - r.top) / zoom };
}
function drawEdges() {
  svg.innerHTML = '';
  for (const e of state.edges) {
    const a = portPos(e.from, 'out');
    const b = portPos(e.to, 'in');
    if (!a || !b) continue;
    const d = curve(a, b);

    const hit = document.createElementNS(NS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'edge-hit');
    hit.addEventListener('click', ev => {
      ev.stopPropagation();
      if (guardReadOnly()) return;
      pushUndo();
      state.edges = state.edges.filter(x => x.id !== e.id);
      drawEdges(); refreshIds(); markDirty();
      toast('已断开连接');
    });

    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge');

    svg.append(hit, path);
  }
}

/* =========================================================================
 *  ★ 对齐辅助线

const SNAP_THRESHOLD_PX = 8;
let activeGuides = { v: [], h: [] };

function clearGuides() {
  guidesSvg.innerHTML = '';
  activeGuides = { v: [], h: [] };
}

function drawGuides() {

/**
 * 计算拖动时的吸附与辅助线
 * @returns {snapX, snapY, guides:{v:[],h:[]}}
 */
function computeSnapAndGuides(node, nx, ny, excludeIds) {
  const w = node._w || NODE_W;
  const h = node._h || DEF_H;
  const threshold = SNAP_THRESHOLD_PX / zoom;

  // 节点自身的关键 X/Y（绝对坐标 + 到左边/上边的偏移）
  const myX = [
    { pos: nx,         off: 0 },
    { pos: nx + w / 2, off: w / 2 },
    { pos: nx + w,     off: w }
  ];
  const myY = [
    { pos: ny,         off: 0 },
    { pos: ny + h / 2, off: h / 2 },
    { pos: ny + h,     off: h }
  ];

  let bestX = null, bestY = null;

  for (const o of state.nodes) {
    if (o.id === node.id) continue;
    if (excludeIds.has(o.id)) continue;
    if (!visibleSet.has(o.id)) continue;

    const ow = o._w || NODE_W;
    const oh = o._h || DEF_H;
    const oX = [o.x, o.x + ow / 2, o.x + ow];
    const oY = [o.y, o.y + oh / 2, o.y + oh];

    // 竖直方向
    for (const mine of myX) {
      for (const ox of oX) {
        const delta = ox - mine.pos;
        if (Math.abs(delta) < threshold) {
          if (!bestX || Math.abs(delta) < Math.abs(bestX.delta)) {
            bestX = { delta, guideX: ox };
          }
        }
      }
    }
    // 水平方向
    for (const mine of myY) {
      for (const oy of oY) {
        const delta = oy - mine.pos;
        if (Math.abs(delta) < threshold) {
          if (!bestY || Math.abs(delta) < Math.abs(bestY.delta)) {
            bestY = { delta, guideY: oy };
          }
        }
      }
    }
  }

  return {
    snapX: bestX ? bestX.delta : 0,
    snapY: bestY ? bestY.delta : 0,
    guideX: bestX ? bestX.guideX : null,
    guideY: bestY ? bestY.guideY : null
  };
}

/* =========================================================================
 *  刷新 ID / 冲突
 * ========================================================================= */
function refreshIds() {
  const conflicts = checkDuplicates();
  for (const n of state.nodes) {
    const nodeEl = canvas.querySelector(`.node[data-id="${n.id}"]`);
    if (!nodeEl) continue;
    const idEl = nodeEl.querySelector('.node-id');
    const v = computeId(n);
    if (v === null) {
      idEl.textContent = '未连接';
      idEl.classList.add('unlinked');
    } else {
      idEl.textContent = v || '—';
      idEl.classList.remove('unlinked');
    }
    const bad = conflicts.has(n.id);
    nodeEl.classList.toggle('conflict', bad);
    const wb = nodeEl.querySelector('.warn-bar');
    if (wb) wb.style.display = bad ? 'flex' : 'none';
  }
}

/* =========================================================================
 *  规则编辑器
 * ========================================================================= */
function buildRuleEl(node, rule) {
  const wrap = el('div', 'rule');
  const top = el('div', 'rule-top');
  const sel = el('select', 'rule-type');
  [['fixed','固定文本'],['choice','选项'],['seq','序号'],['date','日期']]
    .forEach(([v, l]) => { const o = el('option', null, l); o.value = v; sel.appendChild(o); });
  sel.value = rule.type;

  const del = el('button', 'icon-btn del', '✕');
  del.title = '删除该字段';
  del.onclick = () => {
    if (guardReadOnly()) return;
    pushUndo();
    const i = node.rules.indexOf(rule);
    if (i > -1) node.rules.splice(i, 1);
    render(); markDirty();
  };
  top.append(sel, del);
  wrap.appendChild(top);

  const body = el('div', 'rule-body');
  wrap.appendChild(body);

  function fill() {
    body.innerHTML = '';
    if (rule.type === 'fixed') {
      const inp = el('input', 'r-input');
      inp.type = 'text'; inp.value = rule.text ?? ''; inp.placeholder = '如  -A   或   /R';
      inp.oninput = () => { rule.text = inp.value; refreshIds(); markDirty(); };
      attachUndoToInput(inp);
      body.appendChild(inp);
    } else if (rule.type === 'choice') {
      const inp = el('input', 'r-input');
      inp.type = 'text'; inp.value = rule.options ?? ''; inp.placeholder = '01:红色, 02:蓝色';
      const selEl = el('select', 'r-input');
      const rebuild = () => {
        const opts = parseOptions(rule.options);
        selEl.innerHTML = '';
        if (!opts.length) {
          const o = el('option', null, '（暂无选项）'); o.value = '';
          selEl.appendChild(o); rule.selected = ''; return;
        }
        for (const o of opts) {
          const op = el('option', null, o.code === o.label ? o.code : `${o.code} · ${o.label}`);
          op.value = o.code; selEl.appendChild(op);
        }
        if (!opts.some(o => o.code === rule.selected)) rule.selected = opts[0].code;
        selEl.value = rule.selected;
      };
      inp.oninput = () => { rule.options = inp.value; rebuild(); refreshIds(); markDirty(); };
      selEl.onchange = () => { pushUndo(); rule.selected = selEl.value; refreshIds(); markDirty(); };
      attachUndoToInput(inp);
      rebuild();
      body.append(inp, selEl);
    } else if (rule.type === 'seq') {
      const row = el('div', 'row');
      const l1 = el('label', 'mini', '起始');
      const v = el('input'); v.type = 'number'; v.value = rule.value ?? 1;
      v.oninput = () => { rule.value = Number(v.value) || 0; refreshIds(); markDirty(); };
      attachUndoToInput(v);
      l1.appendChild(v);
      const l2 = el('label', 'mini', '位数');
      const d = el('input'); d.type = 'number'; d.min = 1; d.max = 8; d.value = rule.digits ?? 2;
      d.oninput = () => { rule.digits = Math.max(1, Math.min(8, Number(d.value) || 1)); refreshIds(); markDirty(); };
      attachUndoToInput(d);
      l2.appendChild(d);
      const l3 = el('label', 'mini chk');
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!rule.auto;
      cb.onchange = () => { pushUndo(); rule.auto = cb.checked; refreshIds(); markDirty(); };
      l3.append(cb, '自动编号');
      row.append(l1, l2, l3);
      body.appendChild(row);
    } else if (rule.type === 'date') {
      const inp = el('input', 'r-input');
      inp.type = 'text'; inp.value = rule.format ?? 'YYYYMMDD'; inp.placeholder = 'YYYYMMDD';
      inp.oninput = () => { rule.format = inp.value; refreshIds(); markDirty(); };
      attachUndoToInput(inp);
      body.appendChild(inp);
    }
  }
  sel.onchange = () => {
    if (guardReadOnly()) return;
    pushUndo();
    rule.type = sel.value;
    if (rule.type === 'fixed'  && rule.text === undefined)   rule.text = '-A';
    if (rule.type === 'choice' && !rule.options) { rule.options = '01:A型,02:B型'; rule.selected = '01'; }
    if (rule.type === 'seq')   { if (rule.value === undefined) rule.value = 1; if (rule.digits === undefined) rule.digits = 2; }
    if (rule.type === 'date'   && !rule.format) rule.format = 'YYYYMMDD';
    fill(); refreshIds(); markDirty();
  };
  fill();
  return wrap;
}

    const addRule = el('button', 'add-rule', '＋ 扩展字段');
    addRule.onclick = ev => {
      ev.stopPropagation();
      if (guardReadOnly()) return;
      pushUndo();
      node.rules.push({ type: 'fixed', text: '-' });
      render(); markDirty();
    };
    body.appendChild(addRule);
  }

  const note = el('textarea', 'note-input');
  note.placeholder = '备注（工艺 / 客户 / 说明…）';
  note.value = node.note || '';
  note.oninput = () => { if (readOnlyMode) { note.value = node.note || ''; return; } node.note = note.value; markDirty(); };
  attachUndoToInput(note);
  note.onpointerdown = ev => ev.stopPropagation();
  body.appendChild(note);

  const gallery = el('div', 'gallery');
  function rebuildGallery() {
    gallery.innerHTML = '';
    node.images.forEach((src, i) => {
      const t = el('div', 'thumb');
      const img = el('img'); img.src = src;
      const d = el('button', 'thumb-del', '✕'); d.title = '删除截图';
      d.onclick = ev => {
        ev.stopPropagation();
        if (guardReadOnly()) return;
        pushUndo();
        node.images.splice(i, 1); rebuildGallery(); markDirty();
      };
      t.onclick = ev => { ev.stopPropagation(); openImageViewer([...node.images], i, node.title); };
      t.append(img, d);
      gallery.appendChild(t);
    });
    const add = el('label', 'add-img', '＋');
    add.title = '添加截图（也可选中节点后 Ctrl+V 粘贴）';
    const fi = el('input');
    fi.type = 'file'; fi.accept = 'image/*'; fi.multiple = true; fi.style.display = 'none';
    fi.onchange = async () => {
      if (guardReadOnly()) return;
      pushUndo();
      for (const f of fi.files) { try { node.images.push(await compressImage(f)); } catch (e) {} }
      fi.value = ''; rebuildGallery(); markDirty(); toast('已添加截图');
    };
    add.appendChild(fi);
    gallery.appendChild(add);
  }
  rebuildGallery();
  body.appendChild(gallery);

  wrap.appendChild(body);

  const outPort = el('div', 'port out');
  outPort.title = '拖拽连线到子节点';
  wrap.appendChild(outPort);

  return wrap;
}

/* =========================================================================
 *  ★ 虚拟化：视口检测 + 增量同步
 * ========================================================================= */
const renderedIds = new Set();
const VIRTUAL_THRESHOLD = 80;   // 节点总数超过此值才启用虚拟化

function isInViewport(n, buffer = 300) {
  if (visibleSet.size <= VIRTUAL_THRESHOLD) return true;
  const vw = stage.clientWidth;
  const vh = stage.clientHeight;
  const vx1 = stage.scrollLeft / zoom - buffer;
  const vy1 = stage.scrollTop / zoom - buffer;
  const vx2 = vx1 + vw / zoom + buffer * 2;
  const vy2 = vy1 + vh / zoom + buffer * 2;
  const w = n._w || NODE_W;
  const h = n._h || DEF_H;
  return (n.x + w) >= vx1 && n.x <= vx2 && (n.y + h) >= vy1 && n.y <= vy2;
}

let viewportSyncRaf = null;
function scheduleViewportSync() {
  if (viewportSyncRaf) return;
  viewportSyncRaf = requestAnimationFrame(() => {
    viewportSyncRaf = null;
    syncViewport();
  });
}

function syncViewport() {
  if (readOnlyMode !== undefined && visibleSet.size <= VIRTUAL_THRESHOLD) return;

  const wanted = new Set();
  for (const n of state.nodes) {
    if (!visibleSet.has(n.id)) continue;
    if (!isInViewport(n)) continue;
    wanted.add(n.id);
  }

  // 移除不再需要的
  for (const id of [...renderedIds]) {
    if (!wanted.has(id)) {
      const el = canvas.querySelector(`.node[data-id="${id}"]`);
      if (el) el.remove();
      renderedIds.delete(id);
    }
  }
  // 添加新进入视口的
  for (const id of wanted) {
    if (renderedIds.has(id)) continue;
    const n = getNode(id);
    if (!n) continue;
    canvas.appendChild(buildNodeEl(n));
    renderedIds.add(id);
  }
  measureNodeHeights();
  refreshIds();
  scheduleDraw();
}

/* =========================================================================
 *  整体渲染
 * ========================================================================= */
function render() {
  visibleSet = computeVisible();
  // 清空所有节点
  canvas.querySelectorAll('.node').forEach(n => n.remove());
  renderedIds.clear();
  // 视口裁剪
  const useVirtual = visibleSet.size > VIRTUAL_THRESHOLD;
  for (const n of state.nodes) {
    if (!visibleSet.has(n.id)) continue;
    if (useVirtual && !isInViewport(n)) continue;
    canvas.appendChild(buildNodeEl(n));
    renderedIds.add(n.id);
  }
  measureNodeHeights();
  drawEdges();
  refreshIds();
  applySearchHighlight();
  updateSearchCount();
  applySelectionVisual();
  if (dashboardOpen) renderDashboardTable();
}

/* 滚动时同步视口 */
stage.addEventListener('scroll', () => {
  if (visibleSet.size > VIRTUAL_THRESHOLD) scheduleViewportSync();
}, { passive: true });

/* =========================================================================
 *  复制 / 粘贴
 * ========================================================================= */
function copySelectedNodes() {
  const selected = state.nodes.filter(n => selectedIds.has(n.id));
  if (!selected.length) return false;
  const selIds = new Set(selected.map(n => n.id));
  const innerEdges = state.edges.filter(e => selIds.has(e.from) && selIds.has(e.to));
  const minX = Math.min(...selected.map(n => n.x));
  const minY = Math.min(...selected.map(n => n.y));
  clipboard = {
    nodes: selected.map(n => ({
      origId: n.id,
      kind: n.kind, title: n.title,
      baseId: n.baseId,
      rules: n.rules ? JSON.parse(JSON.stringify(n.rules)) : undefined,
      note: n.note || '',
      images: n.images ? [...n.images] : [],
      collapsed: !!n.collapsed,
      bodyCollapsed: !!n.bodyCollapsed,
      color: n.color || null,
      relX: n.x - minX, relY: n.y - minY
    })),
    edges: innerEdges.map(e => ({ from: e.from, to: e.to }))
  };
  pasteCounter = 0;
  return true;
}
function pasteNodes() {
  if (!clipboard || !clipboard.nodes.length) return false;
  pushUndo();
  pasteCounter++;
  const selected = state.nodes.filter(n => selectedIds.has(n.id));
  let baseX, baseY;
  if (selected.length) {
    baseX = Math.min(...selected.map(n => n.x)) + 60;
    baseY = Math.min(...selected.map(n => n.y)) + 60;
  } else {
    baseX = 200; baseY = 200;
  }
  const step = 30;
  baseX += (pasteCounter - 1) * step;
  baseY += (pasteCounter - 1) * step;

  const idMap = new Map();
  const newNodes = clipboard.nodes.map(item => {
    const newId = uid('n');
    idMap.set(item.origId, newId);
    return {
      id: newId,
      kind: item.kind,
      title: item.title ? item.title + ' 副本' : '副本',
      x: baseX + item.relX,
      y: baseY + item.relY,
      baseId: item.baseId,
      rules: item.rules ? JSON.parse(JSON.stringify(item.rules)) : undefined,
      note: item.note || '',
      images: item.images ? [...item.images] : [],
      collapsed: !!item.collapsed,
      bodyCollapsed: !!item.bodyCollapsed,
      color: item.color || null
    };
  });
  const newEdges = clipboard.edges.map(e => ({
    id: uid('e'),
    from: idMap.get(e.from),
    to: idMap.get(e.to)
  })).filter(e => e.from && e.to);

  state.nodes.push(...newNodes);
  state.edges.push(...newEdges);
  selectedIds.clear();
  newNodes.forEach(n => selectedIds.add(n.id));
  render(); markDirty(); updateSelectionBar();
  return true;
}

function startBoxSelect(e) {
  e.preventDefault();
  const start = toCanvas(e.clientX, e.clientY);
  const box = document.createElement('div');
  box.className = 'selection-box';
  box.style.left = start.x + 'px'; box.style.top = start.y + 'px';
  box.style.width = '0px'; box.style.height = '0px';
  canvas.appendChild(box);

  if (!e.shiftKey && selectedIds.size > 0) {
    selectedIds.clear(); applySelectionVisual(); updateSelectionBar();
  }
  const baseSelected = new Set(selectedIds);

  const move = ev => {
    const cur = toCanvas(ev.clientX, ev.clientY);
    const x = Math.min(start.x, cur.x), y = Math.min(start.y, cur.y);
    const w = Math.abs(cur.x - start.x), h = Math.abs(cur.y - start.y);
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    selectedIds.clear();
    baseSelected.forEach(id => selectedIds.add(id));
    for (const n of state.nodes) {
      if (!visibleSet.has(n.id)) continue;
      const rx = n.x, ry = n.y;
      const rw = n._w || NODE_W, rh = n._h || DEF_H;
      if (rx + rw >= x && rx <= x + w && ry + rh >= y && ry <= y + h) selectedIds.add(n.id);
    }
    applySelectionVisual(); updateSelectionBar();
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    box.remove();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

/* =========================================================================
 *  ★ 中键平移画布
 * ========================================================================= */
let panning = false;

function startPan(e) {
  e.preventDefault();
  if (panning) return;
  hidePathTooltip();
  closeCtxMenu();

  panning = true;
  document.body.classList.add('canvas-panning');

  const pid = e.pointerId;
  const startX = e.clientX, startY = e.clientY;
  const startScrollLeft = stage.scrollLeft, startScrollTop = stage.scrollTop;
  // 指针捕获：即使拖到窗口外也能持续收到 move/up
  try { stage.setPointerCapture(pid); } catch (err) {}
  let moved = false;

  const finish = () => {
    panning = false;
    document.body.classList.remove('canvas-panning');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', finish);
    document.removeEventListener('pointercancel', finish);
    window.removeEventListener('blur', finish);
    try { stage.releasePointerCapture(pid); } catch (err) {}
  };

  const move = ev => {
    if (ev.pointerId !== pid) return;
    if (!(ev.buttons & 4)) { finish(); return; }   // 中键已在窗口外松开
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if (!moved && Math.abs(dx) < 2 && Math.abs(dy) < 2) return;  // 过滤轻微抖动
    moved = true;
    stage.scrollLeft = startScrollLeft - dx;
    stage.scrollTop  = startScrollTop - dy;
  };

  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', finish);
  document.addEventListener('pointercancel', finish);
  window.addEventListener('blur', finish);
}

const pathTooltipEl = document.getElementById('pathTooltip');
function getPathChain(node) {
  const chain = [];
  let cur = node;
  const guard = new Set();
  while (cur && !guard.has(cur.id)) { guard.add(cur.id); chain.unshift(cur); cur = parentOf(cur.id); }
  return chain;
}
function showPathTooltip(node, e) {
  const chain = getPathChain(node);
  const finalId = computeId(node);
  const conflicts = checkDuplicates();
  const isBad = conflicts.has(node.id);
  let html = '<div class="pt-title">完整路径</div><div class="pt-chain">';
  chain.forEach((n, i) => {
    const isCurrent = i === chain.length - 1;
    const nid = computeId(n);
    html += `<div class="pt-item${isCurrent ? ' current' : ''}">`;
    if (i > 0) html += `<span class="pt-arrow">↳</span>`;
    html += `<span>${escapeHtml(n.title || '未命名')}</span>`;
    if (nid != null && nid !== '') html += `<span class="pt-num">${escapeHtml(nid)}</span>`;
    html += `</div>`;
  });
  html += '</div>';
  if (finalId != null) {
    const idCls = isBad ? 'style="color:#ff8b8b"' : '';
    html += `<div class="pt-id" ${idCls}><span class="lbl">订货号</span>${escapeHtml(finalId || '（空）')}${isBad ? '  ⚠ 同级重复' : ''}</div>`;
  } else {
    html += `<div class="pt-id"><span class="lbl">订货号</span>未连接</div>`;
  }
  pathTooltipEl.innerHTML = html;
  pathTooltipEl.classList.add('show');
  movePathTooltip(e);
}
function movePathTooltip(e) {
  if (!pathTooltipEl.classList.contains('show')) return;
  const tt = pathTooltipEl;
  const w = tt.offsetWidth, h = tt.offsetHeight;
  let x = e.clientX + 18, y = e.clientY + 16;
  if (x + w > window.innerWidth - 10) x = e.clientX - w - 14;
  if (y + h > window.innerHeight - 10) y = e.clientY - h - 14;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}

/* =========================================================================

const altPreviewEl = document.getElementById('altImagePreview');

let altKeyDown = false;
let altPreviewNodeId = null;
let altHoveredNodeEl = null;
let mouseClientX = 0, mouseClientY = 0;

function hideAltPreview() {
  if (!altPreviewEl) return;
  if (altPreviewEl.style.display !== 'none') altPreviewEl.style.display = 'none';
  if (altHoveredNodeEl) { altHoveredNodeEl.classList.remove('alt-hover'); altHoveredNodeEl = null; }

}
function buildAltPreviewContent(node) {
  const id = computeId(node);
  const idText = id == null ? '未连接' : (id || '（空）');
  altPreviewHead.innerHTML = `
    <span class="ap-title">${escapeHtml(node.title || '未命名')}</span>
    <span class="ap-id">${escapeHtml(idText)}</span>
    <span class="ap-hint">${node.images.length} 张 · Alt 松开隐藏</span>
  `;
  altPreviewGrid.innerHTML = node.images.map((src, i) =>
    `<img src="${src}" data-idx="${i}" alt="插图 ${i + 1}" title="点击放大">`
  ).join('');
  altPreviewGrid.querySelectorAll('img[data-idx]').forEach(img => {
    img.onclick = ev => {
      ev.stopPropagation();
      const idx = Number(img.dataset.idx);
      hideAltPreview();
      openImageViewer([...node.images], idx, node.title);
    };

}
function positionAltPreview(clientX, clientY) {
  requestAnimationFrame(() => {
    if (altPreviewEl.style.display === 'none') return;
    const w = altPreviewEl.offsetWidth, h = altPreviewEl.offsetHeight;
    let left = clientX + 20, top = clientY + 18;
    if (left + w > window.innerWidth - 12) left = clientX - w - 18;
    if (top + h > window.innerHeight - 12) top = clientY - h - 18;
    altPreviewEl.style.left = Math.max(10, left) + 'px';
    altPreviewEl.style.top  = Math.max(10, top) + 'px';
  });
}
function showAltPreview(node, clientX, clientY) {
  if (!node || !node.images || !node.images.length) { hideAltPreview(); return; }
  if (altPreviewNodeId !== node.id) {
    altPreviewNodeId = node.id;
    buildAltPreviewContent(node);
  }
  if (altPreviewEl.style.display !== 'block') altPreviewEl.style.display = 'block';
  const nodeEl = canvas.querySelector(`.node[data-id="${node.id}"]`);
  if (altHoveredNodeEl && altHoveredNodeEl !== nodeEl) altHoveredNodeEl.classList.remove('alt-hover');
  if (nodeEl) { nodeEl.classList.add('alt-hover'); altHoveredNodeEl = nodeEl; }
  positionAltPreview(clientX, clientY);
}
document.addEventListener('mousemove', e => {
  mouseClientX = e.clientX; mouseClientY = e.clientY;
}, true);
document.addEventListener('mousemove', e => {
  if (altPreviewEl && altPreviewEl.style.display === 'block' && altPreviewEl.contains(e.target)) return;
  if (!altKeyDown) { if (altPreviewEl && altPreviewEl.style.display === 'block') hideAltPreview(); return; }
  if (ivState.open) { hideAltPreview(); return; }
  if (canvas.querySelector('.node.dragging') || canvas.querySelector('.node.dragging-batch')) { hideAltPreview(); return; }
  const under = document.elementFromPoint(e.clientX, e.clientY);

function addChild(parent) {
  if (guardReadOnly()) return;
  pushUndo();
  const pDepth = computeNodeDepth().get(parent.id) ?? 0;
  const newDepth = pDepth + 1;
  const node = {
    id: uid('n'), kind: 'rule', title: '子产品',
    x: parent.x + 340, y: parent.y,
    rules: [{ type: 'seq', value: 1, digits: 2, auto: true }],
    note: '', images: [],
    collapsed: false, bodyCollapsed: false,
    color: levelColorOf(newDepth)
  };
  state.nodes.push(node);
  state.edges.push({ id: uid('e'), from: parent.id, to: node.id });
  if (parent.collapsed) parent.collapsed = false;
  render();
  if (!state.freeMove && collides(node, node.x, node.y)) {
    const spot = findFreeSpot(node, node.x, node.y);
    node.x = spot.x; node.y = spot.y;
    const nel = canvas.querySelector(`.node[data-id="${node.id}"]`);
    if (nel) { nel.style.left = node.x + 'px'; nel.style.top = node.y + 'px'; }
    scheduleDraw();
  }
  markDirty();
  setTimeout(() => scrollToNode(node.id), 60);
}
function removeNode(id) {
  if (guardReadOnly()) return;
  const node = getNode(id);
  if (!node) return;
  const doomed = new Set([id]);
  let changed = true;
  while (changed) {
    changed = false;
    for (const e of state.edges) {
      if (doomed.has(e.from) && !doomed.has(e.to)) { doomed.add(e.to); changed = true; }
    }
  }
  const extra = doomed.size > 1 ? `（含 ${doomed.size - 1} 个子节点）` : '';
  if (!confirm(`确定删除「${node.title}」${extra}？`)) return;
  pushUndo();
  state.nodes = state.nodes.filter(n => !doomed.has(n.id));
  state.edges = state.edges.filter(e => !doomed.has(e.from) && !doomed.has(e.to));
  doomed.forEach(d => selectedIds.delete(d));
  render(); markDirty(); updateSelectionBar();
}
function connect(fromId, toId) {
  if (guardReadOnly()) return;
  if (fromId === toId) return;
  const toNode = getNode(toId);
  if (!toNode) return;
  if (toNode.kind === 'root') return toast('起始节点不能作为子节点');
  let cur = getNode(fromId);
  const guard = new Set();
  while (cur) {
    if (cur.id === toId) return toast('不能形成循环连接');
    if (guard.has(cur.id)) break;
    guard.add(cur.id);
    cur = parentOf(cur.id);
  }
  pushUndo();
  state.edges = state.edges.filter(e => e.to !== toId);
  state.edges.push({ id: uid('e'), from: fromId, to: toId });
  scheduleDraw(); refreshIds(); markDirty();
}

/* =========================================================================
 *  画布交互（含批量拖动 + 对齐辅助线）
 * ========================================================================= */
canvas.addEventListener('pointerdown', e => {
  if (e.button === 1) { startPan(e); return; }  // 中键：拖动画布（不受只读模式限制）
  if (e.button === 2) return;  // 右键交给 contextmenu
  hidePathTooltip();
  closeCtxMenu();
  if (e.altKey && e.target.closest('.node')) return;

  const nodeEl = e.target.closest('.node');
  activeNodeId = nodeEl ? nodeEl.dataset.id : null;

  if (readOnlyMode) {
    if (e.target.closest('.chev') || e.target.closest('.subtree-chev')) return;
    if (e.target.closest('input, select, button, textarea, label')) return;
    if (!nodeEl) { startBoxSelect(e); return; }
    if (nodeEl && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toggleSelectNode(nodeEl); return; }
    if (nodeEl) { toggleSelectNode(nodeEl); return; }
    return;
  }

  const outPort = e.target.closest('.port.out');
  if (outPort) { startLink(e, outPort.closest('.node').dataset.id); return; }
  const inPort = e.target.closest('.port.in');
  if (inPort) { unlink(e, inPort.closest('.node').dataset.id); return; }
  if (e.target.closest('input, select, button, textarea, label, .port')) return;

  if (nodeEl && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); toggleSelectNode(nodeEl); return;
  }
  if (nodeEl) {
    if (!selectedIds.has(nodeEl.dataset.id) && selectedIds.size > 0) clearSelection();
    startDrag(e, nodeEl);
    return;
  }
  startBoxSelect(e);
});

function startDrag(e, nodeEl) {
  if (guardReadOnly()) return;
  e.preventDefault();
  const node = getNode(nodeEl.dataset.id);
  if (!node) return;

  const isBatch = selectedIds.has(node.id) && selectedIds.size > 1;
  const movingNodes = isBatch
    ? state.nodes.filter(n => selectedIds.has(n.id) && visibleSet.has(n.id))
    : [node];
  const movingSet = new Set(movingNodes.map(n => n.id));

  const initialPositions = movingNodes.map(n => ({ node: n, ox: n.x, oy: n.y }));

  if (isBatch) {
    movingNodes.forEach(n => {
      const nel = canvas.querySelector(`.node[data-id="${n.id}"]`);
      if (nel) nel.classList.add('dragging-batch');
    });
  } else {
    nodeEl.classList.add('dragging');
  }

  beginTransaction();   // ★ 开始事务

  const sx = e.clientX, sy = e.clientY;
  let moved = false;

  const move = ev => {
    moved = true;
    if (altPreviewEl && altPreviewEl.style.display === 'block') hideAltPreview();

    const dx = (ev.clientX - sx) / zoom;
    const dy = (ev.clientY - sy) / zoom;

    if (isBatch) {
      // 批量移动：尝试整组位移 + 是否吸附
      const tryMove = (dx, dy) => {
        for (const item of initialPositions) {
          const nx = Math.max(0, item.ox + dx);
          const ny = Math.max(0, item.oy + dy);
          if (collidesExcluding(item.node, nx, ny, movingSet)) return false;
        }
        return true;
      };
      const freeMode = state.freeMove || ev.altKey;
      let fx = dx, fy = dy;
      if (!freeMode) {
        if (!tryMove(dx, dy)) {
          if (tryMove(dx, 0)) fy = 0;
          else if (tryMove(0, dy)) fx = 0;
          else { fx = 0; fy = 0; }
        }
      }
      for (const item of initialPositions) {
        item.node.x = Math.max(0, item.ox + fx);
        item.node.y = Math.max(0, item.oy + fy);
        const nel = canvas.querySelector(`.node[data-id="${item.node.id}"]`);
        if (nel) {
          nel.style.left = item.node.x + 'px';
          nel.style.top  = item.node.y + 'px';
        }
      }
      // 批量移动不显示辅助线（整组对齐复杂）
      clearGuides();
      scheduleDraw();
    } else {
      // 单节点移动
      const nx0 = Math.max(0, initialPositions[0].ox + dx);
      const ny0 = Math.max(0, initialPositions[0].oy + dy);

      const freeMode = state.freeMove || ev.altKey;

      // ★ 对齐辅助线 + 吸附
      let nx = nx0, ny = ny0;
      if (!freeMode) {
        const snap = computeSnapAndGuides(node, nx0, ny0, new Set([node.id]));
        if (snap.guideX !== null) {
          nx = nx0 + snap.snapX;
          activeGuides.v = [snap.guideX];
        } else {
          activeGuides.v = [];
        }
        if (snap.guideY !== null) {
          ny = ny0 + snap.snapY;
          activeGuides.h = [snap.guideY];
        } else {
          activeGuides.h = [];
        }
        drawGuides();
      } else {
        clearGuides();
      }

      // 防重叠约束
      let fx = node.x, fy = node.y;
      if (freeMode) { fx = nx; fy = ny; }
      else {
        if (!collides(node, nx, ny))          { fx = nx; fy = ny; }
        else if (!collides(node, nx, node.y)) { fx = nx; }
        else if (!collides(node, node.x, ny)) { fy = ny; }
      }
      if (fx !== node.x || fy !== node.y) {
        node.x = fx; node.y = fy;
        nodeEl.style.left = fx + 'px'; nodeEl.style.top = fy + 'px';
        scheduleDraw();
      }
    }
  };
  const up = () => {
    if (isBatch) {
      movingNodes.forEach(n => {
        const nel = canvas.querySelector(`.node[data-id="${n.id}"]`);
        if (nel) nel.classList.remove('dragging-batch');
      });
    } else {
      nodeEl.classList.remove('dragging');
    }
    clearGuides();
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    if (moved) {
      commitTransaction();   // ★ 提交事务
      markDirty();
    } else {
      abortTransaction();    // ★ 未移动，放弃事务
    }
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function startLink(e, fromId) {
  if (guardReadOnly()) return;
  e.preventDefault(); e.stopPropagation();
  const start = portPos(fromId, 'out');
  if (!start) return;
  const temp = document.createElementNS(NS, 'path');
  temp.setAttribute('class', 'edge temp');
  svg.appendChild(temp);
  let hovered = null;
  const move = ev => {
    const p = toCanvas(ev.clientX, ev.clientY);
    temp.setAttribute('d', curve(start, p));
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const target = under?.closest?.('.node') || null;
    if (hovered && hovered !== target) hovered.classList.remove('drop-target');
    hovered = target;
    if (hovered) hovered.classList.add('drop-target');
  };
  const up = ev => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    temp.remove();
    if (hovered) hovered.classList.remove('drop-target');
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const target = under?.closest?.('.node');
    if (target) connect(fromId, target.dataset.id);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}
function unlink(e, toId) {
  if (guardReadOnly()) return;
  e.preventDefault(); e.stopPropagation();
  const before = state.edges.length;
  const filtered = state.edges.filter(x => x.to !== toId);
  if (filtered.length !== before) {
    pushUndo();
    state.edges = filtered;
    scheduleDraw(); refreshIds(); markDirty();
    toast('已断开连接');
  }
}

let ctxMenuEl = null;
function closeCtxMenu() {
  if (ctxMenuEl) { ctxMenuEl.remove(); ctxMenuEl = null; }
  document.removeEventListener('pointerdown', ctxOutside, true);
  document.removeEventListener('scroll', closeCtxMenu, true);
}
function ctxOutside(ev) {
  if (ctxMenuEl && !ctxMenuEl.contains(ev.target)) closeCtxMenu();
}

function makeCtxItem(label, kbd, onClick, opts = {}) {
  const btn = document.createElement('button');
  if (opts.danger) btn.classList.add('danger');
  if (opts.disabled) btn.disabled = true;
  btn.innerHTML = `<span>${label}</span>${kbd ? `<span class="kbd">${kbd}</span>` : ''}`;
  btn.onclick = ev => {
    ev.stopPropagation();

function makeCtxSep() {
  const s = document.createElement('div');

}

function showCtxMenu(x, y, headerHtml, buildItems) {
  closeCtxMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  if (headerHtml) {
    const h = document.createElement('div');
    h.className = 'ctx-header';
    h.innerHTML = headerHtml;
    menu.appendChild(h);
  }
  buildItems(menu);
  document.body.appendChild(menu);
  ctxMenuEl = menu;
  // 定位
  requestAnimationFrame(() => {
    const r = menu.getBoundingClientRect();
    let left = x, top = y;
    if (left + r.width > window.innerWidth - 8) left = window.innerWidth - r.width - 8;
    if (top + r.height > window.innerHeight - 8) top = window.innerHeight - r.height - 8;
    menu.style.left = Math.max(8, left) + 'px';
    menu.style.top  = Math.max(8, top) + 'px';
  });
  setTimeout(() => {
    document.addEventListener('pointerdown', ctxOutside, true);
    document.addEventListener('scroll', closeCtxMenu, true);
  }, 0);
}

// 节点右键菜单
function showNodeCtxMenu(nodeId, x, y) {

    menu.appendChild(makeCtxItem('▸ 仅收自身', '', () => {
      if (guardReadOnly()) return;
      pushUndo();
      const allCollapsed = selected.every(n => n.bodyCollapsed);
      selected.forEach(n => {
        n.bodyCollapsed = !allCollapsed;
        if (!allCollapsed) n.collapsed = false;
      });

    }));
    menu.appendChild(makeCtxItem('▼ 折叠子树', '', () => {

    }));

        const v = computeId(node);
        if (!v) return toast('该节点尚未连接');

      }));
    }
    menu.appendChild(makeCtxSep());
    menu.appendChild(makeCtxItem(`🗑 删除${multi ? ` (${selected.length})` : ''}`, 'Del', () => {
      if (guardReadOnly()) return;
      const count = selected.length;
      if (!confirm(`确定删除选中的 ${count} 个节点及其所有子节点？`)) return;
      pushUndo();
      const doomed = new Set();
      const expand = id => {
        if (doomed.has(id)) return;
        doomed.add(id);
        for (const e of state.edges) if (e.from === id) expand(e.to);
      };
      selected.forEach(n => expand(n.id));
      state.nodes = state.nodes.filter(n => !doomed.has(n.id));
      state.edges = state.edges.filter(e => !doomed.has(e.from) && !doomed.has(e.to));
      selectedIds.clear();
      render(); markDirty(); updateSelectionBar();
      toast(`已删除 ${doomed.size} 个节点`);
    }, { danger: true, disabled: readOnlyMode }));

}

/* =========================================================================
 *  键盘
 * ========================================================================= */
document.addEventListener('keydown', e => {
  if (ivState.open) return;
  if (modalMask.classList.contains('show')) return;
  if (importMask.classList.contains('show')) return;
  if (shareMask.classList.contains('show')) return;
  if (pwMask.classList.contains('show')) return;
  if (document.getElementById('onboardOverlay').classList.contains('show')) return;
  if (dashboardOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeDashboard(); return; }
    return;
  }
  const tag = (document.activeElement?.tagName || '').toLowerCase();
  const editing = tag === 'input' || tag === 'textarea' || tag === 'select';

  const cmd = e.ctrlKey || e.metaKey;

  // 撤销 / 重做
  if (cmd && !e.shiftKey && e.key.toLowerCase() === 'z' && !editing) {
    e.preventDefault();
    doUndo();
    return;
  }
  if (cmd && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z')) && !editing) {
    e.preventDefault();
    doRedo();
    return;
  }
  // 复制
  if (cmd && e.key.toLowerCase() === 'c' && !editing) {
    if (selectedIds.size > 0) {
      e.preventDefault();
      if (readOnlyMode) { toast('只读模式，无法复制'); return; }
      if (copySelectedNodes()) toast(`已复制 ${clipboard.nodes.length} 个节点`);
    }
    return;
  }
  // 粘贴
  if (cmd && e.key.toLowerCase() === 'v' && !editing) {
    if (!clipboard || !clipboard.nodes.length) return;
    e.preventDefault();
    if (readOnlyMode) { toast('只读模式，无法粘贴'); return; }
    if (pasteNodes()) toast(`已粘贴 ${clipboard.nodes.length} 个节点`);
    return;
  }
  // 全选
  if (cmd && e.key.toLowerCase() === 'a' && !editing) {
    e.preventDefault(); selectAll();
    return;
  }
  // 视图快捷键
  if (cmd && e.key === '0' && !editing) {
    e.preventDefault(); applyZoom(1);
    return;
  }
  if (cmd && e.key === '1' && !editing) {
    e.preventDefault(); document.getElementById('zoomFit').click();
    return;
  }
  // Esc 取消选择
  if (e.key === 'Escape' && !editing) {
    if (selectedIds.size > 0) { e.preventDefault(); clearSelection(); }
  }
  // Delete 删除
  if (e.key === 'Delete' && !editing && selectedIds.size > 0) {
    e.preventDefault();
    document.getElementById('selDelete').click();
  }
  // F2 重命名选中的单个节点
  if (e.key === 'F2' && !editing && selectedIds.size === 1) {
    e.preventDefault();
    const id = [...selectedIds][0];
    const nel = canvas.querySelector(`.node[data-id="${id}"]`);
    const titleInput = nel?.querySelector('.node-title');
    if (titleInput) { titleInput.focus(); titleInput.select(); }
  }
});

/* =========================================================================
 *  一键排版
 * ========================================================================= */
const LAYOUT_PAD = 80;

function kidsOfNode(n) {
  return state.edges.filter(e => e.from === n.id).map(e => getNode(e.to)).filter(Boolean)
    .sort((a, b) => (a.y - b.y) || (a.x - b.x));
}
function visibleKidsOf(n) { return n.collapsed ? [] : kidsOfNode(n); }
function rootNodes() {
  return state.nodes.filter(n => n.kind === 'root' || !parentOf(n.id))
    .sort((a, b) => (a.y - b.y) || (a.x - b.x));
}
function computeDepths() {
  const depth = new Map();
  const order = [];
  const visited = new Set();
  const dfs = (n, d) => {
    if (!n || visited.has(n.id)) return;
    visited.add(n.id);
    depth.set(n.id, d);
    order.push(n);
    visibleKidsOf(n).forEach(c => dfs(c, d + 1));
  };
  rootNodes().forEach(r => dfs(r, 0));
  state.nodes.forEach(n => { if (!depth.has(n.id)) { depth.set(n.id, 0); order.push(n); } });
  return { depth, order };
}
function fitCanvasSize() {
  const maxX = Math.max(0, ...state.nodes.map(n => n.x + (n._w || NODE_W))) + LAYOUT_PAD;
  const maxY = Math.max(0, ...state.nodes.map(n => n.y + (n._h || DEF_H))) + LAYOUT_PAD;
  setCanvasSize(Math.max(4600, Math.ceil(maxX)), Math.max(3400, Math.ceil(maxY)));
}
function layoutTree() {
  const H_GAP = 46, V_GAP = 74;
  const { depth } = computeDepths();
  const maxDepth = Math.max(0, ...depth.values());
  const levelH = new Array(maxDepth + 1).fill(60);
  for (const n of state.nodes) {
    const d = depth.get(n.id) ?? 0;
    levelH[d] = Math.max(levelH[d], n._h || DEF_H);
  }
  const levelY = [];
  let acc = LAYOUT_PAD;
  for (let d = 0; d <= maxDepth; d++) { levelY[d] = acc; acc += levelH[d] + V_GAP; }
  const wCache = new Map();
  function subtreeW(n) {
    if (wCache.has(n.id)) return wCache.get(n.id);
    const kids = visibleKidsOf(n);
    let w = NODE_W;
    if (kids.length) {
      w = kids.reduce((s, k, i) => s + subtreeW(k) + (i ? H_GAP : 0), 0);
      w = Math.max(w, NODE_W);
    }
    wCache.set(n.id, w); return w;
  }
  function place(n, left) {
    const d = depth.get(n.id) ?? 0;
    const w = subtreeW(n);
    n.x = Math.round(left + (w - NODE_W) / 2);
    n.y = Math.round(levelY[d]);
    const kids = visibleKidsOf(n);
    if (!kids.length) return;
    const total = kids.reduce((s, k, i) => s + subtreeW(k) + (i ? H_GAP : 0), 0);
    let cx = left + (w - total) / 2;
    for (const k of kids) { place(k, cx); cx += subtreeW(k) + H_GAP; }

  order.forEach(n => cols[depth.get(n.id) ?? 0].push(n));
  for (let d = 0; d <= maxDepth; d++) {

    let y = LAYOUT_PAD;
    for (const n of cols[d]) {

function autoLayout(mode = 'vertical', opts = {}) {

}

document.addEventListener('paste', async e => {
  if (readOnlyMode) return;
  if (ivState.open) return;
  if (!activeNodeId) return;
  const node = getNode(activeNodeId);
  if (!node) return;
  const items = [...(e.clipboardData?.items || [])];
  const imgs = items.filter(i => i.type.startsWith('image/'));
  if (!imgs.length) return;
  e.preventDefault();
  pushUndo();
  let n = 0;
  for (const it of imgs) {
    const f = it.getAsFile();
    if (!f) continue;
    try { node.images.push(await compressImage(f)); n++; } catch (err) {}
  }
  if (n) { render(); markDirty(); toast(`已粘贴 ${n} 张截图`); }
});

function compressImage(file, maxW = 1100, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
