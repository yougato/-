  const ci = el('input'); ci.type = 'color'; ci.value = '#4c8dff';
  ci.oninput = () => { nodesArr.forEach(n => n.color = ci.value); render(); };
  ci.onchange = () => { pushUndo(); closeColorPop(); markDirty(); };
  custom.appendChild(ci); pop.appendChild(custom);
  const reset = el('button', 'swatch', '∅'); reset.title = '恢复默认颜色';
  reset.onclick = ev => {
    ev.stopPropagation();
    pushUndo();
    nodesArr.forEach(n => n.color = null);
    closeColorPop(); render(); markDirty();
  };
  pop.appendChild(reset);
  document.body.appendChild(pop);
  colorPopEl = pop;
  positionColorPop(pop, anchorBtn);
  colorPopOutside = ev => {
    if (colorPopEl && !colorPopEl.contains(ev.target) && !anchorBtn.contains(ev.target)) closeColorPop();
  };
  setTimeout(() => document.addEventListener('pointerdown', colorPopOutside, true), 0);
}

/* =========================================================================
 *  规则编辑器
 * ========================================================================= */
function buildRuleEl(node, rule) {
  const wrap = el('div', 'rule');
  const top = el('div', 'rule-top');
  const sel = el('select', 'rule-type');
  [['fixed','固定文本'],['choice','选项'],['seq','序号'],['date','日期']]
    .forEach(([v, l]) => { const o = el('option', null, l); o.value = v; sel.appendChild(o); });
  sel.value = rule.type;

  const del = el('button', 'icon-btn del', '✕');
  del.title = '删除该字段';
  del.onclick = () => {
    if (guardReadOnly()) return;
    pushUndo();
    const i = node.rules.indexOf(rule);
    if (i > -1) node.rules.splice(i, 1);
    render(); markDirty();
  };
  top.append(sel, del);
  wrap.appendChild(top);

  const body = el('div', 'rule-body');
  wrap.appendChild(body);

  function fill() {
    body.innerHTML = '';
    if (rule.type === 'fixed') {
      const inp = el('input', 'r-input');
      inp.type = 'text'; inp.value = rule.text ?? ''; inp.placeholder = '如  -A   或   /R';
      inp.oninput = () => { rule.text = inp.value; refreshIds(); markDirty(); };
      attachUndoToInput(inp);
      body.appendChild(inp);
    } else if (rule.type === 'choice') {
      const inp = el('input', 'r-input');
      inp.type = 'text'; inp.value = rule.options ?? ''; inp.placeholder = '01:红色, 02:蓝色';
      const selEl = el('select', 'r-input');
      const rebuild = () => {
        const opts = parseOptions(rule.options);
        selEl.innerHTML = '';
        if (!opts.length) {
          const o = el('option', null, '（暂无选项）'); o.value = '';
          selEl.appendChild(o); rule.selected = ''; return;
        }
        for (const o of opts) {
          const op = el('option', null, o.code === o.label ? o.code : `${o.code} · ${o.label}`);
          op.value = o.code; selEl.appendChild(op);
        }
        if (!opts.some(o => o.code === rule.selected)) rule.selected = opts[0].code;
        selEl.value = rule.selected;
      };
      inp.oninput = () => { rule.options = inp.value; rebuild(); refreshIds(); markDirty(); };
      selEl.onchange = () => { pushUndo(); rule.selected = selEl.value; refreshIds(); markDirty(); };
      attachUndoToInput(inp);
      rebuild();
      body.append(inp, selEl);
    } else if (rule.type === 'seq') {
      const row = el('div', 'row');
      const l1 = el('label', 'mini', '起始');
      const v = el('input'); v.type = 'number'; v.value = rule.value ?? 1;
      v.oninput = () => { rule.value = Number(v.value) || 0; refreshIds(); markDirty(); };
      attachUndoToInput(v);
      l1.appendChild(v);
      const l2 = el('label', 'mini', '位数');
      const d = el('input'); d.type = 'number'; d.min = 1; d.max = 8; d.value = rule.digits ?? 2;
      d.oninput = () => { rule.digits = Math.max(1, Math.min(8, Number(d.value) || 1)); refreshIds(); markDirty(); };
      attachUndoToInput(d);
      l2.appendChild(d);
      const l3 = el('label', 'mini chk');
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!rule.auto;
      cb.onchange = () => { pushUndo(); rule.auto = cb.checked; refreshIds(); markDirty(); };
      l3.append(cb, '自动编号');
      row.append(l1, l2, l3);
      body.appendChild(row);
    } else if (rule.type === 'date') {
      const inp = el('input', 'r-input');
      inp.type = 'text'; inp.value = rule.format ?? 'YYYYMMDD'; inp.placeholder = 'YYYYMMDD';
      inp.oninput = () => { rule.format = inp.value; refreshIds(); markDirty(); };
      attachUndoToInput(inp);
      body.appendChild(inp);
    }
  }
  sel.onchange = () => {
    if (guardReadOnly()) return;
    pushUndo();
    rule.type = sel.value;
    if (rule.type === 'fixed'  && rule.text === undefined)   rule.text = '-A';
    if (rule.type === 'choice' && !rule.options) { rule.options = '01:A型,02:B型'; rule.selected = '01'; }
    if (rule.type === 'seq')   { if (rule.value === undefined) rule.value = 1; if (rule.digits === undefined) rule.digits = 2; }
    if (rule.type === 'date'   && !rule.format) rule.format = 'YYYYMMDD';
    fill(); refreshIds(); markDirty();
  };
  fill();
  return wrap;
}

/* =========================================================================
 *  折叠逻辑
 * ========================================================================= */
function toggleBodyCollapse(node) {
  if (guardReadOnly()) return;
  pushUndo();
  if (node.collapsed) {
    node.collapsed = false;
    node.bodyCollapsed = true;
  } else {
    node.bodyCollapsed = !node.bodyCollapsed;
  }
  render();
  markDirty();
  if (autoLayoutOnToggle && state.nodes.length > 1) {
    requestAnimationFrame(() => {
      autoLayout('vertical', { forceFreeMove: false, toastMsg: false, scrollToStart: false });
    });
  }
}
function toggleSubtreeCollapse(node) {
  if (guardReadOnly()) return;
  pushUndo();
  if (node.bodyCollapsed) {
    node.bodyCollapsed = false;
    node.collapsed = true;
  } else {
    node.collapsed = !node.collapsed;
  }
  render();
  markDirty();
  if (autoLayoutOnToggle && state.nodes.length > 1) {
    requestAnimationFrame(() => {
      autoLayout('vertical', { forceFreeMove: false, toastMsg: false, scrollToStart: false });
    });
  }
}

/* =========================================================================
 *  ★ 批号（台账：不参与订货号计算）
 * ========================================================================= */
const BATCH_PREVIEW = 2;      // 节点内最多预览几条，避免把节点撑高
let batchDupCache = null;
let batchPanelNode = null;

const batchMask = document.getElementById('batchMask');
const batchBody = document.getElementById('batchBody');
const batchHint = document.getElementById('batchHint');

function batchesOf(node) {
  if (!Array.isArray(node.batches)) node.batches = [];
  return node.batches;
}
function invalidateBatchDup() { batchDupCache = null; }
/** 批号重复集合（带缓存，render / markDirty 时失效） */
function batchDuplicates() {
  if (!batchDupCache) batchDupCache = checkBatchDuplicates();
  return batchDupCache;
}
/** 批号在追溯语境下应唯一，跨节点重复同样算重复 */
function checkBatchDuplicates() {
  const seen = new Set(), dup = new Set();
  for (const n of state.nodes) {
    for (const b of (n.batches || [])) {
      const no = String(b.no || '').trim();
      if (!no) continue;
      if (seen.has(no)) dup.add(no); else seen.add(no);
    }
  }
  return dup;
}
function nodeHasDupBatch(node, dupSet) {
  return batchesOf(node).some(b => dupSet.has(String(b.no || '').trim()));
}
/** 只预填一个建议批号，不做规则引擎 */
function suggestBatchNo(node) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const base = `L${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
  const used = new Set(batchesOf(node).map(b => String(b.no || '')));
  let i = 1;
  while (used.has(`${base}-${p(i)}`)) i++;
  return `${base}-${p(i)}`;
}
function todayIso() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* ---------- 节点内的批号摘要区 ---------- */
function buildBatchArea(node) {
  const list = batchesOf(node);
  const dupSet = batchDuplicates();
  const hasDup = nodeHasDupBatch(node, dupSet);

  const wrap = el('div', 'batch-area');
  const head = el('div', 'batch-head');
  const title = el('button', 'batch-title');
  title.type = 'button';
  title.innerHTML = list.length
    ? `🏷 批号 <b>${list.length}</b>${hasDup ? ' <span class="batch-warn">⚠ 重复</span>' : ''}`
    : '🏷 批号 <b>0</b> · 点击添加';
  title.title = '管理批号（数量 / 日期 / 备注）';
  title.onclick = ev => { ev.stopPropagation(); openBatchPanel(node); };
  head.appendChild(title);
  wrap.appendChild(head);

  // 没有批号时只留标题行，避免每个节点都白白变高
  if (!list.length) return wrap;
  for (const b of list.slice(-BATCH_PREVIEW).reverse()) {
    const no = String(b.no || '').trim();
    const row = el('div', 'batch-mini' + (dupSet.has(no) ? ' dup' : ''));
    row.append(
      el('span', 'b-no', no || '（未命名）'),
      el('span', null, b.qty ? String(b.qty) : '—'),
      el('span', null, b.date ? String(b.date).slice(5) : '')
    );
    wrap.appendChild(row);
  }
  if (list.length > BATCH_PREVIEW) {
    wrap.appendChild(el('div', 'batch-more', `共 ${list.length} 批 · 点击上方管理全部`));
  }
  return wrap;
}

/* ---------- 批号管理面板 ---------- */
function openBatchPanel(node) {
  if (guardReadOnly()) return;
  batchPanelNode = node;
  renderBatchPanel();
  batchMask.classList.add('show');
}
function closeBatchPanel() {
  if (!batchMask.classList.contains('show')) return;
  batchMask.classList.remove('show');
  batchPanelNode = null;
  invalidateBatchDup();
  render();                 // 让节点内的批号摘要 / 徽标跟上
}
function renderBatchPanel() {
  const node = batchPanelNode;
  if (!node) return;
  const list = batchesOf(node);
  const dupSet = checkBatchDuplicates();
  document.getElementById('batchTitle').innerHTML =
    `🏷 批号管理 · <span style="color:var(--gold)">${escapeHtml(node.title || '未命名')}</span>`;

  batchBody.innerHTML = '';
  if (!list.length) {
    batchBody.appendChild(el('div', 'batch-empty', '还没有批号，点击右下角「＋ 添加批号」开始记录。'));
  } else {
    const cols = el('div', 'batch-cols');
    cols.append(el('span', null, '批号'), el('span', null, '数量'),
                el('span', null, '日期'), el('span', null, '备注'), el('span'));
    const table = el('div', 'batch-table');
    table.appendChild(cols);
    list.forEach(b => table.appendChild(buildBatchLine(node, b, dupSet)));
    batchBody.appendChild(table);
  }
  updateBatchHint(node, dupSet);
}
function updateBatchHint(node, dupSet) {
  const list = batchesOf(node);
  const dupCount = list.filter(b => dupSet.has(String(b.no || '').trim())).length;
  batchHint.textContent = dupCount
    ? `⚠ ${dupCount} 条批号与其他节点重复（批号建议全局唯一）`
    : `共 ${list.length} 条批号`;
  batchHint.className = 'batch-hint' + (dupCount ? ' bad' : '');
}
/** 改「批号」时只刷新重复标记，不重建面板（重建会让输入框失去焦点） */
function refreshBatchDupMarks() {
  const node = batchPanelNode;
  if (!node) return;
  invalidateBatchDup();
  const dupSet = batchDuplicates();
  const lines = batchBody.querySelectorAll('.batch-line');
  batchesOf(node).forEach((b, i) => {
    const line = lines[i];
    if (line) line.classList.toggle('dup', dupSet.has(String(b.no || '').trim()));
  });
  updateBatchHint(node, dupSet);
}
function buildBatchLine(node, b, dupSet) {
  const no = String(b.no || '').trim();
  const line = el('div', 'batch-line' + (dupSet.has(no) ? ' dup' : ''));

  const inpNo = el('input', 'r-input');
  inpNo.type = 'text'; inpNo.value = b.no || ''; inpNo.placeholder = '如 L20261013-01';
  const inpQty = el('input', 'r-input');
  inpQty.type = 'number'; inpQty.value = b.qty ?? ''; inpQty.min = 0; inpQty.placeholder = '0';
  const inpDate = el('input', 'r-input');
  inpDate.type = 'date'; inpDate.value = b.date || '';
  const inpNote = el('input', 'r-input');
  inpNote.type = 'text'; inpNote.value = b.note || ''; inpNote.placeholder = '客户 / 工序 / 说明';

  inpNo.oninput    = () => { b.no = inpNo.value; markDirty(); refreshBatchDupMarks(); };
  inpQty.oninput   = () => { b.qty = Number(inpQty.value) || 0; markDirty(); };
  inpDate.onchange = () => { b.date = inpDate.value; markDirty(); };
  inpNote.oninput  = () => { b.note = inpNote.value; markDirty(); };
  [inpNo, inpQty, inpDate, inpNote].forEach(attachUndoToInput);

  const del = el('button', 'icon-btn del', '✕');
  del.title = '删除该批号';
  del.onclick = ev => {
    ev.stopPropagation();
    pushUndo();
    const i = batchesOf(node).indexOf(b);
    if (i > -1) node.batches.splice(i, 1);
    markDirty(); renderBatchPanel();
  };
  line.append(inpNo, inpQty, inpDate, inpNote, del);
  return line;
}

document.getElementById('batchAdd').onclick = () => {
  const node = batchPanelNode;
  if (!node || guardReadOnly()) return;
  pushUndo();
  batchesOf(node).push({ id: uid('b'), no: suggestBatchNo(node), qty: 0, date: todayIso(), note: '' });
  markDirty();
  renderBatchPanel();
  const inputs = batchBody.querySelectorAll('.batch-line input');
  const first = inputs[inputs.length - 4];
  if (first) { first.focus(); first.select(); }
};
document.getElementById('batchClose').onclick = closeBatchPanel;
document.getElementById('batchOk').onclick = closeBatchPanel;
batchMask.addEventListener('click', e => { if (e.target === batchMask) closeBatchPanel(); });

/* =========================================================================
 *  节点渲染
 * ========================================================================= */
let activeNodeId = null;

function buildNodeEl(node) {
  const hasImages = !!(node.images && node.images.length);
  const childCount = state.edges.filter(e => e.from === node.id).length;

  const wrap = el('div', 'node'
    + (node.kind === 'root' ? ' root' : '')
    + (node.collapsed ? ' collapsed' : '')
    + (node.bodyCollapsed ? ' body-collapsed' : '')
    + (node.locked ? ' locked' : ''));
  wrap.dataset.id = node.id;
  wrap.style.left = node.x + 'px';
  wrap.style.top  = node.y + 'px';
  if (node.color) wrap.style.borderColor = node.color;
  if (selectedIds.has(node.id)) wrap.classList.add('selected');

  // ★ 左上角常驻显示订货号（点击复制）
  const codeFlag = el('button', 'node-code-flag');
  codeFlag.type = 'button';
  codeFlag.onclick = ev => {
    ev.stopPropagation();
    const v = computeId(node);
    if (v === null) return toast('该节点尚未连接到起始节点');
    if (!v) return toast('该节点订货号为空');
    navigator.clipboard?.writeText(v).then(() => toast('已复制：' + v), () => toast(v));
  };
  wrap.appendChild(codeFlag);

  if (node.kind !== 'root') {
    const inPort = el('div', 'port in');
    inPort.title = '输入端口（点击可断开）';
    wrap.appendChild(inPort);
  }

  const head = el('div', 'node-head');
  if (node.color) head.style.background = `linear-gradient(180deg, ${hexA(node.color,.40)}, ${hexA(node.color,.12)})`;

  const chev = el('button', 'icon-btn chev', node.bodyCollapsed ? '▸' : '▾');
  chev.title = node.bodyCollapsed ? '展开自身看板（保留子级可见）' : '折叠自身看板（保留子级可见）';
  chev.onclick = ev => { ev.stopPropagation(); toggleBodyCollapse(node); };

  const subtreeChev = el('button', 'icon-btn subtree-chev', node.collapsed ? '▶' : '▼');
  subtreeChev.title = node.collapsed ? '展开子树（显示所有子级）' : '折叠子树（隐藏自身看板及所有子级）';
  subtreeChev.onclick = ev => { ev.stopPropagation(); toggleSubtreeCollapse(node); };

  const title = el('input', 'node-title');
  title.value = node.title;
  title.oninput = () => { if (readOnlyMode) { title.value = node.title; return; } node.title = title.value; markDirty(); };
  attachUndoToInput(title);
  // ★ 标题过长时：悬停显示全文（只在被截断时才弹）
  title.addEventListener('mouseenter', () => showTitleTooltip(title));
  title.addEventListener('mouseleave', hideTitleTooltip);
  title.addEventListener('focus', () => { hideTitleTooltip(); if (readOnlyMode || node.locked) title.blur(); });

  const imgBadge = el('span', 'img-count-badge' + (hasImages ? ' has-content' : ''), hasImages ? `📷${node.images.length}` : '');
  const subBadge = el('span', 'subtree-badge' + (childCount > 0 ? ' has-content' : ''), childCount > 0 ? `+${childCount}` : '');
  const batchCount = batchesOf(node).length;
  const batchBadge = el('span', 'batch-badge' + (batchCount ? ' has-content' : ''), batchCount ? `🏷${batchCount}` : '');
  const lockBadge = el('span', 'lock-badge', '🔒');

  const colorBtn = el('button', 'color-dot');
  colorBtn.title = '更改节点颜色';
  if (node.color) colorBtn.style.background = node.color;
  colorBtn.onclick = ev => { ev.stopPropagation(); openColorPop(node, colorBtn); };

  const addBtn = el('button', 'icon-btn', '＋');
  addBtn.title = '添加子节点';
  addBtn.onclick = ev => { ev.stopPropagation(); if (guardReadOnly()) return; addChild(node); };

  const delBtn = el('button', 'icon-btn del', '✕');
  delBtn.title = '删除节点（含其所有子节点）';
  delBtn.onclick = ev => { ev.stopPropagation(); if (guardReadOnly()) return; removeNode(node.id); };

  head.append(chev, subtreeChev, title, imgBadge, subBadge, batchBadge, lockBadge, colorBtn, addBtn, delBtn);
  wrap.appendChild(head);

  const body = el('div', 'node-body');

  if (node.kind === 'root') {
    const field = el('label', 'field');
    field.appendChild(el('span', null, '起始文本 ID'));
    const base = el('input', 'base-input');
    base.value = node.baseId || ''; base.placeholder = '如 AB';
    base.oninput = () => { if (readOnlyMode) { base.value = node.baseId || ''; return; } node.baseId = base.value; refreshIds(); markDirty(); };
    attachUndoToInput(base);
    field.appendChild(base);
    body.appendChild(field);
  }

  // ★ 通用节点：订货号自己填，不拼父级、不受父级规则影响
  if (node.generic) {
    const field = el('label', 'field');
    field.appendChild(el('span', null, '🧩 自定义订货号（不随父级变化）'));
    const fixed = el('input', 'base-input');
    fixed.value = node.fixedId || ''; fixed.placeholder = '如 TY-001';
    fixed.oninput = () => {
      if (readOnlyMode) { fixed.value = node.fixedId || ''; return; }
      node.fixedId = fixed.value;
      refreshIds(); markDirty();
    };
    attachUndoToInput(fixed);
    field.appendChild(fixed);
    body.appendChild(field);
  }

  const idrow = el('div', 'idrow');
  const idcode = el('code', 'node-id', '—');
  const copyBtn = el('button', 'icon-btn', '⧉');
  copyBtn.title = '复制订货号';
  copyBtn.onclick = ev => {
    ev.stopPropagation();
    const v = computeId(node);
    if (!v) return toast('该节点尚未连接');
    navigator.clipboard?.writeText(v).then(() => toast('已复制：' + v), () => toast(v));
  };
  idrow.append(idcode, copyBtn);
  idrow.addEventListener('mouseenter', e => showPathTooltip(node, e));
  idrow.addEventListener('mousemove', movePathTooltip);
  idrow.addEventListener('mouseleave', hidePathTooltip);
  body.appendChild(idrow);

  const warn = el('div', 'warn-bar', '⚠ 与同级节点编码重复，请调整字段');
  body.appendChild(warn);

  if (node.kind === 'rule' && !node.generic) {
    const rulesWrap = el('div', 'rules');
    node.rules.forEach(r => rulesWrap.appendChild(buildRuleEl(node, r)));
    body.appendChild(rulesWrap);
    const addRule = el('button', 'add-rule', '＋ 扩展字段');
    addRule.onclick = ev => {
      ev.stopPropagation();
      if (guardReadOnly()) return;
      pushUndo();
      node.rules.push({ type: 'fixed', text: '-' });
      render(); markDirty();
    };
    body.appendChild(addRule);
  }

  const note = el('textarea', 'note-input');
  note.placeholder = '备注（工艺 / 客户 / 说明…）';
  note.value = node.note || '';
  note.oninput = () => { if (readOnlyMode) { note.value = node.note || ''; return; } node.note = note.value; markDirty(); };
  attachUndoToInput(note);
  note.onpointerdown = ev => ev.stopPropagation();
  body.appendChild(note);

  const gallery = el('div', 'gallery');
  function rebuildGallery() {
    gallery.innerHTML = '';
    node.images.forEach((src, i) => {
      const t = el('div', 'thumb');
      const img = el('img'); img.src = src;
      const d = el('button', 'thumb-del', '✕'); d.title = '删除截图';
      d.onclick = ev => {
        ev.stopPropagation();
        if (guardReadOnly()) return;
        pushUndo();
        node.images.splice(i, 1); rebuildGallery(); markDirty();
      };
      t.onclick = ev => { ev.stopPropagation(); openImageViewer([...node.images], i, node.title); };
      t.append(img, d);
      gallery.appendChild(t);
    });
    const add = el('label', 'add-img', '＋');
    add.title = '添加截图（也可选中节点后 Ctrl+V 粘贴）';
    const fi = el('input');
    fi.type = 'file'; fi.accept = 'image/*'; fi.multiple = true; fi.style.display = 'none';
    fi.onchange = async () => {
      if (guardReadOnly()) return;
      pushUndo();
      for (const f of fi.files) { try { node.images.push(await compressImage(f)); } catch (e) {} }
      fi.value = ''; rebuildGallery(); markDirty(); toast('已添加截图');
    };
    add.appendChild(fi);
    gallery.appendChild(add);
  }
  rebuildGallery();
  body.appendChild(gallery);

  // ★ 批号台账（不参与订货号计算）
  body.appendChild(buildBatchArea(node));

  wrap.appendChild(body);

  const outPort = el('div', 'port out');
  outPort.title = '拖拽连线到子节点';
  wrap.appendChild(outPort);

  return wrap;
}

/* =========================================================================
 *  ★ 虚拟化：视口检测 + 增量同步
 * ========================================================================= */
const renderedIds = new Set();
const VIRTUAL_THRESHOLD = 80;   // 节点总数超过此值才启用虚拟化

function isInViewport(n, buffer = 300) {
  if (visibleSet.size <= VIRTUAL_THRESHOLD) return true;
  const vw = stage.clientWidth;
  const vh = stage.clientHeight;
  const vx1 = stage.scrollLeft / zoom - buffer;
  const vy1 = stage.scrollTop / zoom - buffer;
  const vx2 = vx1 + vw / zoom + buffer * 2;
  const vy2 = vy1 + vh / zoom + buffer * 2;
  const w = n._w || NODE_W;
  const h = n._h || DEF_H;
  return (n.x + w) >= vx1 && n.x <= vx2 && (n.y + h) >= vy1 && n.y <= vy2;
}

let viewportSyncRaf = null;
function scheduleViewportSync() {
  if (viewportSyncRaf) return;
  viewportSyncRaf = requestAnimationFrame(() => {
    viewportSyncRaf = null;
    syncViewport();
  });
}

function syncViewport() {
  if (readOnlyMode !== undefined && visibleSet.size <= VIRTUAL_THRESHOLD) return;

  const wanted = new Set();
  for (const n of state.nodes) {
    if (!visibleSet.has(n.id)) continue;
    if (!isInViewport(n)) continue;
    wanted.add(n.id);
  }

  // 移除不再需要的
  for (const id of [...renderedIds]) {
    if (!wanted.has(id)) {
      const el = canvas.querySelector(`.node[data-id="${id}"]`);
      if (el) el.remove();
      renderedIds.delete(id);
    }
  }
  // 添加新进入视口的
  for (const id of wanted) {
    if (renderedIds.has(id)) continue;
    const n = getNode(id);
    if (!n) continue;
    canvas.appendChild(buildNodeEl(n));
    renderedIds.add(id);
  }
  measureNodeHeights();
  refreshIds();
  scheduleDraw();
}

/* =========================================================================
 *  整体渲染
 * ========================================================================= */
function render() {
  invalidateBatchDup();
  hideTitleTooltip();
  visibleSet = computeVisible();
  // 清空所有节点
  canvas.querySelectorAll('.node').forEach(n => n.remove());
  renderedIds.clear();
  // 视口裁剪
  const useVirtual = visibleSet.size > VIRTUAL_THRESHOLD;
  for (const n of state.nodes) {
    if (!visibleSet.has(n.id)) continue;
    if (useVirtual && !isInViewport(n)) continue;
    canvas.appendChild(buildNodeEl(n));
    renderedIds.add(n.id);
  }
  measureNodeHeights();
  drawEdges();
  refreshIds();
  applySearchHighlight();
  updateSearchCount();
  applySelectionVisual();
  if (dashboardOpen) renderDashboardTable();
}

/* 滚动时同步视口 */
stage.addEventListener('scroll', () => {

}, { passive: true });

/* =========================================================================
 *  复制 / 粘贴
 * ========================================================================= */
function copySelectedNodes() {
  const selected = state.nodes.filter(n => selectedIds.has(n.id));
  if (!selected.length) return false;
  const selIds = new Set(selected.map(n => n.id));
  const innerEdges = state.edges.filter(e => selIds.has(e.from) && selIds.has(e.to));
  const minX = Math.min(...selected.map(n => n.x));
  const minY = Math.min(...selected.map(n => n.y));
  clipboard = {
    nodes: selected.map(n => ({
      origId: n.id,
      kind: n.kind, title: n.title,
      baseId: n.baseId,
      rules: n.rules ? JSON.parse(JSON.stringify(n.rules)) : undefined,
      note: n.note || '',
      images: n.images ? [...n.images] : [],
      generic: !!n.generic, fixedId: n.fixedId || '', locked: !!n.locked,
      batches: n.batches ? JSON.parse(JSON.stringify(n.batches)) : [],
      collapsed: !!n.collapsed,
      bodyCollapsed: !!n.bodyCollapsed,
      color: n.color || null,
      relX: n.x - minX, relY: n.y - minY
    })),
    edges: innerEdges.map(e => ({ from: e.from, to: e.to }))
  };
  pasteCounter = 0;
  return true;
}
function pasteNodes() {
  if (!clipboard || !clipboard.nodes.length) return false;
  pushUndo();
  pasteCounter++;
  const selected = state.nodes.filter(n => selectedIds.has(n.id));
  let baseX, baseY;
  if (selected.length) {
    baseX = Math.min(...selected.map(n => n.x)) + 60;
    baseY = Math.min(...selected.map(n => n.y)) + 60;
  } else {
    baseX = 200; baseY = 200;
  }
  const step = 30;
  baseX += (pasteCounter - 1) * step;
  baseY += (pasteCounter - 1) * step;

  const idMap = new Map();
  const newNodes = clipboard.nodes.map(item => {
    const newId = uid('n');
    idMap.set(item.origId, newId);
    return {
      id: newId,
      kind: item.kind,
      title: item.title ? item.title + ' 副本' : '副本',
      x: baseX + item.relX,
      y: baseY + item.relY,
      baseId: item.baseId,
      rules: item.rules ? JSON.parse(JSON.stringify(item.rules)) : undefined,
      note: item.note || '',
      images: item.images ? [...item.images] : [],
      generic: !!item.generic, fixedId: item.fixedId || '', locked: !!item.locked,
      // 批号随节点复制，但 id 必须重新生成，避免两份数据撞 id
      batches: (item.batches || []).map(b => ({ ...b, id: uid('b') })),
      collapsed: !!item.collapsed,
      bodyCollapsed: !!item.bodyCollapsed,
      color: item.color || null
    };
  });
  const newEdges = clipboard.edges.map(e => ({
    id: uid('e'),
    from: idMap.get(e.from),
    to: idMap.get(e.to)
  })).filter(e => e.from && e.to);

  state.nodes.push(...newNodes);
  state.edges.push(...newEdges);
  selectedIds.clear();
  newNodes.forEach(n => selectedIds.add(n.id));
  render(); markDirty(); updateSelectionBar();
  return true;
}

function startBoxSelect(e) {
  e.preventDefault();
  const start = toCanvas(e.clientX, e.clientY);
  const box = document.createElement('div');
  box.className = 'selection-box';
  box.style.left = start.x + 'px'; box.style.top = start.y + 'px';
  box.style.width = '0px'; box.style.height = '0px';
  canvas.appendChild(box);

  if (!e.shiftKey && selectedIds.size > 0) {
    selectedIds.clear(); applySelectionVisual(); updateSelectionBar();
  }
  const baseSelected = new Set(selectedIds);

  const move = ev => {
    const cur = toCanvas(ev.clientX, ev.clientY);
    const x = Math.min(start.x, cur.x), y = Math.min(start.y, cur.y);
    const w = Math.abs(cur.x - start.x), h = Math.abs(cur.y - start.y);
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    selectedIds.clear();
    baseSelected.forEach(id => selectedIds.add(id));
    for (const n of state.nodes) {
      if (!visibleSet.has(n.id)) continue;
      const rx = n.x, ry = n.y;
      const rw = n._w || NODE_W, rh = n._h || DEF_H;
      if (rx + rw >= x && rx <= x + w && ry + rh >= y && ry <= y + h) selectedIds.add(n.id);
    }
    applySelectionVisual(); updateSelectionBar();
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    box.remove();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

/* =========================================================================
 *  ★ 中键平移画布
 * ========================================================================= */
let panning = false;

function startPan(e) {
  e.preventDefault();
  if (panning) return;
  hidePathTooltip();
  closeCtxMenu();

  panning = true;
  document.body.classList.add('canvas-panning');

  const pid = e.pointerId;
  const startX = e.clientX, startY = e.clientY;
  const startScrollLeft = stage.scrollLeft, startScrollTop = stage.scrollTop;
  // 指针捕获：即使拖到窗口外也能持续收到 move/up
  try { stage.setPointerCapture(pid); } catch (err) {}
  let moved = false;

  const finish = () => {
    panning = false;
    document.body.classList.remove('canvas-panning');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', finish);
    document.removeEventListener('pointercancel', finish);
    window.removeEventListener('blur', finish);
    try { stage.releasePointerCapture(pid); } catch (err) {}
  };

  const move = ev => {
    if (ev.pointerId !== pid) return;
    if (!(ev.buttons & 4)) { finish(); return; }   // 中键已在窗口外松开
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if (!moved && Math.abs(dx) < 2 && Math.abs(dy) < 2) return;  // 过滤轻微抖动
    moved = true;
    stage.scrollLeft = startScrollLeft - dx;
    stage.scrollTop  = startScrollTop - dy;
  };

  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', finish);
  document.addEventListener('pointercancel', finish);
  window.addEventListener('blur', finish);
}

function isTextEditingEl(el) {
  if (!el || el === document.body || el === document.documentElement) return false;
  if (el.isContentEditable) return true;
  const tag = (el.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea';
}
// 画布上按下时，若正在编辑某输入框而按下的又不是它自己，先退出编辑态
// （画布的 pointerdown 会 preventDefault 以支持框选/拖动，浏览器默认的失焦因此被抑制）
function exitTextEditing(target) {
  const ae = document.activeElement;
  if (!isTextEditingEl(ae)) return;
  if (target && (target === ae || ae.contains(target))) return;
  ae.blur();
}

  return chain;
}

 *  增删改
 * ========================================================================= */
function addChild(parent) {
  if (guardReadOnly()) return;
  if (guardLocked(parent, '添加子节点')) return;
  pushUndo();
  const pDepth = computeNodeDepth().get(parent.id) ?? 0;
  const newDepth = pDepth + 1;
  const node = {
    id: uid('n'), kind: 'rule', title: '子产品',
    x: parent.x + 340, y: parent.y,
    rules: [{ type: 'seq', value: 1, digits: 2, auto: true }],
    note: '', images: [], batches: [],
    collapsed: false, bodyCollapsed: false,
    color: levelColorOf(newDepth)
  };
  state.nodes.push(node);
  state.edges.push({ id: uid('e'), from: parent.id, to: node.id });
  if (parent.collapsed) parent.collapsed = false;
  render();
  if (!state.freeMove && collides(node, node.x, node.y)) {
    const spot = findFreeSpot(node, node.x, node.y);
    node.x = spot.x; node.y = spot.y;
    const nel = canvas.querySelector(`.node[data-id="${node.id}"]`);
    if (nel) { nel.style.left = node.x + 'px'; nel.style.top = node.y + 'px'; }
    scheduleDraw();
  }
  markDirty();
  setTimeout(() => scrollToNode(node.id), 60);
}
function removeNode(id) {
  if (guardReadOnly()) return;
  const node = getNode(id);
  if (!node) return;
  if (guardLocked(node, '删除')) return;
  const doomed = new Set([id]);
  let changed = true;
  while (changed) {
    changed = false;
    for (const e of state.edges) {
      if (doomed.has(e.from) && !doomed.has(e.to)) { doomed.add(e.to); changed = true; }
    }
  }
  const extra = doomed.size > 1 ? `（含 ${doomed.size - 1} 个子节点）` : '';
  if (!confirm(`确定删除「${node.title}」${extra}？`)) return;
  pushUndo();
  state.nodes = state.nodes.filter(n => !doomed.has(n.id));
  state.edges = state.edges.filter(e => !doomed.has(e.from) && !doomed.has(e.to));
  doomed.forEach(d => selectedIds.delete(d));
  render(); markDirty(); updateSelectionBar();
}
function connect(fromId, toId) {
  if (guardReadOnly()) return;
  if (fromId === toId) return;
  const toNode = getNode(toId);
  if (!toNode) return;
  if (toNode.kind === 'root') return toast('起始节点不能作为子节点');
  if (guardLocked(toNode, '新建连线')) return;
  if (guardLocked(getNode(fromId), '新建连线')) return;
  // 环检测：从 from 出发沿「所有」父链向上（多父时也必须判定正确）
  const seen = new Set();
  const stack = [getNode(fromId)];
  while (stack.length) {
    const cur = stack.pop();
    if (!cur || seen.has(cur.id)) continue;
    seen.add(cur.id);
    if (cur.id === toId) return toast('不能形成循环连接');
    for (const e of state.edges) if (e.to === cur.id) stack.push(getNode(e.from));
  }
  if (state.edges.some(e => e.from === fromId && e.to === toId)) {
    return toast('这两个节点已经连接');
  }
  pushUndo();
  // ★ 通用节点可被多个父共用；普通节点仍是单父（新连线会取代旧连线）
  if (!toNode.generic) state.edges = state.edges.filter(e => e.to !== toId);
  state.edges.push({ id: uid('e'), from: fromId, to: toId });
  scheduleDraw(); refreshIds(); markDirty();
  if (toNode.generic) toast('已连到通用节点（订货号保持自定义）');
}

    if (nodeEl && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toggleSelectNode(nodeEl); return; }
    if (nodeEl) { toggleSelectNode(nodeEl); return; }

  }

  const inPort = e.target.closest('.port.in');

  }

    startDrag(e, nodeEl);
    return;
  }

});

function startDrag(e, nodeEl) {
  if (guardReadOnly()) return;
  e.preventDefault();
  const node = getNode(nodeEl.dataset.id);
  if (!node) return;
  if (guardLocked(node, '拖动')) return;

  const isBatch = selectedIds.has(node.id) && selectedIds.size > 1;
  let movingNodes = isBatch
    ? state.nodes.filter(n => selectedIds.has(n.id) && visibleSet.has(n.id))
    : [node];
  // ★ 锁定节点不参与拖动
  const lockedCount = movingNodes.filter(n => n.locked).length;
  if (lockedCount) {
    movingNodes = movingNodes.filter(n => !n.locked);
    if (!movingNodes.length) return;
    toast(`已跳过 ${lockedCount} 个锁定节点`);
  }
  const movingSet = new Set(movingNodes.map(n => n.id));

  const initialPositions = movingNodes.map(n => ({ node: n, ox: n.x, oy: n.y }));

  // ★ 整组包围盒（批量拖动时用于「整组对齐」辅助线）
  const groupRect = (() => {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const n of movingNodes) {
      const w = n._w || NODE_W, h = n._h || DEF_H;
      x1 = Math.min(x1, n.x);     y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + w); y2 = Math.max(y2, n.y + h);
    }
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  })();

  if (isBatch) {
    movingNodes.forEach(n => {
      const nel = canvas.querySelector(`.node[data-id="${n.id}"]`);
      if (nel) nel.classList.add('dragging-batch');
    });
  } else {
    nodeEl.classList.add('dragging');
  }

  beginTransaction();   // ★ 开始事务

  const sx = e.clientX, sy = e.clientY;
  let moved = false;

  const move = ev => {
    moved = true;
    if (altPreviewEl && altPreviewEl.style.display === 'block') hideAltPreview();

    const dx = (ev.clientX - sx) / zoom;
    const dy = (ev.clientY - sy) / zoom;

    if (isBatch) {
      // 批量移动：整组位移 + 整组对齐辅助线 + 可选防重叠
      const tryMove = (dx, dy) => {
        for (const item of initialPositions) {
          const nx = Math.max(0, item.ox + dx);
          const ny = Math.max(0, item.oy + dy);
          if (collidesExcluding(item.node, nx, ny, movingSet)) return false;
        }
        return true;
      };
      const freeMode = state.freeMove || ev.altKey;  // 是否跳过防重叠避让
      const snapOn   = !ev.altKey;                   // 对齐辅助线/吸附：与自由移动无关，仅 Alt 临时关闭

      let fx = dx, fy = dy;
      // 整组不越出画布左/上边界（同时保持组内相对位置）
      fx = Math.max(fx, -groupRect.x);
      fy = Math.max(fy, -groupRect.y);

      // ★ 整组对齐：拿整组包围盒与组外节点比较
      if (snapOn) {
        const snap = computeRectSnapAndGuides(
          { x: groupRect.x + fx, y: groupRect.y + fy, w: groupRect.w, h: groupRect.h },
          movingSet
        );
        fx += snap.snapX;
        fy += snap.snapY;
        activeGuides.v = snap.guideX !== null ? [snap.guideX] : [];
        activeGuides.h = snap.guideY !== null ? [snap.guideY] : [];
        drawGuides();
      } else {
        clearGuides();
      }

      // 吸附后再次保证不越界
      fx = Math.max(fx, -groupRect.x);
      fy = Math.max(fy, -groupRect.y);

      if (!freeMode) {
        if (!tryMove(fx, fy)) {
          if (tryMove(fx, 0)) fy = 0;
          else if (tryMove(0, fy)) fx = 0;
          else { fx = 0; fy = 0; }
        }
      }
      for (const item of initialPositions) {
        item.node.x = Math.max(0, item.ox + fx);
        item.node.y = Math.max(0, item.oy + fy);
        const nel = canvas.querySelector(`.node[data-id="${item.node.id}"]`);
        if (nel) {
          nel.style.left = item.node.x + 'px';
          nel.style.top  = item.node.y + 'px';
        }
      }
      scheduleDraw();
    } else {
      // 单节点移动
      const nx0 = Math.max(0, initialPositions[0].ox + dx);
      const ny0 = Math.max(0, initialPositions[0].oy + dy);

      const freeMode = state.freeMove || ev.altKey;  // 是否跳过防重叠避让
      const snapOn   = !ev.altKey;                   // 对齐辅助线/吸附：与自由移动无关，仅 Alt 临时关闭

      // ★ 对齐辅助线 + 吸附
      let nx = nx0, ny = ny0;
      if (snapOn) {
        const snap = computeSnapAndGuides(node, nx0, ny0, new Set([node.id]));
        if (snap.guideX !== null) {
          nx = nx0 + snap.snapX;
          activeGuides.v = [snap.guideX];
        } else {
          activeGuides.v = [];
        }
        if (snap.guideY !== null) {
          ny = ny0 + snap.snapY;
          activeGuides.h = [snap.guideY];
        } else {
          activeGuides.h = [];
        }
        drawGuides();
      } else {
        clearGuides();
      }

      // 防重叠约束
      let fx = node.x, fy = node.y;
      if (freeMode) { fx = nx; fy = ny; }
      else {
        if (!collides(node, nx, ny))          { fx = nx; fy = ny; }
        else if (!collides(node, nx, node.y)) { fx = nx; }
        else if (!collides(node, node.x, ny)) { fy = ny; }
      }
      if (fx !== node.x || fy !== node.y) {
        node.x = fx; node.y = fy;
        nodeEl.style.left = fx + 'px'; nodeEl.style.top = fy + 'px';
        scheduleDraw();
      }
    }
  };
  const up = () => {
    if (isBatch) {
      movingNodes.forEach(n => {
        const nel = canvas.querySelector(`.node[data-id="${n.id}"]`);
        if (nel) nel.classList.remove('dragging-batch');
      });
    } else {
      nodeEl.classList.remove('dragging');
    }
    clearGuides();
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    if (moved) {
      commitTransaction();   // ★ 提交事务
      markDirty();
    } else {
      abortTransaction();    // ★ 未移动，放弃事务
    }
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function startLink(e, fromId) {
  if (guardReadOnly()) return;
  e.preventDefault(); e.stopPropagation();
  const start = portPos(fromId, 'out');
  if (!start) return;
  const temp = document.createElementNS(NS, 'path');
  temp.setAttribute('class', 'edge temp');
  svg.appendChild(temp);
  let hovered = null;
  const move = ev => {
    const p = toCanvas(ev.clientX, ev.clientY);
    temp.setAttribute('d', curve(start, p));
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const target = under?.closest?.('.node') || null;
    if (hovered && hovered !== target) hovered.classList.remove('drop-target');
    hovered = target;
    if (hovered) hovered.classList.add('drop-target');
  };
  const up = ev => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    temp.remove();
    if (hovered) hovered.classList.remove('drop-target');
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const target = under?.closest?.('.node');
    if (target) connect(fromId, target.dataset.id);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}
function removeEdge(edgeId) {
  const edge = state.edges.find(x => x.id === edgeId);
  if (!edge) return;
  // ★ 连线任一端被锁定 → 不允许断开
  if (guardLocked(getNode(edge.from), '断开连线')) return;
  if (guardLocked(getNode(edge.to), '断开连线')) return;
  pushUndo();
  state.edges = state.edges.filter(x => x.id !== edgeId);
  scheduleDraw(); refreshIds(); markDirty();
  toast('已断开连接');
}
let unlinkMenuEl = null, unlinkMenuOutside = null;
function closeUnlinkMenu() {
  if (unlinkMenuEl) { unlinkMenuEl.remove(); unlinkMenuEl = null; }
  if (unlinkMenuOutside) { document.removeEventListener('pointerdown', unlinkMenuOutside, true); unlinkMenuOutside = null; }
}
/** ★ 多父节点（通用节点）：让用户选断开哪一条入边 */
function openUnlinkMenu(x, y, ins) {
  closeUnlinkMenu();
  const m = el('div', 'mini-menu');
  const tip = el('button');
  tip.style.cursor = 'default'; tip.style.opacity = '.72';
  tip.appendChild(el('small', null, `该节点有 ${ins.length} 个父节点，选择要断开的连接：`));
  tip.onclick = ev => ev.stopPropagation();
  m.appendChild(tip);
  ins.forEach(edge => {
    const p = getNode(edge.from);
    const b = el('button');
    b.append(el('b', null, '✂ 断开 · ' + (p ? (p.title || '未命名') : '（已删除的节点）')));
    b.onclick = ev => { ev.stopPropagation(); closeUnlinkMenu(); removeEdge(edge.id); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  unlinkMenuEl = m;
  const mw = m.offsetWidth, mh = m.offsetHeight;
  const left = Math.max(8, Math.min(x, window.innerWidth - mw - 8));
  let top = y + 8;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, y - mh - 8);
  m.style.left = left + 'px'; m.style.top = top + 'px';
  unlinkMenuOutside = ev => { if (unlinkMenuEl && !unlinkMenuEl.contains(ev.target)) closeUnlinkMenu(); };
  setTimeout(() => document.addEventListener('pointerdown', unlinkMenuOutside, true), 0);
}
function unlink(e, toId) {
  if (guardReadOnly()) return;
  e.preventDefault(); e.stopPropagation();
  const ins = state.edges.filter(x => x.to === toId);
  if (!ins.length) return;
  if (ins.length === 1) { removeEdge(ins[0].id); return; }
  openUnlinkMenu(e.clientX, e.clientY, ins);   // ★ 多父：选一条断开
}

/* =========================================================================

let ctxMenuEl = null;
function closeCtxMenu() {
  if (ctxMenuEl) { ctxMenuEl.remove(); ctxMenuEl = null; }
  document.removeEventListener('pointerdown', ctxOutside, true);
  document.removeEventListener('scroll', closeCtxMenu, true);
}
function ctxOutside(ev) {

function makeCtxItem(label, kbd, onClick, opts = {}) {
  const btn = document.createElement('button');
  if (opts.danger) btn.classList.add('danger');
  if (opts.disabled) btn.disabled = true;
  btn.innerHTML = `<span>${label}</span>${kbd ? `<span class="kbd">${kbd}</span>` : ''}`;
  btn.onclick = ev => {
    ev.stopPropagation();
    closeCtxMenu();
    onClick();
  };
  return btn;
}
function makeCtxSep() {

}

function showCtxMenu(x, y, headerHtml, buildItems) {
  closeCtxMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';

    h.className = 'ctx-header';
    h.innerHTML = headerHtml;
    menu.appendChild(h);
  }
  buildItems(menu);
  document.body.appendChild(menu);

  // 定位

    if (left + r.width > window.innerWidth - 8) left = window.innerWidth - r.width - 8;
    if (top + r.height > window.innerHeight - 8) top = window.innerHeight - r.height - 8;
    menu.style.left = Math.max(8, left) + 'px';
    menu.style.top  = Math.max(8, top) + 'px';
  });
  setTimeout(() => {
    document.addEventListener('pointerdown', ctxOutside, true);
    document.addEventListener('scroll', closeCtxMenu, true);

}

      const expand = id => {
        if (doomed.has(id)) return;
        doomed.add(id);
        for (const e of state.edges) if (e.from === id) expand(e.to);
      };
      selected.forEach(n => expand(n.id));
      state.nodes = state.nodes.filter(n => !doomed.has(n.id));
      state.edges = state.edges.filter(e => !doomed.has(e.from) && !doomed.has(e.to));
      selectedIds.clear();
      render(); markDirty(); updateSelectionBar();
      toast(`已删除 ${doomed.size} 个节点`);
    }, { danger: true, disabled: readOnlyMode }));
  });
}

 *  键盘
 * ========================================================================= */
document.addEventListener('keydown', e => {
  if (ivState.open) return;
  if (batchMask.classList.contains('show')) {
    if (e.key === 'Escape') { e.preventDefault(); closeBatchPanel(); }
    return;
  }
  if (modalMask.classList.contains('show')) return;
  if (importMask.classList.contains('show')) return;
  if (shareMask.classList.contains('show')) return;
  if (pwMask.classList.contains('show')) return;
  if (document.getElementById('onboardOverlay').classList.contains('show')) return;
  if (dashboardOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeDashboard(); return; }
    return;
  }
  const tag = (document.activeElement?.tagName || '').toLowerCase();
  const editing = tag === 'input' || tag === 'textarea' || tag === 'select';

  const cmd = e.ctrlKey || e.metaKey;

  // 撤销 / 重做
  if (cmd && !e.shiftKey && e.key.toLowerCase() === 'z' && !editing) {
    e.preventDefault();
    doUndo();
    return;
  }
  if (cmd && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z')) && !editing) {
    e.preventDefault();
    doRedo();
    return;
  }
  // 复制
  if (cmd && e.key.toLowerCase() === 'c' && !editing) {
    if (selectedIds.size > 0) {
      e.preventDefault();
      if (readOnlyMode) { toast('只读模式，无法复制'); return; }
      if (copySelectedNodes()) toast(`已复制 ${clipboard.nodes.length} 个节点`);
    }
    return;
  }
  // 粘贴
  if (cmd && e.key.toLowerCase() === 'v' && !editing) {
    if (!clipboard || !clipboard.nodes.length) return;
    e.preventDefault();
    if (readOnlyMode) { toast('只读模式，无法粘贴'); return; }
    if (pasteNodes()) toast(`已粘贴 ${clipboard.nodes.length} 个节点`);
    return;
  }
  // 全选
  if (cmd && e.key.toLowerCase() === 'a' && !editing) {
    e.preventDefault(); selectAll();
    return;
  }
  // 视图快捷键
  if (cmd && e.key === '0' && !editing) {
    e.preventDefault(); applyZoom(1);
    return;
  }
  if (cmd && e.key === '1' && !editing) {
    e.preventDefault(); document.getElementById('zoomFit').click();
    return;
  }
  // Esc 取消选择
  if (e.key === 'Escape' && !editing) {
    if (selectedIds.size > 0) { e.preventDefault(); clearSelection(); }
  }
  // Delete 删除
  if (e.key === 'Delete' && !editing && selectedIds.size > 0) {
    e.preventDefault();
    document.getElementById('selDelete').click();
  }
  // F2 重命名选中的单个节点
  if (e.key === 'F2' && !editing && selectedIds.size === 1) {
    e.preventDefault();
    const id = [...selectedIds][0];
    const nel = canvas.querySelector(`.node[data-id="${id}"]`);
    const titleInput = nel?.querySelector('.node-title');
    if (titleInput) { titleInput.focus(); titleInput.select(); }
  }
});

/* =========================================================================
 *  一键排版
 * ========================================================================= */
const LAYOUT_PAD = 80;

function kidsOfNode(n) {
  return state.edges.filter(e => e.from === n.id).map(e => getNode(e.to)).filter(Boolean)
    .sort((a, b) => (a.y - b.y) || (a.x - b.x));
}
function visibleKidsOf(n) { return n.collapsed ? [] : kidsOfNode(n); }
function rootNodes() {
  return state.nodes.filter(n => n.kind === 'root' || !parentOf(n.id))
    .sort((a, b) => (a.y - b.y) || (a.x - b.x));
}
function computeDepths() {
  const depth = new Map();
  const order = [];
  const visited = new Set();
  const dfs = (n, d) => {
    if (!n || visited.has(n.id)) return;
    visited.add(n.id);
    depth.set(n.id, d);
    order.push(n);
    visibleKidsOf(n).forEach(c => dfs(c, d + 1));
  };
  rootNodes().forEach(r => dfs(r, 0));
  state.nodes.forEach(n => { if (!depth.has(n.id)) { depth.set(n.id, 0); order.push(n); } });
  return { depth, order };
}
function fitCanvasSize() {
  const maxX = Math.max(0, ...state.nodes.map(n => n.x + (n._w || NODE_W))) + LAYOUT_PAD;
  const maxY = Math.max(0, ...state.nodes.map(n => n.y + (n._h || DEF_H))) + LAYOUT_PAD;
  setCanvasSize(Math.max(4600, Math.ceil(maxX)), Math.max(3400, Math.ceil(maxY)));
}
function layoutTree() {
  const H_GAP = 46, V_GAP = 74;
  const { depth } = computeDepths();
  const maxDepth = Math.max(0, ...depth.values());
  const levelH = new Array(maxDepth + 1).fill(60);
  for (const n of state.nodes) {
    const d = depth.get(n.id) ?? 0;
    levelH[d] = Math.max(levelH[d], n._h || DEF_H);
  }
  const levelY = [];
  let acc = LAYOUT_PAD;
  for (let d = 0; d <= maxDepth; d++) { levelY[d] = acc; acc += levelH[d] + V_GAP; }
  const wCache = new Map();
  function subtreeW(n) {
    if (wCache.has(n.id)) return wCache.get(n.id);
    const kids = visibleKidsOf(n);
    let w = NODE_W;
    if (kids.length) {
      w = kids.reduce((s, k, i) => s + subtreeW(k) + (i ? H_GAP : 0), 0);
      w = Math.max(w, NODE_W);
    }
    wCache.set(n.id, w); return w;
  }
  function place(n, left) {
    const d = depth.get(n.id) ?? 0;
    const w = subtreeW(n);
    n.x = Math.round(left + (w - NODE_W) / 2);
    n.y = Math.round(levelY[d]);
    const kids = visibleKidsOf(n);
    if (!kids.length) return;
    const total = kids.reduce((s, k, i) => s + subtreeW(k) + (i ? H_GAP : 0), 0);
    let cx = left + (w - total) / 2;
    for (const k of kids) { place(k, cx); cx += subtreeW(k) + H_GAP; }
  }
  let cursor = LAYOUT_PAD;
  for (const r of rootNodes()) { place(r, cursor); cursor += subtreeW(r) + H_GAP * 2.4; }
}
function layoutVertical() {
  const COL_GAP = 130, ROW_GAP = 42;
  const { depth, order } = computeDepths();
  const maxDepth = Math.max(0, ...depth.values());
  const cols = Array.from({ length: maxDepth + 1 }, () => []);
  order.forEach(n => cols[depth.get(n.id) ?? 0].push(n));
  for (let d = 0; d <= maxDepth; d++) {
    const x = LAYOUT_PAD + d * (NODE_W + COL_GAP);
    let y = LAYOUT_PAD;
    for (const n of cols[d]) {
      n.x = Math.round(x); n.y = Math.round(y);
      y += (n._h || DEF_H) + ROW_GAP;
    }
  }
}
function autoLayout(mode = 'vertical', opts = {}) {
  const { forceFreeMove = true, toastMsg = true, scrollToStart = true, undoable = true } = opts;
  if (guardReadOnly()) return;
  if (!state.nodes.length) { if (toastMsg) toast('没有节点可排版'); return; }
  if (undoable) pushUndo();
  visibleSet = computeVisible();
  measureNodeHeights();
  // ★ 锁定节点不参与排版，保持原位
  const lockedPos = state.nodes.filter(n => n.locked).map(n => ({ n, x: n.x, y: n.y }));
  if (mode === 'tree') layoutTree(); else layoutVertical();
  lockedPos.forEach(p => { p.n.x = p.x; p.n.y = p.y; });
  fitCanvasSize();
  render(); markDirty();
  if (forceFreeMove) setFreeMove(true, true);
  if (scrollToStart) stage.scrollTo({ left: 0, top: 0, behavior: 'smooth' });
  if (toastMsg) {
    toast((mode === 'tree' ? '已按「横向树形」排列' : '已按「往右竖向」排列')
      + (lockedPos.length ? `（已跳过 ${lockedPos.length} 个锁定节点）` : ''));
  }
}

/* =========================================================================
 *  粘贴截图
 * ========================================================================= */
document.addEventListener('paste', async e => {
  if (readOnlyMode) return;
  if (ivState.open) return;
  if (!activeNodeId) return;
  const node = getNode(activeNodeId);
  if (!node) return;
  if (guardLocked(node, '粘贴截图')) return;
  const items = [...(e.clipboardData?.items || [])];
  const imgs = items.filter(i => i.type.startsWith('image/'));
  if (!imgs.length) return;
  e.preventDefault();
  pushUndo();
  let n = 0;
  for (const it of imgs) {
    const f = it.getAsFile();
    if (!f) continue;
    try { node.images.push(await compressImage(f)); n++; } catch (err) {}
  }
  if (n) { render(); markDirty(); toast(`已粘贴 ${n} 张截图`); }
});

function compressImage(file, maxW = 1100, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================================
 *  图片查看器
 * ========================================================================= */
const ivState = { open: false, scale: 1, tx: 0, ty: 0, images: [], index: 0, title: '' };
const ivRoot  = document.getElementById('imgViewer');
const ivStage = document.getElementById('ivStage');
const ivImg   = document.getElementById('ivImg');
const ivZoomEl = document.getElementById('ivZoom');
const ivIdxEl  = document.getElementById('ivIdx');

function openImageViewer(images, index, title) {
  if (!images || !images.length) return;
  hideAltPreview();
  ivState.images = images;
  ivState.index  = Math.max(0, Math.min(index, images.length - 1));
  ivState.title  = title || '';
  ivState.open   = true;
  ivRoot.classList.add('show');
  loadIvImage();
}
function loadIvImage() {
  ivImg.onload = () => fitImage();
  ivImg.src = ivState.images[ivState.index];
  document.getElementById('ivTitle').textContent = ivState.title;
  const multi = ivState.images.length > 1;
  document.getElementById('ivPrev').style.display = multi ? '' : 'none';
  document.getElementById('ivNext').style.display = multi ? '' : 'none';
  ivIdxEl.style.display = multi ? '' : 'none';
  ivIdxEl.textContent = `${ivState.index + 1}/${ivState.images.length}`;
}
function applyIvTransform() {
  ivImg.style.transform = `translate(${ivState.tx}px, ${ivState.ty}px) scale(${ivState.scale})`;
  ivZoomEl.textContent = Math.round(ivState.scale * 100) + '%';
}
function fitImage() {
  const nw = ivImg.naturalWidth || 1, nh = ivImg.naturalHeight || 1;
  const sw = ivStage.clientWidth - 90, sh = ivStage.clientHeight - 90;
  ivState.scale = Math.max(0.05, Math.min(sw / nw, sh / nh, 1.6));
  ivState.tx = 0; ivState.ty = 0;
  applyIvTransform();
}
function actualSize() { ivState.scale = 1; ivState.tx = 0; ivState.ty = 0; applyIvTransform(); }
function zoomAt(newScale, mx, my) {
  newScale = Math.max(0.05, Math.min(12, newScale));
  const ratio = newScale / ivState.scale;
  ivState.tx = mx - ratio * (mx - ivState.tx);
  ivState.ty = my - ratio * (my - ivState.ty);
  ivState.scale = newScale;
  applyIvTransform();
}
function zoomCenter(f) { zoomAt(ivState.scale * f, 0, 0); }
function closeImageViewer() { ivState.open = false; ivRoot.classList.remove('show'); ivImg.removeAttribute('src'); }
function ivPrev() { if (ivState.images.length < 2) return; ivState.index = (ivState.index - 1 + ivState.images.length) % ivState.images.length; loadIvImage(); }
function ivNext() { if (ivState.images.length < 2) return; ivState.index = (ivState.index + 1) % ivState.images.length; loadIvImage(); }

document.getElementById('ivClose').onclick = closeImageViewer;
document.getElementById('ivFit').onclick = fitImage;
document.getElementById('ivActual').onclick = actualSize;
document.getElementById('ivZoomIn').onclick = () => zoomCenter(1.25);
document.getElementById('ivZoomOut').onclick = () => zoomCenter(1 / 1.25);
document.getElementById('ivPrev').onclick = ivPrev;
document.getElementById('ivNext').onclick = ivNext;

ivStage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = ivStage.getBoundingClientRect();
  const mx = e.clientX - r.left - r.width / 2;
  const my = e.clientY - r.top - r.height / 2;
  zoomAt(ivState.scale * (e.deltaY < 0 ? 1.14 : 1 / 1.14), mx, my);
}, { passive: false });
ivStage.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  const sx = e.clientX - ivState.tx;
  const sy = e.clientY - ivState.ty;
  ivStage.classList.add('grabbing');
  const move = ev => { ivState.tx = ev.clientX - sx; ivState.ty = ev.clientY - sy; applyIvTransform(); };
  const up = () => {
    ivStage.classList.remove('grabbing');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});
ivStage.addEventListener('dblclick', () => fitImage());

document.addEventListener('keydown', e => {
  if (!ivState.open) return;
  switch (e.key) {
    case 'Escape':     closeImageViewer(); break;
    case 'ArrowLeft':  ivPrev(); break;
    case 'ArrowRight': ivNext(); break;
    case '+': case '=': zoomCenter(1.25); break;
    case '-':           zoomCenter(1/1.25); break;
    case '0':           fitImage(); break;
  }
});

/* =========================================================================
 *  搜索
 * ========================================================================= */
let searchQuery = '';
let searchHits = [];
let searchIdx = -1;
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');

function doSearch(q) {
  searchQuery = q.trim().toLowerCase();
  searchHits = []; searchIdx = -1;
  if (!searchQuery) { applySearchHighlight(); updateSearchCount(); return; }
  let needRender = false;
  for (const n of state.nodes) {
    const id = computeId(n);
    const hay = [n.title, n.note, id || '', n.baseId || ''].join(' ').toLowerCase();
    if (!hay.includes(searchQuery)) continue;
    searchHits.push(n.id);
    let cur = parentOf(n.id), g = 0;
    while (cur && g++ < 60) {
      if (cur.collapsed) { cur.collapsed = false; needRender = true; }
      cur = parentOf(cur.id);
    }
  }
  if (needRender) render();
  applySearchHighlight(); updateSearchCount();
}
function applySearchHighlight() {
  const nodes = canvas.querySelectorAll('.node');
  if (!searchQuery) { nodes.forEach(n => n.classList.remove('search-hit', 'search-dim')); return; }
  const hitSet = new Set(searchHits);
  nodes.forEach(n => {
    const isHit = hitSet.has(n.dataset.id);
    n.classList.toggle('search-hit', isHit);
    n.classList.toggle('search-dim', !isHit);
  });
}
function updateSearchCount() {
  if (!searchQuery) { searchCount.textContent = ''; return; }
  searchCount.textContent = searchHits.length
    ? `${searchIdx >= 0 ? searchIdx + 1 : 0}/${searchHits.length}` : '0';
}
function gotoHit(delta) {
  if (!searchHits.length) return;
  searchIdx = (searchIdx + delta + searchHits.length) % searchHits.length;
  scrollToNode(searchHits[searchIdx]);
  updateSearchCount();
}
searchInput.addEventListener('input', () => doSearch(searchInput.value));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); gotoHit(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { searchInput.value = ''; doSearch(''); searchInput.blur(); }
});
document.getElementById('searchNext').onclick = () => gotoHit(1);
document.getElementById('searchPrev').onclick = () => gotoHit(-1);

function scrollToNode(id) {
  const nodeEl = canvas.querySelector(`.node[data-id="${id}"]`);
  if (!nodeEl) {
    // 虚拟化下节点可能未渲染，先滚动再同步
    const n = getNode(id);
    if (n) {
      const targetX = (n.x + (n._w || NODE_W) / 2) * zoom - stage.clientWidth / 2;
      const targetY = (n.y + (n._h || DEF_H) / 2) * zoom - stage.clientHeight / 2;
      stage.scrollTo({ left: targetX, top: targetY, behavior: 'smooth' });
      scheduleViewportSync();
      setTimeout(() => {
        const nel = canvas.querySelector(`.node[data-id="${id}"]`);
        if (nel) { nel.classList.add('flash'); setTimeout(() => nel.classList.remove('flash'), 1200); }
      }, 400);
    }
    return;
  }
  const targetX = (nodeEl.offsetLeft + nodeEl.offsetWidth / 2) * zoom - stage.clientWidth / 2;
  const targetY = (nodeEl.offsetTop + nodeEl.offsetHeight / 2) * zoom - stage.clientHeight / 2;
  stage.scrollTo({ left: targetX, top: targetY, behavior: 'smooth' });
  nodeEl.classList.add('flash');
  setTimeout(() => nodeEl.classList.remove('flash'), 1200);
}

/* =========================================================================
 *  XLSX 生成器
 * ========================================================================= */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files, mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034B50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    parts.push(lh, data);
    const cd = new Uint8Array(46 + nameBytes.length);
    const dv2 = new DataView(cd.buffer);
    dv2.setUint32(0, 0x02014B50, true);
    dv2.setUint16(4, 20, true); dv2.setUint16(6, 20, true);
    dv2.setUint16(8, 0x0800, true);
    dv2.setUint16(10, 0, true); dv2.setUint16(12, 0, true);
    dv2.setUint16(14, 0x21, true);
    dv2.setUint32(16, crc, true);
    dv2.setUint32(20, data.length, true);
    dv2.setUint32(24, data.length, true);
    dv2.setUint16(28, nameBytes.length, true);
    dv2.setUint16(30, 0, true); dv2.setUint16(32, 0, true);
    dv2.setUint16(34, 0, true); dv2.setUint16(36, 0, true);
    dv2.setUint32(38, 0, true);
    dv2.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);
    offset += lh.length + data.length;
  }
  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const dv3 = new DataView(eocd.buffer);
  dv3.setUint32(0, 0x06054B50, true);
  dv3.setUint16(4, 0, true); dv3.setUint16(6, 0, true);
  dv3.setUint16(8, files.length, true);
  dv3.setUint16(10, files.length, true);
  dv3.setUint32(12, centralSize, true);
  dv3.setUint32(16, offset, true);
  dv3.setUint16(20, 0, true);
  return new Blob([...parts, ...central, eocd], { type: mimeType });
}
function xmlEsc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'

function xmlClean(s) { return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ''); }

  let s = '';
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function buildSheetXml(rows, colWidths) {
  const cols = colWidths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const rowsXml = rows.map((row, ri) => {
    const cells = row.map((val, ci) => {
      const ref = colLetter(ci + 1) + (ri + 1);
      const s = ri === 0 ? ' s="1"' : '';
      const t = xmlEsc(xmlClean(val == null ? '' : val));
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${t}</t></is></c>`;
    }).join('');
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<cols>${cols}</cols>
<sheetData>${rowsXml}</sheetData>
</worksheet>`;
}

function todayStamp() {
  const d = new Date();

/* =========================================================================
 *  ★ 导出 XMind 脑图（.xmind 就是一个 zip 包）
 *    同时写入新格式 content.json 与旧格式 content.xml，兼顾不同 XMind 版本
 * ========================================================================= */
let mindIdSeq = 0;
function nextMindId() {
  return 't' + Date.now().toString(36) + (mindIdSeq++).toString(36) + Math.random().toString(36).slice(2, 6);
}

/** 节点树 → 脑图主题树（含折叠的子级；同级按 y/x 排序） */
function buildMindTopics() {
  const visited = new Set();
  const toTopic = n => {
    if (!n || visited.has(n.id)) return null;
    visited.add(n.id);
    const code = computeId(n);
    const t = {
      id: nextMindId(),
      title: n.title || '未命名',
      note: code ? `订货号：${code}` : (n.kind === 'root' ? '' : '未连接'),
      children: []
    };
    for (const k of kidsOfNode(n)) {
      const c = toTopic(k);
      if (c) t.children.push(c);
    }
    return t;
  };
  const trees = rootNodes().map(toTopic).filter(Boolean);
  // 兜底：数据异常（环 / 游离）时把没走到的节点也带上
  for (const n of state.nodes) {
    if (visited.has(n.id)) continue;
    const t = toTopic(n);
    if (t) trees.push(t);
  }
  if (!trees.length) return null;
  if (trees.length === 1) return trees[0];
  return { id: nextMindId(), title: '订货号', note: '', children: trees };
}

/** 新格式（XMind Zen / 2020+）：content.json 的 topic */
function mindTopicToJson(t) {
  const o = { id: t.id, class: 'topic', title: t.title };
  if (t.note) o.notes = { plain: { content: t.note } };
  if (t.children.length) o.children = { attached: t.children.map(mindTopicToJson) };
  return o;
}
/** 旧格式（XMind 8 及更早）：content.xml 的 topic */
function mindTopicToXml(t, depth) {
  const pad = '  '.repeat(depth);
  let s = `${pad}<topic id="${xmlEsc(t.id)}">\n`;
  s += `${pad}  <title>${xmlEsc(t.title)}</title>\n`;
  if (t.note) s += `${pad}  <notes><plain>${xmlEsc(t.note)}</plain></notes>\n`;
  if (t.children.length) {
    s += `${pad}  <children>\n${pad}    <topics type="attached">\n`;
    s += t.children.map(c => mindTopicToXml(c, depth + 3)).join('');
    s += `${pad}    </topics>\n${pad}  </children>\n`;
  }
  s += `${pad}</topic>\n`;
  return s;
}

function exportXmind() {
  if (!state.nodes.length) return toast('还没有任何节点');
  const tree = buildMindTopics();
  if (!tree) return toast('没有可导出的节点');
  try {
    const sheetId = nextMindId();
    const sheetTitle = '订货号';
    const contentJson = JSON.stringify([{
      id: sheetId, class: 'sheet', title: sheetTitle,
      rootTopic: mindTopicToJson(tree)
    }]);
    const metadataJson = JSON.stringify({
      creator: { name: '订货号生成器', version: '1.0' },
      activeSheetId: sheetId
    });
    const manifestJson = JSON.stringify({
      'file-entries': { 'content.json': {}, 'metadata.json': {} }
    });
    const contentXml = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n'
      + '<xmap-content xmlns="urn:xmind:xmap:xmlns:content:2.0" version="2.0">\n'
      + `  <sheet id="${xmlEsc(sheetId)}">\n`
      + mindTopicToXml(tree, 2)
      + `    <title>${xmlEsc(sheetTitle)}</title>\n`
      + '  </sheet>\n</xmap-content>\n';
    const metaManifest = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n'
      + '<manifest xmlns="urn:xmind:xmap:xmlns:manifest:1.0">\n'
      + '  <file-entry full-path="content.xml" media-type="text/xml"/>\n'
      + '  <file-entry full-path="META-INF/" media-type=""/>\n'
      + '  <file-entry full-path="META-INF/manifest.xml" media-type="text/xml"/>\n'
      + '</manifest>\n';

    const blob = zipStore([
      { name: 'content.json',        data: contentJson },
      { name: 'metadata.json',       data: metadataJson },
      { name: 'manifest.json',       data: manifestJson },
      { name: 'content.xml',         data: contentXml },
      { name: 'META-INF/manifest.xml', data: metaManifest }
    ], 'application/x-xmind');
    downloadBlob(blob, `订货号脑图_${todayStamp()}.xmind`);
    toast(`已导出 XMind 脑图（${state.nodes.length} 个节点 · 含折叠子级）`);
  } catch (err) {
    toast('导出脑图失败：' + (err.message || err));
  }
}

/* =========================================================================
 *  导出数据收集
 * ========================================================================= */
function collectExportData() {
  const conflicts = checkDuplicates();
  const depthMap = computeNodeDepth();
  return state.nodes.map(n => {
    const p = parentOf(n.id);
    const parentCount = parentsOf(n.id).length;
    const id = computeId(n);
    const depth = depthMap.get(n.id) ?? 0;
    let status = '正常';
    if (n.generic) status = '通用件';
    else if (n.kind !== 'root' && !p) status = '未连接';
    else if (conflicts.has(n.id)) status = '同级重复';
    return {
      node: n,
      id: id === null ? '未连接' : (id || '（空）'),
      idRaw: id, name: n.title || '', depth,
      parentName: n.generic
        ? (parentCount > 1 ? `通用·${parentCount} 个父` : '通用·独立')
        : (p ? (p.title || '') : '—'),
      note: n.note || '', status,
      imageCount: (n.images || []).length,
      batchCount: (n.batches || []).length,
      isLeaf: !state.edges.some(e => e.from === n.id),
      isRoot: n.kind === 'root'
    };
  }).sort((a, b) => (a.depth - b.depth) || (a.node.y - b.node.y) || (a.node.x - b.node.x));
}
function buildSheetRows() {
  const rows = collectExportData();
  return [
    ['订货号', '产品名称', '层级', '父节点', '备注', '截图数', '批号数', '状态', '是否成品'],
    ...rows.map(r => [r.id, r.name, String(r.depth), r.parentName, r.note, String(r.imageCount), String(r.batchCount || 0), r.status, r.isLeaf ? '是' : ''])
  ];
}

function renderDashboardStats() {
  const el = document.getElementById('dashStats');
  if (!el) return;
  const rows = collectExportData();
  const conflicts = checkDuplicates();
  const roots = rows.filter(r => r.isRoot).length;
  const leaves = rows.filter(r => r.isLeaf).length;
  const dup = conflicts.size;
  const unlinked = rows.filter(r => r.status === '未连接').length;
  const maxDepth = rows.length ? Math.max(...rows.map(r => r.depth)) : 0;
  const imgTotal = rows.reduce((s, r) => s + r.imageCount, 0);
  el.innerHTML = `
    <div class="dstat"><span class="dv">${rows.length}</span><span class="dl">总节点</span></div>

    <div class="dstat"><span class="dv">${maxDepth + 1}</span><span class="dl">层级数</span></div>

    ${unlinked ? `<div class="dstat warn"><span class="dv">${unlinked}</span><span class="dl">未连接</span></div>` : ''}

const hasCompression = typeof CompressionStream !== 'undefined';

function bytesToBase64Url(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function gzipCompress(bytes) {
  if (!hasCompression) return null;
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  writer.write(bytes); writer.close();
  const chunks = [];
  const reader = cs.readable.getReader();
  while (true) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); }
  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}
async function gzipDecompress(bytes) {
  if (!hasCompression) throw new Error('浏览器不支持解压');
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bytes); writer.close();
  const chunks = [];
  const reader = ds.readable.getReader();
  while (true) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); }
  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encryptWithPassword(jsonStr, password) {
  if (!hasSubtle) throw new Error('当前环境不支持加密（需要 HTTPS 或 localhost）');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(jsonStr));
  const cipher = new Uint8Array(cipherBuf);
  let body = cipher, compressed = false;
  if (hasCompression) {
    try {
      const gz = await gzipCompress(cipher);
      if (gz && gz.length < cipher.length) { body = gz; compressed = true; }
    } catch (e) {}
  }
  const out = new Uint8Array(2 + 16 + 12 + body.length);
  out[0] = 0xA7; out[1] = compressed ? 0x01 : 0x00;
  out.set(salt, 2); out.set(iv, 18); out.set(body, 30);
  return 'E' + bytesToBase64Url(out);
}
async function decryptWithPassword(encoded, password) {
  if (!hasSubtle) throw new Error('当前环境不支持解密（需要 HTTPS 或 localhost）');
  const raw = base64UrlToBytes(encoded);
  if (raw[0] !== 0xA7) throw new Error('数据格式错误');
  const flags = raw[1];
  const salt = raw.slice(2, 18);
  const iv = raw.slice(18, 30);
  let body = raw.slice(30);
  if (flags & 0x01) body = await gzipDecompress(body);
  const key = await deriveKey(password, salt);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, body);
  return new TextDecoder().decode(plainBuf);
}
async function compressPayload(str) {
  const bytes = new TextEncoder().encode(str);
  if (!hasCompression) return 'U' + bytesToBase64Url(bytes);
  try {
    const gz = await gzipCompress(bytes);
    if (gz && gz.length < bytes.length) return 'Z' + bytesToBase64Url(gz);
  } catch (e) {}
  return 'U' + bytesToBase64Url(bytes);
}
async function decompressPayload(encoded) {
  const prefix = encoded[0];
  const body = encoded.slice(1);
  if (prefix === 'U') return new TextDecoder().decode(base64UrlToBytes(body));
  if (prefix === 'Z') {
    const bytes = base64UrlToBytes(body);
    const plain = await gzipDecompress(bytes);
    return new TextDecoder().decode(plain);
  }
  if (encoded.startsWith('raw_')) return new TextDecoder().decode(base64UrlToBytes(encoded.slice(4)));
  if (encoded.startsWith('gz_')) {
    const bytes = base64UrlToBytes(encoded.slice(3));
    const plain = await gzipDecompress(bytes);
    return new TextDecoder().decode(plain);
  }
  return new TextDecoder().decode(base64UrlToBytes(encoded));
}

async function generateShareLink() {

  const noteInput = document.getElementById('shareNote');
  const roCheck = document.getElementById('shareReadOnly');

    const now = Date.now();

      v: 14,

        createdAt: now,

        readOnly: readOnlyFlag,
        sharerNote,

      data: stripImagesForShare()

    let hashPart;
    if (password) {
      const encoded = await encryptWithPassword(json, password);
      hashPart = 'enc=' + encoded;
    } else {
      const encoded = await compressPayload(json);
      hashPart = 'data=' + encoded;

    const shareUrl = `${baseUrl}#${hashPart}`;
    const urlSize = shareUrl.length;

    const expireText = expireMs === 0 ? '永久有效'

          return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        })();
    let warnHtml = '';

      <div style="margin-top:18px;border-top:1px dashed var(--border);padding-top:14px">
        <div class="share-hint ${password ? 'ok' : 'warn'}">
          ${password ? '🔐 已启用密码加密（PBKDF2 + AES-GCM 256）' : '⚠ 未设置密码，链接任何持有者都可查看'}
        </div>
        <div class="share-meta-card">
          <div class="share-meta-row">
            <span class="k">加密</span>
            <span class="v ${password ? 'hl' : 'danger'}">${password ? '已加密（AES-256-GCM）' : '未加密'}</span>
          </div>
          <div class="share-meta-row">
            <span class="k">有效期</span>
            <span class="v">${escapeHtml(expireText)}</span>
          </div>
          <div class="share-meta-row">
            <span class="k">访问模式</span>
            <span class="v">${readOnlyFlag ? '🔒 只读（禁止编辑）' : '✏ 可编辑'}</span>
          </div>
          ${sharerNote ? `<div class="share-meta-row">
            <span class="k">分享备注</span>
            <span class="v">${escapeHtml(sharerNote)}</span>
          </div>` : ''}
          <div class="share-meta-row">
            <span class="k">链接大小</span>
            <span class="v">${sizeStr}</span>
          </div>
        </div>
        ${warnHtml}
        <div class="share-url-box">
          <textarea id="shareUrlText" readonly>${escapeHtml(shareUrl)}</textarea>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <button class="tbtn success" id="shareCopyBtn">📋 复制链接</button>
          <button class="tbtn" id="shareTestBtn">🔍 打开测试</button>
        </div>
        ${password ? `<div class="share-hint info" style="margin-top:10px">
          ⚠ 请通过<b>不同于链接的渠道</b>把密码告知接收者。
        </div>` : ''}
      </div>
    `;
    document.getElementById('shareCopyBtn').onclick = () => {
      navigator.clipboard?.writeText(shareUrl).then(
        () => toast('链接已复制到剪贴板'),

  } catch (err) {

}
